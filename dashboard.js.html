    // Ordena os rótulos de período (mês/semana/trimestre) de um objeto de breakdown, igual ao gráfico padrão
    function getSortedPeriodLabels(dataObj, group) {
        const monthsOrder = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
        const quartersOrder = ["Q1", "Q2", "Q3", "Q4"];
        if (group === 'monthly') return monthsOrder.filter(m => dataObj[m] !== undefined);
        if (group === 'quarterly') return quartersOrder.filter(q => dataObj[q] !== undefined);
        return Object.keys(dataObj).sort((a, b) => parseInt(a.substring(1)) - parseInt(b.substring(1)));
    }

    // Decide qual desenho fazer no gráfico de Evolução: combo Volumetria+MTTR (default) ou barras agrupadas por dimensão
    function renderEvolutionByCurrentDimension() {
        const dimension = CURRENT_FILTERS.evolutionDimension || 'default';
        const group = CURRENT_FILTERS.evolutionGrouping || 'monthly';

        if (dimension === 'default') {
            const data = ALL_DATA.evolutionData ? ALL_DATA.evolutionData[group] : null;
            if (data) drawEvolutionChart(data.metrics, data.mttr, data.title);
            updateEvolutionSideStats(ALL_DATA.currentKpis, null);
            return;
        }

        const TITLES = {
            severidade: 'por Severidade',
            deteccao: 'por Origem da Detecção',
            jornada: 'por Jornada Impactada',
            pais: 'por País Impactado'
        };
        const GROUP_TITLES = { monthly: 'Evolução Mensal', weekly: 'Evolução Semanal', quarterly: 'Evolução Trimestral' };
        const FIXED_SERIES = {
            severidade: [
                { key: 'sev0', label: 'Sev0', color: '#e94839' },
                { key: 'sev1', label: 'Sev1', color: '#FF6600' }
            ],
            deteccao: [
                { key: 'End-users', label: 'End-users', color: '#045473' },
                { key: 'Monitoração', label: 'Monitoração', color: '#1B472A' },
                { key: 'Experiências', label: 'Experiências', color: '#FF6600' }
            ]
        };

        const breakdown = ALL_DATA.dimensionBreakdowns ? ALL_DATA.dimensionBreakdowns[dimension] : null;
        const data = breakdown ? breakdown[group] : {};
        const title = `${GROUP_TITLES[group] || 'Evolução'} ${TITLES[dimension] || ''}`;

        drawEvolutionGroupedChart(data || {}, FIXED_SERIES[dimension] || null, title, group);
    }

    // Desenha um gráfico de barras agrupadas: 1 grupo por período, 1 série (barra) por categoria da dimensão escolhida.
    // Mostra rótulos de dados (quantidade + %) em cada barra e atualiza o painel lateral com os totais por categoria.
    function drawEvolutionGroupedChart(breakdownByPeriod, seriesConfig, title, group) {
        drawGenericGroupedChart({
            canvasId: 'monthlyIncidentsChart',
            chartKey: 'monthlyChartInstance',
            titleElId: 'evolution-chart-title',
            breakdownByPeriod: breakdownByPeriod,
            seriesConfig: seriesConfig,
            title: title,
            group: group,
            updateSideStats: true
        });
    }

    // Gráfico de barras agrupadas por categoria (ex: Jornada, País, Origem, Deploy/Tradicional), com rótulos de
    // quantidade + % em cada barra, e opcionalmente uma linha de MTTR geral do período sobreposta (eixo secundário).
    // Reaproveitado pela Evolução geral e pelas seções locais (Jornadas & Países, Origem da Detecção, Mudanças).
    function drawGenericGroupedChart(opts) {
        const { canvasId, chartKey, titleElId, breakdownByPeriod, seriesConfig, title, group, mttrData, updateSideStats, weekWindow, noOthersCap, legendContainerId, legendWithFlags } = opts;
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;

        if (titleElId) {
            const titleEl = document.getElementById(titleElId);
            if (titleEl) titleEl.textContent = title;
        }

        let labels = getSortedPeriodLabels(breakdownByPeriod, group);

        // Item 2: no modo Semanal, evita poluir a visão mostrando só uma janela de N semanas por vez
        // (a semana atual + as anteriores), navegável via setas (ver setupWeekWindowNav).
        if (group === 'weekly' && weekWindow) {
            const total = labels.length;
            const maxOffset = Math.max(0, total - weekWindow.size);
            const offset = Math.min(weekWindow.offset || 0, maxOffset);
            const end = total - offset;
            const start = Math.max(0, end - weekWindow.size);
            labels = labels.slice(start, end);
            if (weekWindow.onBoundsComputed) weekWindow.onBoundsComputed({ offset, maxOffset });
        }

        const displayLabels = labels.map(l => l.charAt(0).toUpperCase() + l.slice(1));

        let series = seriesConfig;
        if (!series) {
            // Dimensões dinâmicas (Jornada/País): descobre categorias a partir dos dados. Por padrão limita a
            // Top 6 + "Outros"; com noOthersCap (ex: País, item 2) inclui todas as categorias encontradas.
            const totals = {};
            labels.forEach(p => {
                Object.keys(breakdownByPeriod[p] || {}).forEach(cat => {
                    totals[cat] = (totals[cat] || 0) + breakdownByPeriod[p][cat];
                });
            });
            const palette = ['#1B472A', '#FF6600', '#045473', '#930E44', '#E29627', '#6A803E', '#99aedb', '#60002C', '#C9E055', '#FFBE28', '#ac2f1c', '#4a1c0e', '#112E22', '#94a3b8'];
            if (noOthersCap) {
                const allCats = Object.keys(totals).sort((a, b) => totals[b] - totals[a]);
                series = allCats.map((cat, idx) => ({ key: cat, label: cat, color: palette[idx % palette.length] }));
            } else {
                const topCats = Object.keys(totals).sort((a, b) => totals[b] - totals[a]).slice(0, 6);
                series = topCats.map((cat, idx) => ({ key: cat, label: cat, color: palette[idx % palette.length] }));
                if (Object.keys(totals).length > topCats.length) {
                    series.push({ key: '__outros__', label: 'Outros', color: '#94a3b8' });
                }
            }
        }

        // Totais por período (para calcular %) e por série (para o painel lateral, quando aplicável)
        const periodTotals = labels.map(p => {
            const periodData = breakdownByPeriod[p] || {};
            return Object.keys(periodData).reduce((sum, k) => sum + periodData[k], 0);
        });
        const seriesTotals = series.map(s => ({ label: s.label, color: s.color, value: 0 }));

        const datasets = series.map((s, sIdx) => ({
            label: s.label,
            backgroundColor: s.color,
            yAxisID: 'y',
            data: labels.map((p, pIdx) => {
                const periodData = breakdownByPeriod[p] || {};
                let value;
                if (s.key === '__outros__') {
                    const known = series.filter(x => x.key !== '__outros__').map(x => x.key);
                    value = Object.keys(periodData).reduce((sum, k) => sum + (known.indexOf(k) === -1 ? periodData[k] : 0), 0);
                } else {
                    value = periodData[s.key] || 0;
                }
                seriesTotals[sIdx].value += value;
                return value;
            }),
            datalabels: {
                display: (ctx) => ctx.dataset.data[ctx.dataIndex] > 0,
                anchor: 'end', align: 'end', offset: -2, rotation: -90,
                font: { size: 9, weight: 'bold' },
                color: '#374151',
                formatter: (value, ctx) => {
                    const periodTotal = periodTotals[ctx.dataIndex] || 0;
                    const pct = periodTotal > 0 ? Math.round((value / periodTotal) * 1000) / 10 : 0;
                    return `${value} (${pct}%)`;
                }
            }
        }));

        const scales = {
            x: { stacked: false },
            y: { position: 'left', beginAtZero: true, stacked: false }
        };

        if (mttrData) {
            datasets.push({
                label: 'MTTR (h)', type: 'line', data: labels.map(p => { const v = mttrData[p]; return v !== undefined ? v.toFixed(2) : 0; }),
                borderColor: '#e94839', backgroundColor: '#e94839', yAxisID: 'y-mttr', order: 0,
                datalabels: { display: false }
            });
            scales['y-mttr'] = { position: 'right', beginAtZero: true, grid: { display: false } };
        }

        if (updateSideStats) updateEvolutionSideStats(null, seriesTotals);

        // Item 2: quando há um container de legenda customizado (ex: País, com bandeiras), usa ele
        // em vez da legenda padrão do Chart.js, listando TODAS as categorias (sem "Outros").
        const legendEl = legendContainerId ? document.getElementById(legendContainerId) : null;
        if (legendEl) {
            legendEl.innerHTML = series.map(s => `
                <span class="inline-flex items-center gap-1.5 text-[10px] font-semibold text-slate-600 bg-slate-50 border border-slate-200 rounded-full px-2 py-1">
                    ${legendWithFlags ? buildFlagSvg(s.key, 16, 11) : `<span class="inline-block w-2.5 h-2.5 rounded-full" style="background:${s.color}"></span>`}
                    ${escapeXml(s.label)}
                </span>
            `).join('');
        }

        if (window[chartKey]) window[chartKey].destroy();
        window[chartKey] = new Chart(canvas.getContext('2d'), {
            type: 'bar',
            data: { labels: displayLabels, datasets: datasets },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                layout: { padding: { top: 24 } },
                scales: scales,
                plugins: {
                    legend: legendEl ? { display: false } : { display: true, position: 'bottom', labels: { boxWidth: 12, padding: 15, font: { size: 11 } } },
                    tooltip: { mode: 'index', intersect: false }
                }
            }
        });
    }

    function drawEvolutionChart(metrics, mttrData, title) {
        drawGenericEvolutionChart({
            canvasId: 'monthlyIncidentsChart',
            chartKey: 'monthlyChartInstance',
            titleElId: 'evolution-chart-title',
            metrics: metrics,
            mttrData: mttrData,
            title: title,
            onBarClick: (label, title) => {
                let contextType = 'monthly';
                if (title.includes("Semanal")) contextType = 'weekly';
                else if (title.includes("Trimestral")) contextType = 'quarterly';
                openIncidentsModal(contextType, label);
            }
        });
    }

    // Gráfico combo genérico (Barras = Volume, Linha = MTTR), reaproveitado pela Evolução geral e pelas
    // seções locais (Jornadas & Países, Origem da Detecção, Mudanças), cada uma com seu próprio canvas.
    function drawGenericEvolutionChart(opts) {
        const { canvasId, chartKey, titleElId, metrics, mttrData, title, onBarClick } = opts;
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;

        if (titleElId) {
            const titleEl = document.getElementById(titleElId);
            if (titleEl) titleEl.textContent = title;
        }

        const monthsOrder = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
        const quartersOrder = ["Q1", "Q2", "Q3", "Q4"];

        let labels = [];
        if (title.includes("Mensal")) {
            labels = monthsOrder.filter(m => metrics[m] !== undefined);
        } else if (title.includes("Trimestral")) {
            labels = quartersOrder.filter(q => metrics[q] !== undefined);
        } else {
            labels = Object.keys(metrics).sort((a, b) => {
                const na = parseInt(a.substring(1));
                const nb = parseInt(b.substring(1));
                return na - nb;
            });
        }

        const displayLabels = labels.map(l => l.charAt(0).toUpperCase() + l.slice(1));
        const counts = labels.map(l => metrics[l].count);
        const mttrs = labels.map(l => { const v = mttrData[l]; return v !== undefined ? v.toFixed(2) : 0; });

        const maxCounts = Math.max(...counts, 0);
        const maxMTTR = Math.max(...mttrs.map(Number), 0);
        const axisMaxCounts = Math.ceil((maxCounts + 0.1) / 10) * 10;
        const axisMaxMTTR = Math.ceil((maxMTTR + 0.1) / 10) * 10;

        if (window[chartKey]) window[chartKey].destroy();
        window[chartKey] = new Chart(canvas.getContext('2d'), {
            type: 'bar',
            data: {
                labels: displayLabels,
                datasets: [
                    {
                        label: 'Incidentes', data: counts, backgroundColor: '#1B472A', order: 2, yAxisID: 'y-count',
                        datalabels: {
                            align: 'end', anchor: 'end', color: '#112E22', formatter: v => v > 0 ? v : ''
                        }
                    },
                    {
                        label: 'MTTR (h)', data: mttrs, type: 'line', borderColor: '#e94839', backgroundColor: '#e94839', order: 1,
                        yAxisID: 'y-mttr', datalabels: { display: false }
                    }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                onClick: (e, activeEls) => {
                    if (activeEls.length > 0 && onBarClick) {
                        const idx = activeEls[0].index;
                        onBarClick(displayLabels[idx], title);
                    }
                },
                scales: {
                    'y-count': {
                        position: 'left',
                        beginAtZero: true,
                        grid: { display: false },
                        max: axisMaxCounts
                    },
                    'y-mttr': {
                        position: 'right',
                        beginAtZero: true,
                        grid: { display: true },
                        max: axisMaxMTTR
                    }
                },
                plugins: {
                    legend: {
                        display: true,
                        position: 'bottom',
                        labels: { boxWidth: 12, padding: 15, font: { size: 11 } }
                    },
                    tooltip: {
                        callbacks: {
                            label: function (context) {
                                const label = context.dataset.label || '';
                                const value = context.parsed.y;
                                if (context.datasetIndex === 1) {
                                    const hours = Math.floor(value);
                                    const minutes = Math.round((value - hours) * 60);
                                    return `${label}: ${hours}h ${minutes}m`;
                                }
                                return `${label}: ${value}`;
                            }
                        }
                    }
                }
            }
        });
    }

    // ---- Gráficos de barras agrupadas por categoria + linha de MTTR, para Jornadas & Países,

    // Cada seção guarda seu próprio agrupamento (Mensal/Semanal/Trimestral) e desenha de forma independente.

        'mudancas': { grouping: 'monthly', dimension: 'mudanca-tipo' }

        'mudanca-tipo': [

    // Item 2: setas de navegação da janela de semanas (5 por vez) no gráfico de Jornadas & Países
    function setupJpWeekNav(prevId, nextId, canvasId, chartKey, titleElId, titlePrefix) {
        const prevBtn = document.getElementById(prevId);
        const nextBtn = document.getElementById(nextId);
        if (!prevBtn || !nextBtn || prevBtn.dataset.wired) return;
        prevBtn.dataset.wired = 'true';

        prevBtn.addEventListener('click', () => {
            LOCAL_EVOLUTION_STATE['jornadas-paises'].weekOffset = (LOCAL_EVOLUTION_STATE['jornadas-paises'].weekOffset || 0) + WEEK_WINDOW_SIZE;
            renderLocalEvolutionChart('jornadas-paises', canvasId, chartKey, titleElId, titlePrefix);
        });
        nextBtn.addEventListener('click', () => {
            LOCAL_EVOLUTION_STATE['jornadas-paises'].weekOffset = Math.max(0, (LOCAL_EVOLUTION_STATE['jornadas-paises'].weekOffset || 0) - WEEK_WINDOW_SIZE);
            renderLocalEvolutionChart('jornadas-paises', canvasId, chartKey, titleElId, titlePrefix);
        });
    }

    function renderLocalEvolutionChart(sectionKey, canvasId, chartKey, titleElId, titlePrefix) {
        const state = LOCAL_EVOLUTION_STATE[sectionKey];
        const GROUP_LABEL = { monthly: 'Mensal', weekly: 'Semanal', quarterly: 'Trimestral' };
        const DIMENSION_LABEL = { jornada: 'por Jornada', pais: 'por País', 'mudanca-tipo': '' };
        const dimLabel = DIMENSION_LABEL[state.dimension] || '';
        const title = `${titlePrefix}${dimLabel ? ' ' + dimLabel : ''} — ${GROUP_LABEL[state.grouping]}`;

        let breakdownByPeriod = {};
        let mttrData = {};

        if (state.dimension === 'jornada' || state.dimension === 'pais') {
            const breakdown = ALL_DATA.dimensionBreakdowns ? ALL_DATA.dimensionBreakdowns[state.dimension] : null;
            breakdownByPeriod = (breakdown && breakdown[state.grouping]) || {};
            const evo = ALL_DATA.evolutionData ? ALL_DATA.evolutionData[state.grouping] : null;
            mttrData = (evo && evo.mttr) || {};
        } else if (state.dimension === 'mudanca-tipo') {
            breakdownByPeriod = (ALL_DATA.mudancaPorTipoEvolutionData && ALL_DATA.mudancaPorTipoEvolutionData[state.grouping]) || {};
            const evo = ALL_DATA.mudancaEvolutionData ? ALL_DATA.mudancaEvolutionData[state.grouping] : null;
            mttrData = (evo && evo.mttr) || {};
        }

        const isPais = sectionKey === 'jornadas-paises' && state.dimension === 'pais';
        const weekNavEl = document.getElementById('jp-week-nav');

        drawGenericGroupedChart({
            canvasId: canvasId,
            chartKey: chartKey,
            titleElId: titleElId,
            breakdownByPeriod: breakdownByPeriod,
            seriesConfig: LOCAL_DIMENSION_SERIES[state.dimension] || null,
            title: title,
            group: state.grouping,
            mttrData: mttrData,
            updateSideStats: false,
            noOthersCap: isPais,
            legendContainerId: isPais ? 'jp-evolution-legend' : null,
            legendWithFlags: isPais,
            weekWindow: (sectionKey === 'jornadas-paises' && state.grouping === 'weekly') ? {
                size: WEEK_WINDOW_SIZE,
                offset: state.weekOffset || 0,
                onBoundsComputed: (bounds) => {
                    if (!weekNavEl) return;
                    weekNavEl.classList.remove('hidden');
                    const prevBtn = document.getElementById('jp-week-prev');
                    const nextBtn = document.getElementById('jp-week-next');
                    if (prevBtn) prevBtn.disabled = bounds.offset >= bounds.maxOffset;
                    if (nextBtn) nextBtn.disabled = bounds.offset <= 0;
                }
            } : null
        });

        if (weekNavEl && !(sectionKey === 'jornadas-paises' && state.grouping === 'weekly')) {
            weekNavEl.classList.add('hidden');
        }
    }

    function initDataStory() {
        const btn = document.getElementById('btn-data-story');
        if (!btn) return;

        // Ativar apenas para 2026 (comparando com 2025)
        if (CURRENT_FILTERS.year == "2026") {
            btn.classList.remove('hidden');
        } else {
            btn.classList.add('hidden');
        }

        btn.onclick = () => {
            document.getElementById('data-story-modal').classList.remove('hidden');
            document.getElementById('story-loading').classList.remove('hidden');
            document.getElementById('story-content').classList.add('hidden');

            // Lógica de Comparação Espelhada (YTD - Year to Day)
            const today = new Date();
            const baseYear = 2025;

            let start = CURRENT_FILTERS.startDate;
            let end = CURRENT_FILTERS.endDate;

            // Mirror today into 2025 for ceiling comparison
            let mirrorToday = new Date(today);
            mirrorToday.setFullYear(baseYear);

            if (CURRENT_FILTERS.periodKey === 'All') {
                // De 01/01/2025 até hoje/2025
                let s = new Date(baseYear, 0, 1, 0, 0, 0);
                start = s.getTime();
                end = mirrorToday.getTime();
            } else {
                // Caso existam datas de filtro (ex: Freeze), espelhamos para 2025
                if (start) {
                    let s = new Date(start);
                    s.setFullYear(baseYear);
                    start = s.getTime();
                }
                if (end) {
                    let e = new Date(end);
                    e.setFullYear(baseYear);
                    // Não comparar contra o futuro: limitamos ao mirrorToday
                    if (e > mirrorToday) e = mirrorToday;
                    end = e.getTime();
                } else if (!end && CURRENT_FILTERS.periodKey) {
                    // Se não tem end mas tem periodKey, limitamos ao mirrorToday
                    end = mirrorToday.getTime();
                }
            }

            logDebug(`Requesting baseline story for ${baseYear}. Range: ${start ? new Date(start).toLocaleDateString() : 'Start'} to ${end ? new Date(end).toLocaleDateString() : 'End'}`);

            // Busca dos dados de 2025 com o intervalo ESPELHADO
            google.script.run
                .withSuccessHandler(renderDataStory)
                .withFailureHandler(e => {
                    alert("Erro ao buscar histórico: " + e.message);
                    document.getElementById('data-story-modal').classList.add('hidden');
                })
                .getFilteredData(
                    baseYear,
                    CURRENT_FILTERS.periodKey,
                    start,
                    end,
                    CURRENT_FILTERS.card
                );
        };
    }

    function parseDataStoryTime(timeStr) {
        if (!timeStr) return 0;
        const parts = timeStr.split(':');
        if (parts.length === 2) {
            return (parseInt(parts[0], 10) * 60) + parseInt(parts[1], 10);
        }
        return 0;
    }

    function renderDataStory(baselineData) {
        document.getElementById('story-loading').classList.add('hidden');
        document.getElementById('story-content').classList.remove('hidden');

        const curr = ALL_DATA.currentKpis;
        const volCurr = curr.incidentesTotal || 0;
        const mttrCurrMin = parseDataStoryTime(curr.mttrTotal);

        // --- PREPARAÇÃO DE DADOS (COMUM) ---
        const group = CURRENT_FILTERS.evolutionGrouping || 'monthly';
        const currMetrics = ALL_DATA.evolutionData[group].metrics;
        const currMttr = ALL_DATA.evolutionData[group].mttr;

        let prevMetrics = {};
        let prevMttrMap = {};
        let titleLabel = "";

        if (group === 'monthly') {
            prevMetrics = baselineData.monthlyMetrics;
            prevMttrMap = baselineData.mttrPorMesEmHoras;
            titleLabel = "Análise Mensal";
        } else if (group === 'quarterly') {
            prevMetrics = baselineData.quarterlyMetrics;
            prevMttrMap = baselineData.mttrTrimestralEmHoras;
            titleLabel = "Análise Trimestral";
        } else {
            prevMetrics = baselineData.weeklyMetrics;
            prevMttrMap = baselineData.mttrSemanalEmHoras;
            titleLabel = "Análise Semanal";
        }

        // --- AGREGACAO PARA COMPARACAO JUSTA (PERIODO VS PERIODO) ---
        // Descobrir quais chaves (meses/semanas) tem dados em 2026
        const activeKeys = Object.keys(currMetrics).filter(k => currMetrics[k].count > 0);

        let volPrev = 0;
        let fairTotalDurationMinPrev = 0;

        activeKeys.forEach(k => {
            if (prevMetrics[k]) {
                volPrev += prevMetrics[k].count;
                fairTotalDurationMinPrev += prevMetrics[k].durationMin;
            }
        });

        const mttrPrevMin = volPrev > 0 ? (fairTotalDurationMinPrev / volPrev) : 0;
        const formatMttr = (totalMin) => {
            const h = Math.floor(totalMin / 60);
            const m = Math.round(totalMin % 60);
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        };
        const mttrPrevFormatted = formatMttr(mttrPrevMin);

        let volDiff = volCurr - volPrev;
        let volDiffPct = volPrev > 0 ? (volDiff / volPrev) * 100 : (volCurr > 0 ? 100 : 0);

        let mttrDiff = mttrCurrMin - mttrPrevMin;
        let mttrDiffPct = mttrPrevMin > 0 ? (mttrDiff / mttrPrevMin) * 100 : (mttrCurrMin > 0 ? 100 : 0);

        // Define situation
        let isBetter = (volCurr <= volPrev && mttrCurrMin < mttrPrevMin) || (volCurr < volPrev && mttrCurrMin <= mttrPrevMin);
        let isWorse = (volCurr > volPrev && volDiffPct > 10) || (mttrCurrMin > mttrPrevMin && mttrDiffPct > 10);

        let headline = "";
        let alertClass = "";
        let alertBg = "";

        if (isBetter) {
            headline = "🎉 Excelente! Reduzimos o volume e o tempo de impacto em relação ao mesmo período de 2025.";
            alertClass = "border-natura-green-cerrado";
            alertBg = "bg-natura-green-capim/20";
        } else if (isWorse) {
            headline = "⚠️ Atenção: Há um aumento nos incidentes ou no tempo de resposta contra o mesmo período de 2025.";
            alertClass = "border-natura-red-buriti";
            alertBg = "bg-natura-red-buriti/10";
        } else {
            headline = "📊 Estabilidade: Os resultados atuais estão alinhados historicamente com o mesmo período de 2025.";
            alertClass = "border-natura-blue-profundo";
            alertBg = "bg-natura-blue-ceu/20";
        }

        const box = document.getElementById('story-alert-box');
        box.className = `border-l-4 p-4 rounded-r-xl shadow-sm transition-all mb-2 ${alertClass} ${alertBg}`;
        document.getElementById('story-headline').textContent = headline;

        // Update DOM Elements
        document.getElementById('story-vol-curr').textContent = volCurr;
        document.getElementById('story-vol-prev').textContent = volPrev;
        const volEl = document.getElementById('story-vol-diff');

        if (volDiff > 0) {
            volEl.innerHTML = `<span class="text-natura-red-buriti">↑ +${volDiffPct.toFixed(1)}%</span>`;
        } else if (volDiff < 0) {
            volEl.innerHTML = `<span class="text-natura-green-cerrado">↓ ${Math.abs(volDiffPct).toFixed(1)}%</span>`;
        } else {
            volEl.innerHTML = `<span class="text-slate-400">= 0%</span>`;
        }

        document.getElementById('story-mttr-curr').textContent = curr.mttrTotal;
        document.getElementById('story-mttr-prev').textContent = mttrPrevFormatted;
        const mttrEl = document.getElementById('story-mttr-diff');

        if (mttrDiff > 0) {
            mttrEl.innerHTML = `<span class="text-natura-red-buriti">↑ +${mttrDiffPct.toFixed(1)}%</span>`;
        } else if (mttrDiff < 0) {
            mttrEl.innerHTML = `<span class="text-natura-green-cerrado">↓ ${Math.abs(mttrDiffPct).toFixed(1)}%</span>`;
        } else {
            mttrEl.innerHTML = `<span class="text-slate-400">= 0%</span>`;
        }

        // Build summary paragraph
        let summary = `Comparando exclusivamente os mesmos períodos do ano anterior, observamos que o volume de Major Incidentes `;
        if (volDiffPct !== 0) {
            summary += `${volDiff > 0 ? 'cresceu' : 'caiu'} em ${Math.abs(volDiffPct).toFixed(1)}%, passando de ${volPrev} para ${volCurr}. `;
        } else {
            summary += `manteve-se idêntico (${volCurr} incidentes). `;
        }

        summary += `Enquanto isso, a velocidade de recuperação (MTTR) `;
        if (mttrDiffPct !== 0) {
            summary += `${mttrDiff > 0 ? 'piorou' : 'melhorou'} em ${Math.abs(mttrDiffPct).toFixed(1)}%, mudando de ${mttrPrevFormatted} para ${curr.mttrTotal}.`;
        } else {
            summary += `está rigorosamente igual (${curr.mttrTotal}).`;
        }

        document.getElementById('story-summary').textContent = summary;

        // --- BREAKDOWN SECTION ---
        // Ordenação das chaves já identificadas como ativas
        if (group === 'monthly') {
            const monthsOrder = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
            activeKeys.sort((a, b) => monthsOrder.indexOf(a) - monthsOrder.indexOf(b));
        } else if (group === 'quarterly') {
            activeKeys.sort();
        } else {
            activeKeys.sort((a, b) => parseInt(a.substring(1)) - parseInt(b.substring(1)));
        }

        let html = "";
        if (activeKeys.length === 0) {
            html = `<p class="text-[11px] text-slate-500 italic p-3 text-center border border-dashed border-slate-200 rounded-lg">Nenhum dado do período vigente encontrado para comparar.</p>`;
        } else {
            activeKeys.forEach(k => {
                const cVol = currMetrics[k] ? currMetrics[k].count : 0;
                const pVol = prevMetrics[k] ? prevMetrics[k].count : 0;

                const cMttr = currMttr[k] || 0;
                const pMttr = prevMttrMap[k] || 0;

                const fmtMttr = (val) => {
                    const h = Math.floor(val);
                    const m = Math.round((val - h) * 60);
                    return `${h}h ${m}m`;
                };

                let volDiffLocal = cVol - pVol;
                let mttrDiffLocal = cMttr - pMttr;

                let volDiffLocalPct = pVol > 0 ? (volDiffLocal / pVol) * 100 : (cVol > 0 ? 100 : 0);
                let mttrDiffLocalPct = pMttr > 0 ? (mttrDiffLocal / pMttr) * 100 : (cMttr > 0 ? 100 : 0);

                let volBadge = volDiffLocal > 0 ? `<span class="text-natura-red-buriti font-bold">↑ +${volDiffLocal} (+${Math.abs(volDiffLocalPct).toFixed(1)}%)</span>` : (volDiffLocal < 0 ? `<span class="text-natura-green-cerrado font-bold">↓ ${Math.abs(volDiffLocal)} (-${Math.abs(volDiffLocalPct).toFixed(1)}%)</span>` : `<span class="text-slate-400">=</span>`);
                let mttrBadge = mttrDiffLocal > 0 ? `<span class="text-natura-red-buriti font-bold">↑ +${fmtMttr(mttrDiffLocal)} (+${Math.abs(mttrDiffLocalPct).toFixed(1)}%)</span>` : (mttrDiffLocal < 0 ? `<span class="text-natura-green-cerrado font-bold">↓ ${fmtMttr(Math.abs(mttrDiffLocal))} (-${Math.abs(mttrDiffLocalPct).toFixed(1)}%)</span>` : `<span class="text-slate-400">=</span>`);

                const displayLabel = k.charAt(0).toUpperCase() + k.slice(1);

                html += `
                <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-[inset_0_2px_4px_rgba(0,0,0,0.01)] hover:bg-white transition-colors">
                    <span class="font-bold text-slate-700 w-28 shrink-0 flex items-center gap-2"><div class="w-1.5 h-1.5 rounded-full bg-slate-300"></div>${displayLabel}</span>
                    <div class="flex-1 grid grid-cols-2 gap-4 text-xs bg-white p-2 rounded shadow-sm border border-slate-100">
                        <div class="flex items-center justify-between">
                            <div>
                               <span class="text-slate-400 uppercase tracking-widest text-[9px] block mb-0.5">Incidentes</span>
                               <div class="flex items-baseline gap-1">
                                    <span class="font-bold text-slate-800 text-[13px]">${cVol}</span>
                                    <span class="text-slate-400 text-[9px]">vs ${pVol}</span>
                               </div>
                            </div>
                            <div class="text-right text-[11px]">${volBadge}</div>
                        </div>
                        <div class="flex items-center justify-between pl-3 border-l border-slate-100">
                            <div>
                               <span class="text-slate-400 uppercase tracking-widest text-[9px] block mb-0.5">MTTR</span>
                               <div class="flex items-baseline gap-1">
                                    <span class="font-bold text-slate-800 text-[13px]">${fmtMttr(cMttr)}</span>
                                    <span class="text-slate-400 text-[9px]">vs ${fmtMttr(pMttr)}</span>
                               </div>
                            </div>
                            <div class="text-right text-[11px]">${mttrBadge}</div>
                        </div>
                    </div>
                </div>
                `;
            });
        }
        document.getElementById('story-breakdown-title').textContent = `Comparação Exata por Período (${titleLabel})`;
        document.getElementById('story-breakdown-list').innerHTML = html;
    }

    function renderRanking() {
        const { category, type, context, searchQuery } = RANKING_STATE;
        const titleEl = document.getElementById('ranking-modal-title');
        const listEl = document.getElementById('ranking-list');
        const btnVol = document.getElementById('btn-ranking-vol');
        const btnMttr = document.getElementById('btn-ranking-mttr');

        if (btnVol && btnMttr) {
            [btnVol, btnMttr].forEach(btn => {
                btn.classList.remove('bg-white', 'text-natura-green-cerrado', 'shadow-sm', 'text-slate-500');
            });

            if (type === 'vol') {
                btnVol.classList.add('bg-white', 'text-natura-green-cerrado', 'shadow-sm');
                btnMttr.classList.add('text-slate-500');
            } else {
                btnMttr.classList.add('bg-white', 'text-natura-green-cerrado', 'shadow-sm');
                btnVol.classList.add('text-slate-500');
            }
        }

        listEl.innerHTML = '';

        let dataObj = category === 'tech' ? ALL_DATA.techMetrics : ALL_DATA.offenderMetrics;
        if (!dataObj) return;

        titleEl.textContent = `Ranking: ${category === 'tech' ? 'Tecnologia' : 'Ofensor'}`;

        let sortFn;
        if (type === 'vol') {
            sortFn = (a, b) => dataObj[b].count - dataObj[a].count;
        } else {
            sortFn = (a, b) => {
                const valA = dataObj[a].count ? (dataObj[a].durationMin / dataObj[a].count) : 0;
                const valB = dataObj[b].count ? (dataObj[b].durationMin / dataObj[b].count) : 0;
                return valB - valA;
            };
        }

        let sortedKeys = Object.keys(dataObj).sort(sortFn);

        // Filter by Search Query
        if (searchQuery) {
            sortedKeys = sortedKeys.filter(k => k.toLowerCase().includes(searchQuery));
        }

        const totalIncidents = (ALL_DATA.currentKpis && ALL_DATA.currentKpis.incidentesTotal) || 1;

        if (sortedKeys.length === 0) {
            listEl.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400 italic">Nenhum resultado encontrado para "${searchQuery}"</div>`;
            return;
        }

        sortedKeys.forEach((key, index) => {
            const count = dataObj[key].count;
            const pct = ((count / totalIncidents) * 100).toFixed(1);

            let mainValue = '';
            let subValue = '';

            if (context === 'mttr') {
                const avgMin = count ? (dataObj[key].durationMin / count) : 0;
                mainValue = formatMinutesToHHMM(avgMin);
                subValue = `${count} Inc. | ${pct}%`;
            } else {
                mainValue = `${count}`;
                subValue = `${pct}% do total`;
            }

            const itemHtml = `
                <div class="flex justify-between items-center py-2 px-3 border border-slate-100 hover:border-natura-orange/30 hover:bg-white rounded-lg transition-all bg-white/50 shadow-sm">
                    <div class="flex items-center gap-2 min-w-0">
                        <div class="flex-none w-5 h-5 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 text-[10px] font-bold border border-slate-200">
                            ${index + 1}
                        </div>
                        <div class="flex flex-col min-w-0">
                            <span class="font-bold text-slate-700 text-xs truncate uppercase leading-tight" title="${key}">${key}</span>
                            <span class="text-[9px] text-slate-400 font-bold uppercase tracking-tight">${subValue}</span>
                        </div>
                    </div>
                    <span class="flex-none font-black text-natura-orange whitespace-nowrap text-sm ml-2">
                        ${mainValue}
                    </span>
                </div>
            `;
            listEl.innerHTML += itemHtml;
        });
    }

    // Emoji de bandeira Unicode NÃO funciona no Windows (a Microsoft nunca implementou o rendering colorido
    // dos Regional Indicator Symbols — eles caem para as letras do código, ex: "BR" em vez da bandeira).
    // Para funcionar em qualquer SO/rede, desenhamos bandeiras simplificadas (faixas de cor) em SVG inline,
    // sem nenhuma dependência externa (nem CDN de imagem, nem fonte de emoji).
    const FLAG_PATTERNS = {
        'BR': { type: 'diamond', bg: '#009739', fg: '#FEDD00' },
        'MX': { type: 'vertical', colors: ['#006847', '#FFFFFF', '#CE1126'] },
        'CL': { type: 'chile' },
        'CO': { type: 'horizontal-weighted', colors: ['#FCD116', '#003893', '#CE1126'], weights: [0.5, 0.25, 0.25] },
        'PE': { type: 'vertical', colors: ['#D91023', '#FFFFFF', '#D91023'] },
        'EC': { type: 'horizontal-weighted', colors: ['#FFDD00', '#0072CE', '#EF3340'], weights: [0.5, 0.25, 0.25] },
        'EQ': { type: 'horizontal-weighted', colors: ['#FFDD00', '#0072CE', '#EF3340'], weights: [0.5, 0.25, 0.25] },
        'AR': { type: 'horizontal', colors: ['#74ACDF', '#FFFFFF', '#74ACDF'] },
        'SV': { type: 'horizontal', colors: ['#0047AB', '#FFFFFF', '#0047AB'] },
        'HN': { type: 'horizontal', colors: ['#0073CF', '#FFFFFF', '#0073CF'] },
        'DO': { type: 'dominican-republic' },
        'GT': { type: 'vertical', colors: ['#4997D0', '#FFFFFF', '#4997D0'] },
        'PA': { type: 'quadrants', colors: ['#FFFFFF', '#DA121A', '#0033A0', '#FFFFFF'] },
        'NI': { type: 'horizontal', colors: ['#0067C6', '#FFFFFF', '#0067C6'] },
        'UY': { type: 'uruguay' },
        'UR': { type: 'uruguay' }
    };

    function buildFlagSvg(code, w, h) {
        w = w || 22; h = h || 15;
        const spec = FLAG_PATTERNS[code];
        let inner = '';
        if (!spec) {
            inner = `<rect width="${w}" height="${h}" fill="#cbd5e1"/>`;
        } else if (spec.type === 'horizontal') {
            const n = spec.colors.length;
            spec.colors.forEach((c, i) => { inner += `<rect x="0" y="${(h / n) * i}" width="${w}" height="${h / n}" fill="${c}"/>`; });
        } else if (spec.type === 'vertical') {
            const n = spec.colors.length;
            spec.colors.forEach((c, i) => { inner += `<rect x="${(w / n) * i}" y="0" width="${w / n}" height="${h}" fill="${c}"/>`; });
        } else if (spec.type === 'horizontal-weighted') {
            let y = 0;
            spec.colors.forEach((c, i) => {
                const bandH = h * spec.weights[i];
                inner += `<rect x="0" y="${y.toFixed(1)}" width="${w}" height="${bandH.toFixed(1)}" fill="${c}"/>`;
                y += bandH;
            });
        } else if (spec.type === 'diamond') {
            inner += `<rect width="${w}" height="${h}" fill="${spec.bg}"/>`;
            inner += `<polygon points="${w / 2},2 ${w - 3},${h / 2} ${w / 2},${h - 2} 3,${h / 2}" fill="${spec.fg}"/>`;
        } else if (spec.type === 'quadrants') {
            inner += `<rect x="0" y="0" width="${w / 2}" height="${h / 2}" fill="${spec.colors[0]}"/>`;
            inner += `<rect x="${w / 2}" y="0" width="${w / 2}" height="${h / 2}" fill="${spec.colors[1]}"/>`;
            inner += `<rect x="0" y="${h / 2}" width="${w / 2}" height="${h / 2}" fill="${spec.colors[2]}"/>`;
            inner += `<rect x="${w / 2}" y="${h / 2}" width="${w / 2}" height="${h / 2}" fill="${spec.colors[3]}"/>`;
        } else if (spec.type === 'dominican-republic') {
            // Cruz branca dividindo a bandeira em 4 quadrantes: azul (TL/BR) e vermelho (TR/BL)
            const crossW = Math.max(1.5, h * 0.18);
            inner += `<rect x="0" y="0" width="${w / 2 - crossW / 2}" height="${h / 2 - crossW / 2}" fill="#002D62"/>`;
            inner += `<rect x="${w / 2 + crossW / 2}" y="0" width="${w / 2 - crossW / 2}" height="${h / 2 - crossW / 2}" fill="#CE1126"/>`;
            inner += `<rect x="0" y="${h / 2 + crossW / 2}" width="${w / 2 - crossW / 2}" height="${h / 2 - crossW / 2}" fill="#CE1126"/>`;
            inner += `<rect x="${w / 2 + crossW / 2}" y="${h / 2 + crossW / 2}" width="${w / 2 - crossW / 2}" height="${h / 2 - crossW / 2}" fill="#002D62"/>`;
            inner += `<rect x="${w / 2 - crossW / 2}" y="0" width="${crossW}" height="${h}" fill="#FFFFFF"/>`;
            inner += `<rect x="0" y="${h / 2 - crossW / 2}" width="${w}" height="${crossW}" fill="#FFFFFF"/>`;
        } else if (spec.type === 'chile') {
            inner += `<rect x="0" y="0" width="${w}" height="${h / 2}" fill="#FFFFFF"/>`;
            inner += `<rect x="0" y="${h / 2}" width="${w}" height="${h / 2}" fill="#D52B1E"/>`;
            inner += `<rect x="0" y="0" width="${w / 3}" height="${h / 2}" fill="#0039A6"/>`;
            inner += `<polygon points="${w / 6},${h * 0.12} ${w / 6 + 2},${h * 0.22} ${w / 6 - 2},${h * 0.22}" fill="#FFFFFF"/>`;
        } else if (spec.type === 'uruguay') {
            inner += `<rect width="${w}" height="${h}" fill="#FFFFFF"/>`;
            for (let i = 0; i < 4; i++) { inner += `<rect x="0" y="${(h / 9) * (i * 2 + 1)}" width="${w}" height="${h / 9}" fill="#0038A8"/>`; }
            inner += `<rect x="0" y="0" width="${w * 0.4}" height="${h * 0.5}" fill="#FCD116"/>`;
        }
        return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,0.12);flex-shrink:0;display:inline-block;vertical-align:middle">${inner}</svg>`;
    }

    function renderFlags(abrangenciaStr) {
        if (!abrangenciaStr || abrangenciaStr === 'N/A') return 'N/A';
        const countries = abrangenciaStr.split(',').map(s => s.trim().toUpperCase()).filter(Boolean);
        if (!countries.length) return 'N/A';
        return `<div class="flex flex-wrap gap-2 mt-1">` + countries.map(c => {
            return `<span title="${c}" class="inline-flex items-center gap-1.5 bg-white border border-slate-200 px-2 py-1 rounded shadow-sm">
                        ${buildFlagSvg(c, 18, 12)}
                        <span class="font-bold text-slate-700 text-[11px]">${c}</span>
                    </span>`;
        }).join('') + `</div>`;
    }

    const JORNADA_MAP = {
        'O&L': { label: 'Operação & Logística', color: 'bg-blue-50 text-blue-800 border-blue-200', icon: '📦' },

        'Corporativo/BackOffice': { label: 'Corporativo/BackOffice', color: 'bg-slate-100 text-slate-800 border-slate-300', icon: '🏢' }

    function renderJornadas(jornadaStr) {

        const jornadas = jornadaStr.split(',').map(s => s.trim());
        return `<div class="flex flex-wrap gap-2 mt-1">` + jornadas.map(j => {

                        <span>${mapped.icon}</span>
                        <span>${mapped.label}</span>
                    </span>`;
        }).join('') + `</div>`;
    }

    function renderMudancaAnalytics(categoryKey) {
        if (!GLOBAL_MUDANCA_DATA) return;

        const data26 = GLOBAL_MUDANCA_DATA.year26[categoryKey];
        if (!data26) return;

        // 1. Render KPIs
        document.getElementById('mudanca-kpi-total').textContent = data26.kpis.incidentesTotal;
        document.getElementById('mudanca-kpi-mttr-total').textContent = data26.kpis.mttrTotal;

        document.getElementById('mudanca-kpi-sev0').textContent = data26.kpis.incidentesSev0;
        document.getElementById('mudanca-kpi-mttr-sev0').textContent = data26.kpis.mttrSev0;

        document.getElementById('mudanca-kpi-sev1').textContent = data26.kpis.incidentesSev1;
        document.getElementById('mudanca-kpi-mttr-sev1').textContent = data26.kpis.mttrSev1;

        // 2. Render Evolution Chart
        const group = MUDANCA_EVOLUTION_GROUPING;
        let metrics, mttr, title;
        let prevMetricsHist = null;
        if (group === 'monthly') {
            metrics = data26.monthlyMetrics;
            mttr = data26.mttrPorMesEmHoras;
            title = "Evolução Mensal";
            if (GLOBAL_MUDANCA_DATA.year25) prevMetricsHist = GLOBAL_MUDANCA_DATA.year25.ytd[categoryKey].monthlyMetrics;
        } else if (group === 'weekly') {
            metrics = data26.weeklyMetrics;
            mttr = data26.mttrSemanalEmHoras;
            title = "Evolução Semanal";
            if (GLOBAL_MUDANCA_DATA.year25) prevMetricsHist = GLOBAL_MUDANCA_DATA.year25.ytd[categoryKey].weeklyMetrics;
        } else {
            metrics = data26.quarterlyMetrics;
            mttr = data26.mttrTrimestralEmHoras;
            title = "Evolução Trimestral";
            if (GLOBAL_MUDANCA_DATA.year25) prevMetricsHist = GLOBAL_MUDANCA_DATA.year25.ytd[categoryKey].quarterlyMetrics;
        }

        document.getElementById('mudanca-chart-title').textContent = title;

        const ctx = document.getElementById('mudanca-chart-evolution');
        if (MUDANCA_CHART) MUDANCA_CHART.destroy();

        // Sort labels chronologically
        const labels = Object.keys(metrics).sort((a, b) => {
            if (group === 'monthly') {
                const monthOrder = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
                return monthOrder.indexOf(a.toLowerCase()) - monthOrder.indexOf(b.toLowerCase());
            } else if (group === 'weekly') {
                const numA = parseInt(a.replace(/\D/g, ''), 10) || 0;
                const numB = parseInt(b.replace(/\D/g, ''), 10) || 0;
                return numA - numB;
            } else if (group === 'quarterly') {
                return a.localeCompare(b);
            }
            return 0;
        });

        const displayLabels = labels.map(l => l.charAt(0).toUpperCase() + l.slice(1));
        const volumeData = labels.map(l => metrics[l].count);
        const mttrData = labels.map(l => mttr[l]);

        if (labels.length === 0) {
            ctx.parentNode.innerHTML = `<div class="absolute inset-0 flex items-center justify-center text-slate-400 italic text-sm">Sem dados para evolução.</div><canvas id="mudanca-chart-evolution" class="hidden"></canvas>`;
            document.getElementById('mudanca-history-container').innerHTML = `<div class="text-sm text-slate-400 italic text-center">Indisponível.</div>`;
            return;
        } else {
            // Restore canvas if it was replaced
            const parent = ctx.parentNode;
            if (parent.querySelector('div')) {
                parent.innerHTML = `<canvas id="mudanca-chart-evolution"></canvas>`;
            }
        }

        const newCtx = document.getElementById('mudanca-chart-evolution').getContext('2d');
        MUDANCA_CHART = new Chart(newCtx, {
            type: 'bar',
            data: {
                labels: displayLabels,
                datasets: [
                    {
                        type: 'line',
                        label: 'MTTR (h)',
                        data: mttrData,
                        borderColor: '#FF7B00',
                        backgroundColor: '#FF7B00',
                        borderWidth: 2,
                        tension: 0.3,
                        yAxisID: 'y1',
                        datalabels: {
                            display: true,
                            align: 'top',
                            color: '#FF7B00',
                            font: { weight: 'bold', size: 10 },
                            formatter: (value) => {
                                const totalMin = Math.round(value * 60);
                                const h = Math.floor(totalMin / 60);
                                const m = totalMin % 60;
                                return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
                            }
                        }
                    },
                    {
                        type: 'bar',
                        label: 'Volume',
                        data: volumeData,
                        backgroundColor: '#F2D399',
                        borderRadius: 4,
                        yAxisID: 'y',
                        datalabels: {
                            display: true,
                            anchor: 'end',
                            align: 'top',
                            color: '#888',
                            font: { size: 10 }
                        }
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'bottom' },
                    datalabels: {
                        display: false // Disable by default, enable per dataset
                    },
                    tooltip: {
                        callbacks: {
                            label: function (context) {
                                let label = context.dataset.label || '';
                                if (label) {
                                    label += ': ';
                                }
                                if (context.dataset.yAxisID === 'y1') {
                                    const decimalHours = context.parsed.y;
                                    const totalMin = Math.round(decimalHours * 60);
                                    const h = Math.floor(totalMin / 60);
                                    const m = totalMin % 60;
                                    label += `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
                                } else {
                                    label += context.parsed.y;
                                }
                                return label;
                            }
                        }
                    }
                },
                scales: {
                    y: { beginAtZero: true, position: 'left', title: { display: true, text: 'Volume' } },
                    y1: {
                        beginAtZero: true,
                        position: 'right',
                        grid: { drawOnChartArea: false },
                        title: { display: true, text: 'MTTR' },
                        ticks: {
                            callback: function (value) {
                                return value + 'h';
                            }
                        }
                    }
                }
            }
        });

        // 3. Render Historical Data (If 2026)
        const histContainer = document.getElementById('mudanca-history-container');
        if (CURRENT_FILTERS.year == "2026" && GLOBAL_MUDANCA_DATA.year25) {
            const hist25 = GLOBAL_MUDANCA_DATA.year25;

            const formatMttrStr = (totalMin) => {
                if (isNaN(totalMin) || totalMin === 0) return "00:00";
                const h = Math.floor(totalMin / 60);
                const m = Math.round(totalMin % 60);
                return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
            };
            // Frontend helper for parsing backend HH:MM strings to minutes
            const parseMttrToMin = (str) => {
                if (!str || typeof str !== 'string') return 0;
                const parts = str.split(':').map(p => parseInt(p, 10) || 0);
                if (parts.length === 4) return (parts[0] * 1440) + (parts[1] * 60) + parts[2];
                if (parts.length >= 2) return (parts[0] * 60) + parts[1];
                return parts[0] || 0;
            };

            const renderHistBlock = (title, curVal, baseVal) => {
                const diff = curVal - baseVal;
                let pct = baseVal > 0 ? (diff / baseVal) * 100 : (curVal > 0 ? 100 : 0);

                let color = "text-slate-500";
                let icon = "";
                let symbol = "";
                if (diff > 0) { color = "text-natura-red-buriti"; icon = "↑"; symbol = "+"; }
                else if (diff < 0) { color = "text-natura-green-cerrado"; icon = "↓"; }
                else { icon = "="; }

                return `
                    <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-lg border border-slate-100">
                        <span class="text-xs font-bold text-slate-600 uppercase w-1/2">${title}</span>
                        <div class="flex items-center justify-end gap-3 w-1/2">
                            <span class="text-[10px] text-slate-400 line-through">${baseVal}</span>
                            <span class="text-xs font-black text-slate-800">${curVal}</span>
                            <span class="text-[10px] font-bold ${color} bg-white px-1.5 py-0.5 rounded border border-current w-14 text-center" title="${symbol}${pct.toFixed(1)}%">${icon} ${symbol}${Math.abs(pct).toFixed(0)}%</span>
                        </div>
                    </div>
                `;
            };

            const renderMttrBlock = (title, curMttrStr, curMttrMin, baseMttrStr, baseMttrMin) => {
                const diff = curMttrMin - baseMttrMin;
                let pct = baseMttrMin > 0 ? (diff / baseMttrMin) * 100 : (curMttrMin > 0 ? 100 : 0);

                let color = "text-slate-500";
                let icon = "";
                let symbol = "";
                if (diff > 0) { color = "text-natura-red-buriti"; icon = "↑"; symbol = "+"; }
                else if (diff < 0) { color = "text-natura-green-cerrado"; icon = "↓"; }
                else { icon = "="; }

                return `
                    <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-lg border border-slate-100">
                        <span class="text-xs font-bold text-slate-600 uppercase w-1/2">${title}</span>
                        <div class="flex items-center justify-end gap-2 w-1/2">
                            <span class="text-[10px] text-slate-400 line-through">${baseMttrStr}</span>
                            <span class="text-xs font-black text-slate-800">${curMttrStr}</span>
                            <span class="text-[10px] font-bold ${color} bg-white px-1 py-0.5 rounded border border-current w-14 text-center" title="${symbol}${pct.toFixed(1)}%">${icon} ${symbol}${Math.abs(pct).toFixed(0)}%</span>
                        </div>
                    </div>
                `;
            };

            let html = `
                <div>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 border-b border-slate-200 pb-1">Agregado YTD 2026 vs 2025</p>
                    <div class="grid grid-cols-2 gap-2 mb-4">
                        ${renderHistBlock('Vol Total', data26.kpis.incidentesTotal, hist25.ytd[categoryKey].kpis.incidentesTotal)}
                        ${renderMttrBlock('MTTR', data26.kpis.mttrTotal, parseMttrToMin(data26.kpis.mttrTotal), hist25.ytd[categoryKey].kpis.mttrTotal, parseMttrToMin(hist25.ytd[categoryKey].kpis.mttrTotal))}
                        
                        ${renderHistBlock('Sev 0', data26.kpis.incidentesSev0, hist25.ytd[categoryKey].kpis.incidentesSev0)}
                        ${renderMttrBlock('MTTR Sev 0', data26.kpis.mttrSev0, parseMttrToMin(data26.kpis.mttrSev0), hist25.ytd[categoryKey].kpis.mttrSev0, parseMttrToMin(hist25.ytd[categoryKey].kpis.mttrSev0))}
                        
                        ${renderHistBlock('Sev 1', data26.kpis.incidentesSev1, hist25.ytd[categoryKey].kpis.incidentesSev1)}
                        ${renderMttrBlock('MTTR Sev 1', data26.kpis.mttrSev1, parseMttrToMin(data26.kpis.mttrSev1), hist25.ytd[categoryKey].kpis.mttrSev1, parseMttrToMin(hist25.ytd[categoryKey].kpis.mttrSev1))}
                    </div>
                </div>
            `;

            // Comparação Exata Baseada na Evolução
            const activeKeys = Object.keys(metrics).filter(k => metrics[k].count > 0);

            // ORDENAÇÃO CRONOLÓGICA
            const monthOrder = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
            activeKeys.sort((a, b) => {
                if (group === 'monthly') {
                    return monthOrder.indexOf(a.toLowerCase()) - monthOrder.indexOf(b.toLowerCase());
                } else if (group === 'weekly') {
                    const numA = parseInt(a.replace(/\D/g, ''), 10) || 0;
                    const numB = parseInt(b.replace(/\D/g, ''), 10) || 0;
                    return numA - numB;
                } else if (group === 'quarterly') {
                    return a.localeCompare(b);
                }
                return 0;
            });

            let volPrev = 0;
            let durPrevMin = 0;

            if (prevMetricsHist) {
                activeKeys.forEach(k => {
                    if (prevMetricsHist[k]) {
                        volPrev += prevMetricsHist[k].count;
                        durPrevMin += prevMetricsHist[k].durationMin;
                    }
                });
            }

            let volCur = 0;
            let durCurMin = 0;
            activeKeys.forEach(k => {
                volCur += metrics[k].count;
                durCurMin += metrics[k].durationMin;
            });

            const mttrPrevMin = volPrev > 0 ? (durPrevMin / volPrev) : 0;
            const mttrCurMin = volCur > 0 ? (durCurMin / volCur) : 0;

            const groupLabelMap = { 'weekly': 'Semana', 'monthly': 'Mês', 'quarterly': 'Trimestre' };
            const groupName = groupLabelMap[group] || 'Período';

            // Build the string representation of active keys for the title (e.g. "Janeiro, Fevereiro")
            let keysTitle = activeKeys.length > 2 ? activeKeys.slice(0, 2).join(', ') + '...' : activeKeys.join(', ');
            if (!keysTitle) keysTitle = "Período Vazio";

            // Nova função para renderizar uma linha combinada (Vol + MTTR) para a comparação por período
            const renderComparisonRow = (label, curVol, baseVol, curMttrMin, baseMttrMin) => {
                const volDiff = curVol - baseVol;
                const volPct = baseVol > 0 ? (volDiff / baseVol) * 100 : (curVol > 0 ? 100 : 0);
                const mttrDiff = curMttrMin - baseMttrMin;
                const mttrPct = baseMttrMin > 0 ? (mttrDiff / baseMttrMin) * 100 : (curMttrMin > 0 ? 100 : 0);

                const getVarStyle = (diff, isMttr) => {
                    if (diff > 0) return { color: "text-natura-red-buriti", icon: "↑", symbol: "+" };
                    if (diff < 0) return { color: "text-natura-green-cerrado", icon: "↓", symbol: "" };
                    return { color: "text-slate-500", icon: "=", symbol: "" };
                };

                const volVar = getVarStyle(volDiff);
                const mttrVar = getVarStyle(mttrDiff);

                return `
                    <div class="bg-slate-50 p-2 rounded-lg border border-slate-100 mb-2">
                        <div class="text-[9px] font-bold text-slate-400 uppercase mb-1 border-b border-slate-200/50 pb-0.5">${label}</div>
                        <div class="grid grid-cols-2 gap-4">
                            <!-- Volume -->
                            <div class="flex items-center justify-between">
                                <span class="text-[10px] text-slate-500 uppercase">Vol:</span>
                                <div class="flex items-center gap-1.5">
                                    <span class="text-[9px] text-slate-300 line-through">${baseVol}</span>
                                    <span class="text-xs font-bold text-slate-800">${curVol}</span>
                                    <span class="text-[9px] font-bold ${volVar.color} bg-white px-1 py-0.5 rounded border border-current min-w-[32px] text-center">${volVar.icon}${Math.abs(volPct).toFixed(0)}%</span>
                                </div>
                            </div>
                            <!-- MTTR -->
                            <div class="flex items-center justify-between border-l border-slate-200 pl-4">
                                <span class="text-[10px] text-slate-500 uppercase">MTTR:</span>
                                <div class="flex items-center gap-1.5">
                                    <span class="text-[9px] text-slate-300 line-through">${formatMttrStr(baseMttrMin)}</span>
                                    <span class="text-xs font-bold text-slate-800">${formatMttrStr(curMttrMin)}</span>
                                    <span class="text-[9px] font-bold ${mttrVar.color} bg-white px-1 py-0.5 rounded border border-current min-w-[32px] text-center">${mttrVar.icon}${Math.abs(mttrPct).toFixed(0)}%</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            };

            html += `
                <div class="mt-2">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 border-b border-slate-200 pb-1">Comparação Exata por ${groupName}</p>
                    <div class="max-h-[300px] overflow-y-auto pr-1 custom-scrollbar">
            `;

            activeKeys.forEach(k => {
                const cur = metrics[k];
                const prev = (prevMetricsHist && prevMetricsHist[k]) ? prevMetricsHist[k] : { count: 0, durationMin: 0 };
                const curMttrMin = cur.count > 0 ? (cur.durationMin / cur.count) : 0;
                const prevMttrMin = prev.count > 0 ? (prev.durationMin / prev.count) : 0;

                html += renderComparisonRow(k, cur.count, prev.count, curMttrMin, prevMttrMin);
            });

            html += `
                    </div>
                </div>
            `;

            histContainer.innerHTML = html;
        } else {
            histContainer.innerHTML = `<div class="text-sm text-slate-400 italic text-center p-6">Análise histórica disponível apenas para o ano de 2026.</div>`;
        }
    }

    function renderConcessaoTimeline() {
        const timelineEl = document.getElementById('concessao-timeline-content');
        if (!timelineEl || !ALL_DATA.rawIncidents) return;

        // Define periods (using timestamp for easy comparison)
        // Month is 0-indexed in JS Date: April = 3, May = 4, June = 5
        const p1Start = new Date(2026, 3, 12).getTime();
        const p1End = new Date(2026, 3, 24, 23, 59, 59).getTime();

        const p2Start = new Date(2026, 4, 31).getTime();
        const p2End = new Date(2026, 6, 10, 23, 59, 59).getTime();

        // Filter and sort incidents that are marked as "Concessão" AND fall into the defined periods
        const concessaoIncidents = ALL_DATA.rawIncidents.filter(inc => {
            if (!inc.isConcessao) return false;
            const ts = inc.dataAberturaTimestamp;
            return (ts >= p1Start && ts <= p1End) || (ts >= p2Start && ts <= p2End);
        }).sort((a, b) => a.dataAberturaTimestamp - b.dataAberturaTimestamp);

        if (concessaoIncidents.length === 0) {
            timelineEl.innerHTML = `<div class="text-sm text-slate-500 italic text-center py-6 bg-slate-50 rounded-lg border border-slate-100">Nenhum incidente "Anistiado" foi encontrado nas datas de concessão informadas.</div>`;
            return;
        }

        // Build a horizontal timeline layout with flex wrap
        let html = `<div class="relative flex flex-col md:flex-row flex-wrap gap-6 items-stretch">`;

        // Horizontal dashed line connecting dots (only visible on md+ screens)
        html += `<div class="hidden md:block absolute top-[22px] left-8 right-8 h-px border-t-2 border-dashed border-slate-200 z-0"></div>`;

        concessaoIncidents.forEach((inc) => {
            const ts = inc.dataAberturaTimestamp;
            const periodLabel = (ts >= p1Start && ts <= p1End) ? "1º Período" : "2º Período";
            const isSev0 = inc.severidade.startsWith('0');
            const colorClass = isSev0 ? 'bg-natura-red-buriti' : 'bg-natura-orange';
            const shadowClass = isSev0 ? 'shadow-natura-red-buriti/40' : 'shadow-natura-orange/40';

            html += `
                <div class="relative z-10 flex-1 min-w-[220px] max-w-[300px] cursor-pointer group" onclick="openIncidentsModal('concessao', '${inc.id}')">
                    <!-- The Dot -->
                    <div class="hidden md:flex mx-auto w-4 h-4 rounded-full ${colorClass} shadow-md ${shadowClass} mb-4 ring-4 ring-white transition-transform group-hover:scale-125"></div>
                    
                    <!-- The Card -->
                    <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm group-hover:shadow-lg transition-all group-hover:-translate-y-1 group-hover:border-natura-green-capim/50 relative">
                        <div class="md:hidden absolute -left-3 top-6 w-4 h-4 rounded-full ${colorClass} shadow-md ${shadowClass} ring-4 ring-white"></div>
                        <div class="flex justify-between items-start mb-3">
                            <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${periodLabel}</span>
                            <span class="inline-block px-2 py-0.5 text-[10px] font-bold rounded-md ${isSev0 ? 'bg-natura-red-buriti/10 text-natura-red-buriti' : 'bg-natura-orange/10 text-natura-orange'}">
                                SEV ${inc.severidade}
                            </span>
                        </div>
                        <h5 class="text-lg font-black text-slate-800 mb-1 leading-none">${inc.id}</h5>
                        <p class="text-xs text-slate-500 font-medium mb-3">${inc.dataDefinicao}</p>
                        <p class="text-xs text-slate-600 line-clamp-2 leading-relaxed bg-slate-50 p-2 rounded border border-slate-100">${inc.descImpacto}</p>
                    </div>
                </div>
            `;
        });

        html += `</div>`;
        timelineEl.innerHTML = html;
    }

    function exportData(e) {
        if (e) e.stopPropagation();

        if (!ALL_DATA.rawIncidents || ALL_DATA.rawIncidents.length === 0) {
            alert("Nenhum dado disponível para exportar.");
            return;
        }

        const exportDataList = ALL_DATA.rawIncidents.map(inc => ({
            "Número do Incidente": inc.id,
            "Problemas": inc.problem || "",
            "Data Abertura": inc.dataDefinicao,
            "Data Encerramento": inc.dataEncerramento,
            "TTR": inc.ttr,
            "Severidade": inc.severidade,
            "Abrangência": inc.abrangencia,
            "Jornada Impactada": inc.jornada,
            "Descrição do Impacto": inc.descImpacto,
            "Ofensor": inc.offender,
            "Descrição Ofensor": inc.descOfensor,
            "Tecnologia Impactada": inc.tech,
            "Solução aplicada": inc.solucao
        }));

        const ws = XLSX.utils.json_to_sheet(exportDataList);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Incidentes");
        XLSX.writeFile(wb, "Incidentes.xlsx");
    }

    function openSubjectiveDecisionsModal() {
        const modal = document.getElementById('subjective-decisions-modal');
        const list = document.getElementById('subjective-decisions-list');

        if (!modal || !list) return;

        list.innerHTML = '';

        const filteredIncidents = (ALL_DATA.rawIncidents || []).filter(inc => inc.consideracoes && inc.consideracoes.trim() !== "");

        if (filteredIncidents.length === 0) {
            list.innerHTML = `<div class="text-sm text-slate-500 italic text-center p-6">Nenhum incidente com decisões subjetivas registrado.</div>`;
        } else {
            let html = '';
            filteredIncidents.forEach(inc => {
                html += `
                <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm hover:shadow-md transition-shadow">
                    <div class="flex flex-col sm:flex-row justify-between items-start mb-4 gap-2">
                        <div class="flex items-center gap-3">
                            <h3 class="text-lg font-bold text-slate-800">${inc.id}</h3>
                            <span class="px-2 py-1 text-xs font-bold rounded-md ${inc.severidade.startsWith('0') ? 'bg-natura-red-buriti/10 text-natura-red-buriti' : 'bg-natura-orange/10 text-natura-orange'}">
                                SEV ${inc.severidade}
                            </span>
                        </div>
                        <div class="text-xs text-slate-500 sm:text-right flex flex-col gap-0.5">
                            <p><span class="font-bold text-slate-600">Abertura:</span> ${inc.dataDefinicao}</p>
                            <p><span class="font-bold text-slate-600">Encerramento:</span> ${inc.dataEncerramento}</p>
                            <p class="text-natura-green-cerrado font-bold text-sm mt-1">TTR: ${inc.ttr}</p>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm mt-4 pt-4 border-t border-slate-100">
                        <div>
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Abrangência</p>
                            <p class="text-slate-700 font-medium">${renderFlags(inc.abrangencia)}</p>
                        </div>
                        <div>
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Jornada Impactada</p>
                            ${renderJornadas(inc.jornada)}
                        </div>
                        <div class="md:col-span-2">
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Descrição do Impacto</p>
                            <p class="text-slate-700 bg-slate-50 p-3 rounded-lg border border-slate-100 leading-relaxed text-xs">${inc.descImpacto}</p>
                        </div>
                        <div class="md:col-span-2">
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Descrição do Ofensor</p>
                            <div class="bg-slate-50 p-3 rounded-lg border border-slate-100 leading-relaxed text-xs">
                                <span class="font-bold text-slate-800 text-sm block mb-1">${inc.offender}</span>
                                <span class="text-slate-700">${inc.descOfensor}</span>
                            </div>
                        </div>
                        <div class="md:col-span-2">
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Solução Aplicada</p>
                            <p class="text-slate-700 bg-slate-50 p-3 rounded-lg border border-slate-100 leading-relaxed text-xs">${inc.solucao}</p>
                        </div>
                    </div>

                    <!-- Ênfase nas Considerações e Decisões -->
                    <div class="mt-6 pt-5 border-t-2 border-natura-green-capim/50">
                        <p class="text-sm font-black text-natura-green-cerrado uppercase tracking-widest mb-3 flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
                            </svg>
                            Considerações e Decisões
                        </p>
                        <div class="text-sm text-slate-800 bg-natura-green-capim/10 p-5 rounded-xl border border-natura-green-capim/40 whitespace-pre-wrap font-medium shadow-inner">${inc.consideracoes}</div>
                    </div>
                </div>
                `;
            });
            list.innerHTML = html;
        }

        modal.classList.remove('hidden');
    }
</script>

<script>
    let ALL_DATA = {};
    let CURRENT_FILTERS = {
        card: 'total',
        periodKey: 'All', // Tab 1
        startDate: null,
        endDate: null,
        year: null,
        evolutionGrouping: 'monthly',
        evolutionDimension: 'default', // 'default' | 'severidade' | 'deteccao' | 'jornada' | 'pais'
        comparisonMode: 'none', // 'none' | 'previous'
        techFilter: [],
        ofensorFilter: []
    };
    let COMPARISON_LABEL = '';
    let FILTER_OPTIONS_LOADED = false;

    // Página única: Incidentes e Problemas carregam em paralelo, então o loader só some quando os dois terminam
    let PENDING_LOADS = 0;
    function showLoader() {
        PENDING_LOADS++;
        const loader = document.getElementById('loader-container');
        if (loader) loader.classList.remove('hidden');
    }
    function hideLoader() {
        PENDING_LOADS = Math.max(0, PENDING_LOADS - 1);
        if (PENDING_LOADS === 0) {
            const loader = document.getElementById('loader-container');
            if (loader) loader.classList.add('hidden');
        }
    }

    // Globals for Chart Instances
    let charts = {};

    function logDebug(msg) {
        const container = document.getElementById('debug-log-container');
        if (container) {
            const p = document.createElement('p');
            p.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            container.appendChild(p);
            container.scrollTop = container.scrollHeight;
        }
        console.log(`[DEBUG] ${msg}`);
    }

    console.log("Dashboard Script Execution Started");

    document.addEventListener('DOMContentLoaded', function () {
        logDebug("DOM Loaded. Initializing...");

        if (typeof Chart === 'undefined') {
            logDebug("CRITICAL: Chart.js library NOT loaded.");
            return;
        }

        Chart.defaults.font.family = "'Inter', sans-serif";
        Chart.defaults.color = '#64748b';
        Chart.defaults.borderColor = '#e2e8f0';

        if (typeof ChartDataLabels !== 'undefined') Chart.register(ChartDataLabels);

        setupSectionNav();
        setupFiltersToggle();
        setupTabularIncidentsButtons();
        setupMetodologiaModal();
        loadInitialConfig();
        const yearSelect = document.getElementById('year-select');
        yearSelect.addEventListener('change', function (e) {
            logDebug("Year changed to: " + e.target.value);
            CURRENT_FILTERS.year = e.target.value;
            recomputeSpecificFilterForNewYear();

            // Freeze/Soft Freeze/Hard Freeze não existem para 2026: reconstrói os períodos estratégicos disponíveis
            if (ALL_DATA.periodFilters) setupPeriodFilters(ALL_DATA.periodFilters);

            // Tecnologia/Ofensor disponíveis podem mudar de ano para ano: reseta os filtros e a lista de opções
            CURRENT_FILTERS.techFilter = [];
            CURRENT_FILTERS.ofensorFilter = [];
            FILTER_OPTIONS_LOADED = false;
            updateTechOfensorFilterButtons();

            // Página única: Incidentes e Problemas ficam visíveis ao mesmo tempo, então ambos recarregam
            loadFilteredData();
            loadProblemsTab();
        });

        // Ranking Search Handler
        const rankingSearch = document.getElementById('ranking-search');
        if (rankingSearch) {
            rankingSearch.addEventListener('input', (e) => {
                RANKING_STATE.searchQuery = e.target.value.toLowerCase();
                renderRanking();
            });
        }
    });

    // Seção de Filtros: recolhida por padrão, abre/fecha de forma interativa ao clicar no cabeçalho
    function setupFiltersToggle() {
        const btn = document.getElementById('btn-toggle-filters');
        const body = document.getElementById('filters-body');
        const chevron = document.getElementById('filters-toggle-chevron');
        if (!btn || !body) return;

        btn.addEventListener('click', () => {
            const isHidden = body.classList.contains('hidden');
            body.classList.toggle('hidden', !isHidden);
            if (chevron) chevron.classList.toggle('rotate-180', isHidden);
        });
    }

    // Botões que abrem o pop-up tabular genérico (Incidentes Fora do OLA / Divergências Sev x Prioridade)
    function setupTabularIncidentsButtons() {
        const foraOlaBtn = document.getElementById('btn-open-fora-ola');
        if (foraOlaBtn) {
            foraOlaBtn.addEventListener('click', () => {
                openTabularIncidentsModal({
                    title: 'Incidentes Fora do OLA',
                    subtitle: `${(ALL_DATA.incidentesForaOLA || []).length} incidente(s) acima da meta de restauração (Sev0 > 2h, Sev1 > 6h)`,
                    items: ALL_DATA.incidentesForaOLA || [],
                    columns: [
                        { key: 'id', label: 'Incidente' },
                        { key: 'severidade', label: 'Severidade' },
                        { key: 'ttr', label: 'TTR' },
                        { key: 'origemDeteccao', label: 'Origem da Detecção' },
                        { key: 'service', label: 'Service (ServiceNow)' },
                        { key: 'serviceOffering', label: 'Service Offering (ServiceNow)' },
                        { key: 'grupoResponsavel', label: 'Grupo Responsável (ServiceNow)' }
                    ]
                });
            });
        }

        const divergenciasBtn = document.getElementById('btn-open-divergencias');
        if (divergenciasBtn) {
            divergenciasBtn.addEventListener('click', () => {
                openTabularIncidentsModal({
                    title: 'Divergências Sev x Prioridade',
                    subtitle: `${(ALL_DATA.divergenciasSevPrio || []).length} incidente(s) com Severidade não alinhada à Priority do ServiceNow`,
                    items: ALL_DATA.divergenciasSevPrio || [],
                    columns: [
                        { key: 'id', label: 'Incidente' },
                        { key: 'severidade', label: 'Severidade' },
                        { key: 'priority', label: 'Priority (ServiceNow)' },
                        { key: 'origemDeteccao', label: 'Origem da Detecção' },
                        { key: 'service', label: 'Service (ServiceNow)' },
                        { key: 'serviceOffering', label: 'Service Offering (ServiceNow)' },
                        { key: 'grupoResponsavel', label: 'Grupo Responsável (ServiceNow)' }
                    ]
                });
            });
        }

        const closeBtn = document.getElementById('btn-close-tabular-incidents');
        const modal = document.getElementById('tabular-incidents-modal');
        if (closeBtn && modal) {
            closeBtn.addEventListener('click', () => modal.classList.add('hidden'));
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.add('hidden'); });
        }
    }

    // Renderiza o pop-up tabular genérico com as colunas informadas
    function openTabularIncidentsModal(opts) {
        const modal = document.getElementById('tabular-incidents-modal');
        const titleEl = document.getElementById('tabular-incidents-title');
        const subtitleEl = document.getElementById('tabular-incidents-subtitle');
        const thead = document.getElementById('tabular-incidents-thead');
        const tbody = document.getElementById('tabular-incidents-tbody');
        if (!modal || !thead || !tbody) return;

        if (titleEl) titleEl.textContent = opts.title || 'Incidentes';
        if (subtitleEl) subtitleEl.textContent = opts.subtitle || '';

        thead.innerHTML = `<tr>${opts.columns.map(c => `<th class="text-left font-bold text-slate-500 uppercase tracking-wider text-[10px] px-3 py-2 border-b border-slate-200">${c.label}</th>`).join('')}</tr>`;

        const items = opts.items || [];
        if (!items.length) {
            tbody.innerHTML = `<tr><td colspan="${opts.columns.length}" class="text-center text-slate-300 italic py-6">Nenhum registro encontrado no período filtrado.</td></tr>`;
        } else {
            tbody.innerHTML = items.map(item => `
                <tr class="hover:bg-slate-50">
                    ${opts.columns.map(c => `<td class="px-3 py-2 text-slate-600 whitespace-nowrap">${escapeXml(item[c.key] != null ? item[c.key] : 'N/A')}</td>`).join('')}
                </tr>
            `).join('');
        }

        modal.classList.remove('hidden');
    }

    // Navegação por seção (página única, scroll contínuo): clique rola suavemente até a seção,
    // e o observer abaixo mantém a aba ativa sincronizada com a seção visível na tela.
    function setupSectionNav() {
        const links = document.querySelectorAll('.section-nav-link');
        if (!links.length) return;

        links.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const target = document.getElementById(link.dataset.section);
                if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
        });

        const sections = Array.from(document.querySelectorAll('section[id^="sec-"]'));
        if (!sections.length || typeof IntersectionObserver === 'undefined') return;

        const setActiveLink = (sectionId) => {
            links.forEach(l => {
                const isActive = l.dataset.section === sectionId;
                l.classList.toggle('section-nav-link-active', isActive);
            });
        };

        const headerEl = document.getElementById('app-header');
        const headerHeight = headerEl ? headerEl.offsetHeight : 96;

        const observer = new IntersectionObserver((entries) => {
            // Escolhe a seção com maior proporção visível dentre as que estão intersectando
            const visible = entries.filter(e => e.isIntersecting);
            if (visible.length === 0) return;
            visible.sort((a, b) => b.intersectionRatio - a.intersectionRatio);
            setActiveLink(visible[0].target.id);
        }, {
            root: null,
            rootMargin: `-${headerHeight}px 0px -60% 0px`,
            threshold: [0, 0.1, 0.25, 0.5, 0.75, 1]
        });

        sections.forEach(sec => observer.observe(sec));
        setActiveLink(sections[0].id);
    }

    // Modal de Metodologia dos Indicadores (acessível pelo botão no rodapé)
    function setupMetodologiaModal() {
        const btn = document.getElementById('btn-open-metodologia');
        const modal = document.getElementById('metodologia-modal');
        const closeBtn = document.getElementById('btn-close-metodologia');
        if (!btn || !modal) return;

        const open = () => modal.classList.remove('hidden');
        const close = () => modal.classList.add('hidden');

        btn.addEventListener('click', open);
        if (closeBtn) closeBtn.addEventListener('click', close);
        modal.addEventListener('click', (e) => { if (e.target === modal) close(); });
    }

    function loadInitialConfig() {
        logDebug("Calling getInitialConfig (Backend)...");
        const loader = document.getElementById('loader-container');
        if (loader) loader.classList.remove('hidden');
        google.script.run
            .withSuccessHandler(setupDashboard)
            .withFailureHandler((e) => {
                logDebug("getInitialConfig FAILED: " + e.message);
                handleError(e);
            })
            .getInitialConfig();
    }

    function setupDashboard(data) {
        logDebug("getInitialConfig Success. Data received.");
        if (data.error) {
            logDebug("Server reported error: " + data.error);
            handleError(data.error);
            return;
        }
        ALL_DATA = data;

        // Populate Year Selector
        const yearSelect = document.getElementById('year-select');
        if (yearSelect && data.availableYears && data.availableYears.length > 0) {
            yearSelect.innerHTML = '';
            data.availableYears.forEach(year => {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                yearSelect.appendChild(option);
            });
            CURRENT_FILTERS.year = data.availableYears[0];
        }

        setupPeriodFilters(data.periodFilters); // Tab 1

        // Cards Sev0/Sev1 não filtram mais o site ao clicar: as seções de detalhe já trazem a visão por Severidade

        setupSpecificFilters();
        setupCustomRangeFilter();
        setupComparisonFilter();
        setupTechOfensorFilterDropdowns();
        setupEvolutionToggle();
        setupEvolutionDimensionSelect();
        setupLocalEvolutionToggle('jornadas-paises', 'jp-evolution-toggle', 'jp-evolution-chart', 'jpChartInstance', 'jp-evolution-title', 'Incidentes');
        setupJpDimensionToggle('jp-dimension-toggle', 'jp-evolution-chart', 'jpChartInstance', 'jp-evolution-title', 'Incidentes');
        setupJpWeekNav('jp-week-prev', 'jp-week-next', 'jp-evolution-chart', 'jpChartInstance', 'jp-evolution-title', 'Incidentes');
        setupLocalEvolutionToggle('mudancas', 'mudanca-evolution-toggle', 'mudanca-evolution-chart', 'mudancaEvChartInstance', 'mudanca-evolution-title', 'Incidentes por Mudança');
        loadQualidadeMudancaData();

        logDebug("Initial setup complete. Loading page data...");

        // Página única: Incidentes e Problemas carregam juntos, já que ambos ficam visíveis na rolagem
        loadFilteredData();
        loadProblemsTab();
    }

    function loadFilteredData() {
        logDebug("Loading Tab 1 Data...");
        showLoader();
        google.script.run
            .withSuccessHandler(renderTab1Data)
            .withFailureHandler((e) => {
                logDebug("getFilteredData (Tab 1) FAILED: " + e.message);
                handleError(e);
            })
            .getFilteredData(
                CURRENT_FILTERS.year,
                CURRENT_FILTERS.periodKey,
                CURRENT_FILTERS.startDate,
                CURRENT_FILTERS.endDate,
                CURRENT_FILTERS.card,
                CURRENT_FILTERS.techFilter,
                CURRENT_FILTERS.ofensorFilter
            );
    }


    function loadProblemsTab() {
        logDebug("Loading Major Problems Data...");
        showLoader();

        google.script.run
            .withSuccessHandler(renderProblemsData)
            .withFailureHandler((e) => {
                logDebug("getMajorProblemsData FAILED: " + e.message);
                handleError(e);
            })
            .getMajorProblemsData(CURRENT_FILTERS.year);
    }

    function renderProblemsData(data) {
        logDebug("Problems Data Received.");
        console.log("Full data object:", data);
        if (data.error) {
            logDebug("Problems Data Error: " + data.error);
            handleError(data.error);
            return;
        }

        // 1. KPIs
        const setText = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
        const setPct = (id, val, total) => {
            const el = document.getElementById(id);
            if (el) {
                const pct = total > 0 ? ((val / total) * 100).toFixed(1) : "0.0";
                el.textContent = `(${pct}%)`;
            }
        };

        setText('mp-total-incidencts', data.kpis.totalIncidentes);
        setText('mp-total-problems', data.kpis.totalProblemas);

        setText('mp-open-problems', data.kpis.problemasAbertos);
        setPct('mp-open-problems-pct', data.kpis.problemasAbertos, data.kpis.totalProblemas);

        setText('mp-resolved-problems', data.kpis.problemasResolvidos);
        setPct('mp-resolved-problems-pct', data.kpis.problemasResolvidos, data.kpis.totalProblemas);

        setText('mp-impl-problems', data.kpis.problemasImpl);
        setPct('mp-impl-problems-pct', data.kpis.problemasImpl, data.kpis.totalProblemas);

        setText('mp-rca-pending', data.kpis.rcaPendentes);
        setPct('mp-rca-pending-pct', data.kpis.rcaPendentes, data.kpis.totalProblemas);

        // New KPIs
        setText('mp-avg-aging-resolved', data.kpis.avgAgingResolved + " Dias");
        setText('mp-avg-mttrc', data.kpis.avgMTTRC + " Horas");
        setText('mp-avg-aging-backlog', data.kpis.avgAgingBacklog + " Dias");

        // KPIs por Severidade
        const bySev = data.kpisBySeveridade || {};
        ['Sev0', 'Sev1'].forEach(sev => {
            const d = bySev[sev] || { problemasAbertos: 0, problemasResolvidos: 0, problemasImpl: 0, rcaPendentes: 0 };
            const prefix = sev.toLowerCase();
            setText(`mp-${prefix}-abertos`, d.problemasAbertos);
            setText(`mp-${prefix}-resolvidos`, d.problemasResolvidos);
            setText(`mp-${prefix}-impl`, d.problemasImpl);
            setText(`mp-${prefix}-rca`, d.rcaPendentes);
        });

        // 2. Charts
        drawProblemsChart(data.monthly);
        drawMonthlyYTDChart(data.monthlyYTD);
        drawWeeklyWTDChart(data.weeklyWTD);

        // 3. Rankings
        const renderRank = (id, list) => {
            const container = document.getElementById(id);
            if (!container) return;
            if (!list || list.length === 0) {
                container.innerHTML = `<div class="text-[11px] text-slate-400 italic py-2 px-2">Nenhum dado encontrado.</div>`;
                return;
            }
            container.innerHTML = list.map(item => {
                return `<div class="flex justify-between items-center text-[11px] py-1.5 border-b border-slate-50 last:border-0 hover:bg-slate-50 px-2 rounded transition-colors">
                    <span class="font-medium text-slate-700 truncate pr-2 uppercase" title="${item.name}">${item.name}</span>
                    <span class="flex-none text-slate-500 whitespace-nowrap">
                        <span class="font-bold text-natura-orange">${item.count}</span> RCAs | 
                        <span class="font-bold text-natura-blue-profundo">${item.avgAging} Dias</span>
                    </span>
                </div>`;
            }).join('');
        };

        renderRank('mp-top-backlog-list', data.topBacklogTeams);
        renderRank('mp-top-resolved-list', data.topResolvedTeams);

        hideLoader();
    }

    function drawMonthlyYTDChart(ytdData) {
        const ctx = document.getElementById('majorProblemsMonthlyYTD').getContext('2d');
        const months = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
        const active = months.filter(m => ytdData[m] !== undefined);
        const labels = active.map(m => m.charAt(0).toUpperCase() + m.slice(1));
        const resolved = active.map(m => ytdData[m].resolved);
        const aging = active.map(m => ytdData[m].avgAging);

        // Eixos dinâmicos
        const maxResolved = Math.max(...resolved, 0);
        const maxAging = Math.max(...aging, 0);
        const axisMaxResolved = Math.ceil((maxResolved + 0.1) / 10) * 10;
        const axisMaxAging = Math.ceil((maxAging + 0.1) / 10) * 10;

        if (window.ytdChartInstance) window.ytdChartInstance.destroy();
        window.ytdChartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    { label: 'Resolvidos', data: resolved, backgroundColor: '#045473', order: 1 },
                    { label: 'Aging Médio', data: aging, type: 'line', borderColor: '#1B472A', backgroundColor: '#1B472A', borderWidth: 2, pointRadius: 4, order: 0, yAxisID: 'y-aging' }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        title: { display: true, text: 'Resolvidos' },
                        max: axisMaxResolved
                    },
                    'y-aging': {
                        position: 'right',
                        beginAtZero: true,
                        title: { display: true, text: 'Aging (Dias)' },
                        grid: { drawOnChartArea: false },
                        max: axisMaxAging
                    }
                },
                plugins: {
                    datalabels: {
                        color: '#FFFFFF',
                        backgroundColor: (context) => context.dataset.type === 'line' ? '#1B472A' : null,
                        borderRadius: 4,
                        padding: { top: 4, bottom: 4, left: 6, right: 6 },
                        font: { weight: 'bold', size: 10 },
                        display: (context) => context.dataset.data[context.dataIndex] > 0
                    }
                }
            }
        });
    }

    function drawWeeklyWTDChart(wtdData) {
        const ctx = document.getElementById('majorProblemsWeeklyWTD').getContext('2d');
        const labels = Object.keys(wtdData).sort((a, b) => {
            const nA = parseInt(a.replace(/\D/g, ''));
            const nB = parseInt(b.replace(/\D/g, ''));
            return nA - nB;
        });
        const resolved = labels.map(l => wtdData[l].resolved);
        const aging = labels.map(l => wtdData[l].avgAging);

        // Eixos dinâmicos
        const maxResolved = Math.max(...resolved, 0);
        const maxAging = Math.max(...aging, 0);
        const axisMaxResolved = Math.ceil((maxResolved + 0.1) / 10) * 10;
        const axisMaxAging = Math.ceil((maxAging + 0.1) / 10) * 10;

        if (window.wtdChartInstance) window.wtdChartInstance.destroy();
        window.wtdChartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    { label: 'Resolvidos', data: resolved, backgroundColor: '#045473', order: 1 },
                    { label: 'Aging Médio', data: aging, type: 'line', borderColor: '#112E22', backgroundColor: '#112E22', borderWidth: 2, pointRadius: 4, order: 0, yAxisID: 'y-aging' }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        title: { display: true, text: 'Resolvidos' },
                        max: axisMaxResolved
                    },
                    'y-aging': {
                        position: 'right',
                        beginAtZero: true,
                        title: { display: true, text: 'Aging (Dias)' },
                        grid: { drawOnChartArea: false },
                        max: axisMaxAging
                    }
                },
                plugins: {
                    datalabels: {
                        color: '#FFFFFF',
                        backgroundColor: (context) => context.dataset.type === 'line' ? '#112E22' : null,
                        borderRadius: 4,
                        padding: { top: 4, bottom: 4, left: 6, right: 6 },
                        font: { weight: 'bold', size: 10 },
                        display: (context) => context.dataset.data[context.dataIndex] > 0
                    }
                }
            }
        });
    }

    function drawProblemsChart(monthlyData) {
        const ctx = document.getElementById('majorProblemsChart').getContext('2d');
        const months = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];

        // Filter out empty months if desired, or show all up to current?
        // User asked "Grafico de tempo por mês", showing all is safer or active ones.
        // Let's show active ones or all.
        const active = months.filter(m => monthlyData[m] !== undefined);
        const labels = active.map(m => m.charAt(0).toUpperCase() + m.slice(1));

        const dataResolved = active.map(m => monthlyData[m].resolved);
        const dataImpl = active.map(m => monthlyData[m].implementation);
        const dataRca = active.map(m => monthlyData[m].rcaPending);
        const dataIncidents = active.map(m => monthlyData[m].incidentsCount || 0);

        // Eixo dinâmico (considerando stack de problemas + linha de incidentes)
        const totals = active.map(m => (monthlyData[m].resolved || 0) + (monthlyData[m].implementation || 0) + (monthlyData[m].rcaPending || 0));
        const maxVal = Math.max(...totals, ...dataIncidents, 0);
        const axisMax = Math.ceil((maxVal + 0.1) / 10) * 10;

        if (window.problemsChartInstance) window.problemsChartInstance.destroy();

        window.problemsChartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Incidentes',
                        data: dataIncidents,
                        type: 'line',
                        borderColor: '#112E22', // Green Amazonia
                        backgroundColor: '#112E22',
                        borderWidth: 2,
                        pointRadius: 4,
                        order: 0
                    },
                    {
                        label: 'Resolvidos',
                        data: dataResolved,
                        backgroundColor: '#1B472A', // Green Cerrado
                        stack: 'stack1',
                        order: 1
                    },
                    {
                        label: 'Em Implementação',
                        data: dataImpl,
                        backgroundColor: '#E29627', // Yellow Tucuma
                        stack: 'stack1',
                        order: 1
                    },
                    {
                        label: "RCA's Pendentes",
                        data: dataRca,
                        backgroundColor: '#045473', // Blue Profundo
                        stack: 'stack1',
                        order: 1
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { stacked: true },
                    y: {
                        beginAtZero: true,
                        title: { display: true, text: 'Quantidade (Incidentes e Problemas)' },
                        max: axisMax
                    }
                },
                plugins: {
                    tooltip: { mode: 'index', intersect: false },
                    datalabels: {
                        display: (context) => {
                            return context.dataset.data[context.dataIndex] > 0;
                        },
                        color: '#FFFFFF', // All labels white
                        backgroundColor: (context) => {
                            // If it's the line, use the dark green background for the bubble
                            return context.dataset.type === 'line' ? '#112E22' : null;
                        },
                        borderRadius: 4,
                        padding: { top: 2, bottom: 2, left: 4, right: 4 },
                        font: { weight: 'bold', size: 10 },
                        formatter: (val) => val
                    }
                }
            }
        });
    }

    function renderTab1Data(data) {
        logDebug("Tab 1 Data Received. Rendering...");
        if (data.error) {
            logDebug("Tab 1 Data Error: " + data.error);
            handleError(data.error);
            return;
        }
        renderKpiCards(data.kpis);
        renderDivergenciasSevPrio(data.divergenciasSevPrio);
        renderIncidentesForaOLA(data.incidentesForaOLA);
        renderGruposResponsaveis(data.gruposResponsaveis);

    // Recalcula o intervalo de datas do filtro de Mês/Trimestre ativo quando o Ano de Referência muda
    function recomputeSpecificFilterForNewYear() {
        const key = CURRENT_FILTERS.periodKey || '';
        const year = parseInt(CURRENT_FILTERS.year, 10);
        if (key.startsWith('Mes_')) {
            const monthIndex = parseInt(key.split('_')[1], 10);
            const start = new Date(year, monthIndex, 1, 0, 0, 0);
            const end = new Date(year, monthIndex + 1, 0, 23, 59, 59);
            LABEL_MAP[key] = `${MONTH_NAMES_PT[monthIndex]}/${year}`;
            CURRENT_FILTERS.startDate = start.getTime();
            CURRENT_FILTERS.endDate = end.getTime();
        } else if (key.startsWith('Trimestre_')) {
            const q = parseInt(key.split('_')[1], 10);
            const startMonth = (q - 1) * 3;
            const start = new Date(year, startMonth, 1, 0, 0, 0);
            const end = new Date(year, startMonth + 3, 0, 23, 59, 59);
            LABEL_MAP[key] = `Q${q}/${year}`;
            CURRENT_FILTERS.startDate = start.getTime();
            CURRENT_FILTERS.endDate = end.getTime();
        }
    }

    // Filtro por Intervalo de Datas livre: usuário escolhe De/Até e aplica, reaproveitando
    // o mesmo mecanismo de filtro por data já usado pelos demais filtros de período
    function setupCustomRangeFilter() {
        const startInput = document.getElementById('range-filter-start');
        const endInput = document.getElementById('range-filter-end');
        const applyBtn = document.getElementById('btn-apply-range');
        const clearBtn = document.getElementById('btn-clear-range');
        if (!startInput || !endInput || !applyBtn) return;

        const clearPeriodButtons = () => updateAllPeriodButtonsUI(null);

        applyBtn.addEventListener('click', () => {
            const startVal = startInput.value;
            const endVal = endInput.value;
            if (!startVal || !endVal) {
                alert('Selecione as duas datas (De e Até) para aplicar o filtro.');
                return;
            }

            const [sy, sm, sd] = startVal.split('-').map(n => parseInt(n, 10));
            const [ey, em, ed] = endVal.split('-').map(n => parseInt(n, 10));
            const start = new Date(sy, sm - 1, sd, 0, 0, 0);
            const end = new Date(ey, em - 1, ed, 23, 59, 59);

            if (start > end) {
                alert('A data "De" não pode ser posterior à data "Até".');
                return;
            }

            const key = `Range_${startVal}_${endVal}`;
            const pad = n => String(n).padStart(2, '0');
            LABEL_MAP[key] = `${pad(sd)}/${pad(sm)}/${sy} a ${pad(ed)}/${pad(em)}/${ey}`;

            CURRENT_FILTERS.periodKey = key;
            CURRENT_FILTERS.startDate = start.getTime();
            CURRENT_FILTERS.endDate = end.getTime();

            const monthSelect = document.getElementById('month-filter-select');
            const quarterSelect = document.getElementById('quarter-filter-select');
            if (monthSelect) monthSelect.value = '';
            if (quarterSelect) quarterSelect.value = '';

            clearPeriodButtons();
            refreshActiveFilterText();
            loadFilteredData();
        });

        if (clearBtn) {
            clearBtn.addEventListener('click', () => {
                startInput.value = '';
                endInput.value = '';
            });
        }
    }

    // Aplica (ou esconde) o badge de variação de um card em relação ao período de comparação
    // Converte "HH:MM" em minutos totais
    function parseHHMMToMinutes(str) {
        const parts = String(str || '00:00').split(':');
        return (parseInt(parts[0], 10) || 0) * 60 + (parseInt(parts[1], 10) || 0);
    }

    function applyDeltaBadge(elId, current, previous, opts) {
        const el = document.getElementById(elId);
        if (!el) return;
        opts = opts || {};

        if (previous === null || previous === undefined || CURRENT_FILTERS.comparisonMode !== 'previous') {
            el.classList.add('hidden');
            return;
        }

        let diff, arrow, isGood, valueText;

        if (opts.isDuration) {
            // MTTR: "HH:MM" -> diferença em minutos, exibida como tempo + %
            const curMin = parseHHMMToMinutes(current);
            const prevMin = parseHHMMToMinutes(previous);
            diff = curMin - prevMin;
            arrow = diff === 0 ? '≈' : (diff > 0 ? '▲' : '▼');
            isGood = diff <= 0; // MTTR menor é melhor
            const pctChange = prevMin !== 0 ? (diff / prevMin) * 100 : (curMin > 0 ? 100 : 0);
            const sign = diff > 0 ? '+' : (diff < 0 ? '-' : '');
            const absMin = Math.abs(diff);
            const h = Math.floor(absMin / 60);
            const m = Math.round(absMin % 60);
            const durText = h > 0 ? `${sign}${h}h${String(m).padStart(2, '0')}m` : `${sign}${m}m`;
            valueText = `${durText} (${pctChange > 0 ? '+' : ''}${pctChange.toFixed(1)}%)`;
        } else if (opts.isPercentagePoints) {
            // Aderência OLA já é percentual: variação expressa em pontos percentuais (pp)
            diff = current - previous;
            arrow = diff === 0 ? '≈' : (diff > 0 ? '▲' : '▼');
            isGood = diff >= 0;
            valueText = `${diff > 0 ? '+' : ''}${diff.toFixed(1)}pp`;
        } else {
            // Volume de incidentes: número absoluto + % entre parênteses
            diff = current - previous;
            arrow = diff === 0 ? '≈' : (diff > 0 ? '▲' : '▼');
            isGood = diff <= 0;
            const pctChange = previous !== 0 ? (diff / previous) * 100 : (current > 0 ? 100 : 0);
            valueText = `${diff > 0 ? '+' : ''}${diff} (${pctChange > 0 ? '+' : ''}${pctChange.toFixed(1)}%)`;
        }

        el.textContent = `${arrow} ${valueText} vs ${COMPARISON_LABEL || 'período anterior'}`;
        el.classList.remove('hidden', 'bg-natura-green-cerrado/10', 'text-natura-green-cerrado',
            'bg-natura-red-buriti/10', 'text-natura-red-buriti');
        el.classList.add(...(isGood
            ? ['bg-natura-green-cerrado/10', 'text-natura-green-cerrado']
            : ['bg-natura-red-buriti/10', 'text-natura-red-buriti']));
    }

    // Busca os KPIs do período anterior equivalente e atualiza os badges de comparação dos cards
    function updateComparisonDisplay() {
        const badgeIds = ['delta-badge-total', 'delta-badge-sev0', 'delta-badge-sev1',
            'delta-badge-mttr-total', 'delta-badge-mttr-sev0', 'delta-badge-mttr-sev1',
            'delta-badge-ola', 'delta-badge-ola-sev0', 'delta-badge-ola-sev1',
            'delta-badge-jp', 'delta-badge-origem'];

        if (CURRENT_FILTERS.comparisonMode !== 'previous' || !ALL_DATA.currentKpis) {
            badgeIds.forEach(id => { const el = document.getElementById(id); if (el) el.classList.add('hidden'); });
            return;
        }

        google.script.run
            .withSuccessHandler(data => {
                if (!data || data.error || !data.available) {
                    badgeIds.forEach(id => { const el = document.getElementById(id); if (el) el.classList.add('hidden'); });
                    return;
                }
                COMPARISON_LABEL = data.label || 'período anterior';
                const cur = ALL_DATA.currentKpis;
                const prev = data.kpis;

                applyDeltaBadge('delta-badge-total', cur.incidentesTotal, prev.incidentesTotal);
                applyDeltaBadge('delta-badge-sev0', cur.incidentesSev0, prev.incidentesSev0);
                applyDeltaBadge('delta-badge-sev1', cur.incidentesSev1, prev.incidentesSev1);
                applyDeltaBadge('delta-badge-mttr-total', cur.mttrTotal, prev.mttrTotal, { isDuration: true });
                applyDeltaBadge('delta-badge-mttr-sev0', cur.mttrSev0, prev.mttrSev0, { isDuration: true });
                applyDeltaBadge('delta-badge-mttr-sev1', cur.mttrSev1, prev.mttrSev1, { isDuration: true });
                applyDeltaBadge('delta-badge-ola', cur.aderenciaOLA, prev.aderenciaOLA, { isPercentagePoints: true });
                applyDeltaBadge('delta-badge-ola-sev0', cur.aderenciaOLASev0, prev.aderenciaOLASev0, { isPercentagePoints: true });
                applyDeltaBadge('delta-badge-ola-sev1', cur.aderenciaOLASev1, prev.aderenciaOLASev1, { isPercentagePoints: true });
                // Jornadas & Países e Origem da Detecção mostram a volumetria geral de Incidentes: reaproveita a mesma comparação
                applyDeltaBadge('delta-badge-jp', cur.incidentesTotal, prev.incidentesTotal);
                applyDeltaBadge('delta-badge-origem', cur.incidentesTotal, prev.incidentesTotal);
            })
            .withFailureHandler(e => {
                logDebug("getComparisonData FAILED: " + e.message);
            })
            .getComparisonData(CURRENT_FILTERS.year, CURRENT_FILTERS.periodKey, CURRENT_FILTERS.startDate, CURRENT_FILTERS.endDate);
    }

    // Helper to refresh Active Filters text based on ALL current filters
    function refreshActiveFilterText() {
        const periodKey = CURRENT_FILTERS.periodKey;
        const cardKey = CURRENT_FILTERS.card;
        const container = document.getElementById('active-filters-text');

        if (!container) return;
        container.innerHTML = ''; // Clear current content
        container.className = "flex flex-wrap items-center gap-2"; // Ensure Flex container

        let hasFilter = false;

        // Helper to create filter tag
        const createTag = (label, onRemove) => {
            hasFilter = true;
            const tag = document.createElement('span');
            tag.className = 'inline-flex items-center px-2 py-1 rounded-md text-xs font-bold bg-natura-green-murumuru/10 text-natura-green-cerrado border border-natura-green-murumuru/20';

            const text = document.createElement('span');
            text.textContent = label;

            const btn = document.createElement('button');
            btn.className = 'ml-1 p-0.5 rounded-full hover:bg-natura-red-buriti hover:text-white transition-colors focus:outline-none';
            btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>`;
            btn.onclick = (e) => {
                e.stopPropagation();
                onRemove();
            };

            tag.appendChild(text);
            tag.appendChild(btn);
            container.appendChild(tag);
        };

        // 1. Period Part
        const periodLabel = LABEL_MAP[periodKey] || periodKey;
        if (periodLabel !== 'Período Completo') {
            createTag(periodLabel, () => {
                // Reset to All
                const allFilter = ALL_DATA.periodFilters.find(f => f.key === 'All');
                if (allFilter) {
                    CURRENT_FILTERS.periodKey = 'All';
                    CURRENT_FILTERS.startDate = null;
                    CURRENT_FILTERS.endDate = null;
                    resetSpecificFilterSelects();
                    updateAllPeriodButtonsUI('All');
                    refreshActiveFilterText();
                    loadFilteredData();
                }
            });
        }

        // 2. Card Part
        if (cardKey !== 'total') {
            let label = cardKey;
            if (cardKey === 'sev0') label = 'Sev 0';
            else if (cardKey === 'sev1') label = 'Sev 1';

            createTag(label, () => {
                CURRENT_FILTERS.card = 'total';
                refreshActiveFilterText();
                loadFilteredData();
            });
        }

        if (!hasFilter) {
            container.textContent = 'Nenhum';
            container.className = "text-sm font-semibold text-slate-700"; // Reset to text style
        }

        updateFilterIndicators(hasFilter);
    }

    // (Visão Geral, Jornadas & Países, Origem da Detecção, Evolução & Tecnologia, Mudanças). Problemas & Qualidade

    // evitando embutir dados dinâmicos (com aspas, acentos, etc.) direto em atributos onclick.
    let QM_ITEM_REGISTRY = {};
    let qmRegistryCounter = 0;

    function renderQualidadeMudancaData(data) {
        if (!data || data.error) {
            logDebug("Qualidade Mudança Data Error: " + (data ? data.error : 'sem resposta'));
            return;
        }

        QM_ITEM_REGISTRY = {};
        qmRegistryCounter = 0;

        ['geral', 'deploy', 'tradicional'].forEach(universoKey => {
            const block = data[universoKey] || {};
            renderQmMetricsTiles(`qm-metrics-${universoKey}`, block, QM_METRIC_CONFIG[universoKey]);

            const nEl = document.getElementById(QM_N_ELEMENT_ID[universoKey]);
            if (nEl) nEl.textContent = block.total || 0;

            renderQmRankedList(`qm-causaraiz-${universoKey}`, block.causaRaiz || [], universoKey, 'causaRaiz');
            renderQmRankedList(`qm-processo-${universoKey}`, block.processoOrigem || [], universoKey, 'processoOrigem');
        });
    }

    function formatQmPct(v) {
        return (v === null || v === undefined) ? '—' : `${v}%`;
    }

    function renderQmMetricsTiles(containerId, block, metricConfig) {
        const el = document.getElementById(containerId);
        if (!el) return;
        el.innerHTML = metricConfig.map(m => `
            <div class="bg-slate-50 rounded-xl p-3 border border-slate-100">
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wide mb-1 leading-tight">${m.label}</p>
                <p class="text-xl font-extrabold text-slate-800">${formatQmPct(block[m.key])}</p>
                <p class="text-[9px] text-slate-400">${m.suffix}</p>
            </div>
        `).join('');

    // Lista rankeada (Causa Raiz / Processo de Origem): mostra Top 5 recorrentes, com botão para
    // expandir o restante. Cada item é clicável e abre o drill-down com os incidentes por trás dele.
    function renderQmRankedList(containerId, items, universoKey, kind) {
        const el = document.getElementById(containerId);
        if (!el) return;

        if (!items.length) {
            el.innerHTML = `<p class="text-xs text-slate-300 italic py-2">Nenhum registro classificado ainda.</p>`;
            return;
        }

        const maxCount = items[0].count;
        const universoLabel = QM_UNIVERSO_LABEL[universoKey];

        const buildRow = (item) => {
            const key = 'qm' + (qmRegistryCounter++);
            QM_ITEM_REGISTRY[key] = { item: item, universoLabel: universoLabel, kind: kind };
            const widthPct = maxCount > 0 ? Math.round((item.count / maxCount) * 100) : 0;
            return `
                <button type="button" data-qm-key="${key}" class="qm-drill-btn w-full text-left group">
                    <div class="flex items-center justify-between text-xs mb-0.5 gap-2">
                        <span class="font-semibold text-slate-700 group-hover:text-natura-orange transition-colors truncate">${item.label}</span>
                        <span class="font-bold text-slate-500 flex-none">${item.count}</span>
                    </div>
                    <div class="h-1.5 bg-slate-100 rounded-full overflow-hidden">
                        <div class="h-full bg-natura-orange/70 group-hover:bg-natura-orange transition-colors" style="width:${widthPct}%"></div>
                    </div>
                </button>
            `;
        };

        const top = items.slice(0, 5);
        const rest = items.slice(5);

        let html = `<div class="space-y-2">${top.map(buildRow).join('')}</div>`;

        if (rest.length > 0) {
            const restId = `${containerId}-rest`;
            html += `<div id="${restId}" class="hidden space-y-2 mt-2">${rest.map(buildRow).join('')}</div>`;
            html += `<button type="button" class="text-[10px] font-bold text-natura-orange hover:underline mt-2" onclick="toggleQmExpand('${restId}')">Ver mais ${rest.length}</button>`;
        }

        el.innerHTML = html;
    }

    function toggleQmExpand(id) {
        const el = document.getElementById(id);
        if (!el) return;
        const isHidden = el.classList.contains('hidden');
        el.classList.toggle('hidden', !isHidden);
        const btn = el.nextElementSibling;
        if (btn) btn.textContent = isHidden ? 'Ver menos' : `Ver mais ${el.children.length}`;
    }

    // Drill-down: ao clicar numa Causa Raiz ou Processo de Origem recorrente, mostra o período e os
    // detalhes de todos os incidentes que compartilham aquele valor.
    function openQualidadeDrillModal(label, ids, universoLabel, kind) {
        const modal = document.getElementById('qualidade-drill-modal');
        const titleEl = document.getElementById('qualidade-drill-title');
        const subtitleEl = document.getElementById('qualidade-drill-subtitle');
        const loadingEl = document.getElementById('qualidade-drill-loading');
        const listEl = document.getElementById('qualidade-drill-list');
        if (!modal || !ids || !ids.length) return;

        const kindLabel = kind === 'causaRaiz' ? 'Causa Raiz' : 'Processo de Origem';
        titleEl.textContent = label;
        subtitleEl.textContent = `${kindLabel} · Universo ${universoLabel} · ${ids.length} incidente(s)`;

        loadingEl.classList.remove('hidden');
        listEl.classList.add('hidden');
        listEl.classList.remove('flex');
        listEl.innerHTML = '';

        modal.classList.remove('hidden');
        setTimeout(() => modal.classList.remove('opacity-0'), 10);

        google.script.run
            .withSuccessHandler(incidents => {
                loadingEl.classList.add('hidden');
                listEl.classList.remove('hidden');
                listEl.classList.add('flex', 'flex-col', 'gap-4');

                if (!incidents || incidents.error) {
                    listEl.innerHTML = `<div class="text-sm text-red-600 p-4 text-center">Erro ao buscar os incidentes.</div>`;
                    return;
                }
                if (!incidents.length) {
                    listEl.innerHTML = `<div class="text-sm text-slate-500 italic p-4 text-center">Nenhum incidente encontrado para este filtro.</div>`;
                    return;
                }

                incidents.sort((a, b) => b.dataAberturaTimestamp - a.dataAberturaTimestamp);
                const newest = incidents[0];
                const oldest = incidents[incidents.length - 1];
                const periodText = (oldest && newest)
                    ? `Período: ${oldest.dataDefinicao.split(' ')[0]} a ${newest.dataDefinicao.split(' ')[0]}`
                    : '';
                subtitleEl.textContent = `${kindLabel} · Universo ${universoLabel} · ${incidents.length} incidente(s) · ${periodText}`;

                listEl.innerHTML = incidents.map(inc => buildIncidentCardHtml(inc)).join('');
            })
            .withFailureHandler(e => {
                loadingEl.classList.add('hidden');
                listEl.classList.remove('hidden');
                listEl.innerHTML = `<div class="text-sm text-red-600 p-4 text-center">Falha na comunicação: ${e.message}</div>`;
            })
            .getIncidentsByIds(ids);
    }

        if (modal) {
            modal.classList.add('opacity-0');

        }
    }

    function formatMinutesToHHMM(val) {
        if (val < 0) val = 0; const h = Math.floor(val / 60); const m = Math.round(val % 60); return `${String(h).padStart(2, '0')}h ${String(m).padStart(2, '0')}m`;
    }

    function formatDecimalHoursToHHMM(val) {
        return formatMinutesToHHMM(Math.round(val * 60));
    }

    function renderKpiCards(kpis) {
        const setText = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
        setText('val-total-incidents', kpis.incidentesTotal);
        setText('val-mttr-total', kpis.mttrTotal);
        setText('val-sev0-incidents', kpis.incidentesSev0);
        setText('val-mttr-sev0', kpis.mttrSev0);
        setText('val-sev1-incidents', kpis.incidentesSev1);
        setText('val-mttr-sev1', kpis.mttrSev1);

        // Percentages calculation
        const total = kpis.incidentesTotal || 0;
        const setPct = (id, val) => {
            const el = document.getElementById(id);
            if (el) {
                const pct = total > 0 ? ((val / total) * 100).toFixed(1) : "0.0";
                el.textContent = `(${pct}%)`;
            }
        };
        setPct('val-sev0-pct', kpis.incidentesSev0);
        setPct('val-sev1-pct', kpis.incidentesSev1);

        // Aderência OLA (Geral + por Severidade)

        setText('val-aderencia-ola-sev0', (kpis.aderenciaOLASev0 != null ? kpis.aderenciaOLASev0 : 0) + '%');
        setText('val-aderencia-ola-sev1', (kpis.aderenciaOLASev1 != null ? kpis.aderenciaOLASev1 : 0) + '%');

        // Visão Executiva: Mudança
        setText('val-incidentes-mudanca', kpis.incidentesMudanca || 0);

        setText('val-mudanca-tradicional', kpis.incidentesMudancaTradicional || 0);

        const formatHoras = (h) => {
            if (h === null || h === undefined) return 'N/A';
            const hh = Math.floor(h);
            const mm = Math.round((h - hh) * 60);
            return `${hh}h${String(mm).padStart(2, '0')}m`;

        setText('val-mttd-termino', formatHoras(kpis.mttdTerminoMedioHoras));
        setText('val-mttd-inicio-deploy', formatHoras(kpis.mttdInicioMedioHorasDeploy));

        setText('val-mttd-termino-deploy', formatHoras(kpis.mttdTerminoMedioHorasDeploy));
        setText('val-mttd-termino-tradicional', formatHoras(kpis.mttdTerminoMedioHorasTradicional));

        // Governança: Aderência Sev x Prioridade
        setText('val-aderencia-sevprio', kpis.aderenciaSevPrio != null ? `${kpis.aderenciaSevPrio}%` : '—');
        setText('val-aderencia-sevprio-sev0', kpis.aderenciaSevPrioSev0 != null ? `${kpis.aderenciaSevPrioSev0}%` : '—');
        setText('val-aderencia-sevprio-sev1', kpis.aderenciaSevPrioSev1 != null ? `${kpis.aderenciaSevPrioSev1}%` : '—');

    // Diagrama de Sankey: Top Grupos/Serviços Responsáveis por Incidentes de Mudança
    function renderSankeyMudanca(sankeyData) {
        const s = sankeyData || { deploy: [], tradicional: [] };
        renderSimpleSankey('sankeyTradicionalChart', s.tradicional, 'Nenhum Incidente de Mudança Tradicional no período filtrado.');
        renderSimpleSankey('sankeyDeployChart', s.deploy, 'Nenhum Incidente de Deploy no período filtrado.');
    }

    function sankeyHashCode(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) { hash = ((hash << 5) - hash) + str.charCodeAt(i); hash |= 0; }
        return hash;
    }

    function escapeXml(str) {
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Diagrama de Sankey leve, desenhado em SVG puro (sem depender de nenhuma biblioteca externa de gráficos,
    // já que CDNs de terceiros podem estar bloqueados na rede do usuário — mesmo problema das bandeiras).
    // Detecta os estágios automaticamente pelo caminho mais longo a partir de nós sem entrada (topológico),
    // o que funciona tanto para o fluxo de 2 estágios (Deploy: Service Offering -> Tecnologia) quanto para o
    // de 3 estágios (Tradicional: Grupo -> CHG Service -> Tecnologia), sem precisar tratar cada caso à parte.
    function renderSimpleSankey(containerId, links, emptyMsg) {
        const container = document.getElementById(containerId);
        if (!container) return;

        if (!links || !links.length) {
            container.innerHTML = `<p class="text-xs text-slate-300 italic text-center pt-16">${emptyMsg}</p>`;
            return;
        }

        const nodeNames = [];
        const nodeSeen = {};
        const addNode = (n) => { if (!nodeSeen[n]) { nodeSeen[n] = true; nodeNames.push(n); } };
        links.forEach(l => { addNode(l.from); addNode(l.to); });

        const incoming = {}, outgoing = {};
        nodeNames.forEach(n => { incoming[n] = []; outgoing[n] = []; });
        links.forEach(l => { outgoing[l.from].push(l); incoming[l.to].push(l); });

        const stageCache = {};
        const computeStage = (n, guard) => {
            if (stageCache[n] !== undefined) return stageCache[n];
            guard = guard || {};
            if (guard[n]) { stageCache[n] = 0; return 0; } // proteção contra ciclo (não deve ocorrer nestes dados)
            guard[n] = true;
            if (!incoming[n].length) { stageCache[n] = 0; return 0; }
            let maxParent = 0;
            incoming[n].forEach(l => { maxParent = Math.max(maxParent, computeStage(l.from, guard)); });
            stageCache[n] = maxParent + 1;
            return stageCache[n];
        };
        nodeNames.forEach(n => computeStage(n));

        const maxStage = Math.max.apply(null, nodeNames.map(n => stageCache[n]));
        const stages = [];
        for (let i = 0; i <= maxStage; i++) stages.push([]);
        nodeNames.forEach(n => stages[stageCache[n]].push(n));

        const nodeValue = {};
        nodeNames.forEach(n => {
            const totalIn = incoming[n].reduce((sum, l) => sum + l.flow, 0);
            const totalOut = outgoing[n].reduce((sum, l) => sum + l.flow, 0);
            nodeValue[n] = Math.max(totalIn, totalOut) || 1;
        });
        stages.forEach(stageNodes => stageNodes.sort((a, b) => nodeValue[b] - nodeValue[a]));

        const width = Math.max(container.clientWidth || 480, 320);
        const height = 250;
        const nodeWidth = 12;
        const vGap = 8;
        const stageGap = maxStage > 0 ? (width - nodeWidth) / maxStage : 0;

        const pos = {};
        stages.forEach((stageNodes, stageIdx) => {
            const totalValue = stageNodes.reduce((sum, n) => sum + nodeValue[n], 0) || 1;
            const gapsTotal = vGap * Math.max(stageNodes.length - 1, 0);
            const availH = Math.max(height - gapsTotal, 10);
            let y = 0;
            stageNodes.forEach(n => {
                const h = Math.max((nodeValue[n] / totalValue) * availH, 6);
                pos[n] = { x: stageIdx * stageGap, y: y, h: h };
                y += h + vGap;
            });
        });

        const palette = ['#1B472A', '#FF6600', '#045473', '#930E44', '#E29627', '#6A803E', '#e94839'];
        const colorOf = (n) => palette[Math.abs(sankeyHashCode(n)) % palette.length];

        const outCursor = {}, inCursor = {};
        nodeNames.forEach(n => { outCursor[n] = 0; inCursor[n] = 0; });

        let linksSvg = '';
        links.forEach(l => {
            const src = pos[l.from], tgt = pos[l.to];
            if (!src || !tgt) return;
            const srcTotal = outgoing[l.from].reduce((sum, x) => sum + x.flow, 0) || 1;
            const tgtTotal = incoming[l.to].reduce((sum, x) => sum + x.flow, 0) || 1;
            const thickSrc = (l.flow / srcTotal) * src.h;
            const thickTgt = (l.flow / tgtTotal) * tgt.h;
            const thick = Math.max(Math.min(thickSrc, thickTgt), 1.5);

            const y1 = src.y + outCursor[l.from] + thickSrc / 2;
            const y2 = tgt.y + inCursor[l.to] + thickTgt / 2;
            outCursor[l.from] += thickSrc;
            inCursor[l.to] += thickTgt;

            const x1 = src.x + nodeWidth;
            const x2 = tgt.x;
            const xMid = (x1 + x2) / 2;

            linksSvg += `<path d="M${x1},${y1} C${xMid},${y1} ${xMid},${y2} ${x2},${y2}" fill="none" stroke="${colorOf(l.from)}" stroke-opacity="0.35" stroke-width="${thick.toFixed(1)}"><title>${escapeXml(l.from)} → ${escapeXml(l.to)}: ${l.flow} incidente(s)</title></path>`;
        });

        let nodesSvg = '';
        nodeNames.forEach(n => {
            const p = pos[n];
            const isLast = stageCache[n] === maxStage;
            const textX = isLast ? p.x - 4 : p.x + nodeWidth + 4;
            const anchor = isLast ? 'end' : 'start';
            const label = n.length > 20 ? n.substring(0, 18) + '…' : n;
            nodesSvg += `<rect x="${p.x}" y="${p.y}" width="${nodeWidth}" height="${p.h.toFixed(1)}" fill="${colorOf(n)}" rx="2"><title>${escapeXml(n)}: ${nodeValue[n]} incidente(s)</title></rect>`;
            nodesSvg += `<text x="${textX}" y="${p.y + p.h / 2}" dy="0.32em" font-size="9" fill="#374151" text-anchor="${anchor}">${escapeXml(label)}<title>${escapeXml(n)}</title></text>`;
        });

        container.innerHTML = `<svg viewBox="0 0 ${width} ${height}" class="w-full h-full" preserveAspectRatio="xMidYMid meet">${linksSvg}${nodesSvg}</svg>`;
    }

    // Botões "Ver ranking detalhado" que expandem/colapsam as listas por trás dos Sankeys

    // Dispersão MTTD x MTTR para Incidentes causados por Mudança
    function drawMttdScatterChart(canvasId, chartKey, points, xAxisLabel) {
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        const data = points || [];

        if (charts[chartKey]) charts[chartKey].destroy();

        const deployPoints = data.filter(p => p.tipo === 'deploy').map(p => ({ x: p.mttdHoras, y: p.mttrHoras, id: p.id }));
        const tradicionalPoints = data.filter(p => p.tipo === 'tradicional').map(p => ({ x: p.mttdHoras, y: p.mttrHoras, id: p.id }));

        charts[chartKey] = new Chart(canvas.getContext('2d'), {
            type: 'scatter',
            data: {
                datasets: [
                    { label: 'Deploy', data: deployPoints, backgroundColor: 'rgba(4, 84, 115, 0.7)', pointRadius: 5 },
                    { label: 'Tradicional', data: tradicionalPoints, backgroundColor: 'rgba(255, 102, 0, 0.7)', pointRadius: 5 }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'top' },
                    datalabels: { display: false },
                    tooltip: {
                        callbacks: {
                            label: (ctx) => `${ctx.dataset.label} ${ctx.raw.id}: MTTD ${ctx.raw.x}h · MTTR ${ctx.raw.y}h`
                        }
                    }
                },
                scales: {
                    x: { title: { display: true, text: xAxisLabel } },
                    y: { title: { display: true, text: 'MTTR (horas)' } }
                }
            }
        });
    }

    function renderMttdVsMttrChart(points) {
        drawMttdScatterChart('mttdVsMttrChart', 'mttdVsMttr', points, 'MTTD Início (horas)');
    }

    function renderMttdTerminoVsMttrChart(points) {
        drawMttdScatterChart('mttdTerminoVsMttrChart', 'mttdTerminoVsMttr', points, 'MTTD Término (horas)');
    }

    // Badges de Origem da Detecção, reutilizado nos cards estendidos de Jornada/País
    // Badge "semáforo" de cumprimento de Meta (item 1): usa ícone + cor verde/âmbar, nunca
    // vermelho/laranja, para não se confundir visualmente com as cores de Severidade (Sev0/Sev1).
    function buildMetaBadge(isOk, okLabel, nokLabel) {
        okLabel = okLabel || 'Dentro da Meta';
        nokLabel = nokLabel || 'Fora da Meta';
        if (isOk) {
            return `<span class="inline-flex items-center gap-1 text-[9px] font-bold text-natura-green-cerrado bg-natura-green-cerrado/10 rounded-full px-1.5 py-0.5 whitespace-nowrap">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-2.5 w-2.5 flex-none" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 111.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
                ${okLabel}
            </span>`;
        }
        return `<span class="inline-flex items-center gap-1 text-[9px] font-bold text-[#8a5a00] bg-natura-yellow-balsamo/25 rounded-full px-1.5 py-0.5 whitespace-nowrap">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-2.5 w-2.5 flex-none" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l6.518 11.598c.75 1.334-.213 2.987-1.742 2.987H3.48c-1.53 0-2.493-1.653-1.743-2.987L8.257 3.1zM11 14a1 1 0 11-2 0 1 1 0 012 0zm-1-2a1 1 0 01-1-1V8a1 1 0 112 0v3a1 1 0 01-1 1z" clip-rule="evenodd"/></svg>
            ${nokLabel}
        </span>`;
    }

    const ORIGEM_COLORS = { 'End-users': '#045473', 'Monitoração': '#1B472A', 'Experiências': '#FF6600' };

    function buildOrigemBadgesHtml(origemBreakdown, base) {
        const breakdown = origemBreakdown || {};
        const keys = Object.keys(breakdown).sort((a, b) => breakdown[b] - breakdown[a]);
        if (!keys.length) return `<span class="text-[9px] text-slate-300 italic">Sem dados</span>`;
        return keys.map(k => {
            const count = breakdown[k];
            const pct = base > 0 ? Math.round((count / base) * 1000) / 10 : 0;
            return `
            <span class="text-[9px] font-semibold text-slate-500 bg-slate-50 border border-slate-200 rounded-full px-2 py-0.5">
                <span class="inline-block w-1.5 h-1.5 rounded-full mr-1" style="background:${ORIGEM_COLORS[k] || '#94a3b8'}"></span>${escapeXml(k)}: <span class="font-extrabold text-slate-700">${count}</span> <span class="text-slate-400">(${pct}%)</span>
            </span>
        `;
        }).join('');
    }

    // Mini gráfico de rosca (Chart.js) com a distribuição de Origem da Detecção, usado nos cards
    // estendidos de Jornada/País. Instâncias são mantidas num registro próprio para destruir/recriar
    // corretamente a cada re-render (filtros).
    const miniDonutCharts = {};
    function renderMiniDonut(canvasId, origemBreakdown) {
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        if (miniDonutCharts[canvasId]) miniDonutCharts[canvasId].destroy();

        const breakdown = origemBreakdown || {};
        const keys = Object.keys(breakdown).sort((a, b) => breakdown[b] - breakdown[a]);
        if (!keys.length) return;

        miniDonutCharts[canvasId] = new Chart(canvas.getContext('2d'), {
            type: 'doughnut',
            data: {
                labels: keys,
                datasets: [{
                    data: keys.map(k => breakdown[k]),
                    backgroundColor: keys.map(k => ORIGEM_COLORS[k] || '#94a3b8'),
                    borderWidth: 2,
                    borderColor: '#ffffff'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '62%',
                plugins: {
                    legend: { display: false },
                    datalabels: { display: false },
                    tooltip: {
                        callbacks: {
                            label: (ctx) => `${ctx.label}: ${ctx.raw} (${((ctx.raw / ctx.dataset.data.reduce((a, b) => a + b, 0)) * 100).toFixed(1)}%)`
                        }
                    }
                }
            }
        });
    }

    // Bloco Sev0/Sev1 + OLA Geral + Origem da Detecção (com mini-rosca), reutilizado nos cards
    // estendidos de Jornada e País.
    function buildSevBreakdownHtml(item, donutCanvasId) {
        const sev0Count = item.sev0Count || 0;
        const sev1Count = item.sev1Count || 0;
        const sev0MTTR = sev0Count > 0 ? item.sev0DurationMin / sev0Count : 0;
        const sev1MTTR = sev1Count > 0 ? item.sev1DurationMin / sev1Count : 0;
        const sev0OLA = sev0Count > 0 ? Math.round((item.sev0DentroOLA / sev0Count) * 1000) / 10 : 0;
        const sev1OLA = sev1Count > 0 ? Math.round((item.sev1DentroOLA / sev1Count) * 1000) / 10 : 0;
        const sev0Pct = item.count > 0 ? Math.round((sev0Count / item.count) * 1000) / 10 : 0;
        const sev1Pct = item.count > 0 ? Math.round((sev1Count / item.count) * 1000) / 10 : 0;

        const olaGeralTotal = sev0Count + sev1Count;
        const olaGeralDentro = (item.sev0DentroOLA || 0) + (item.sev1DentroOLA || 0);
        const olaGeralPct = olaGeralTotal > 0 ? Math.round((olaGeralDentro / olaGeralTotal) * 1000) / 10 : 0;
        // Meta Geral: usa a média ponderada das metas de Sev0 (70%) e Sev1 (80%) pela proporção de cada severidade
        const olaGeralMeta = olaGeralTotal > 0 ? ((sev0Count * 70 + sev1Count * 80) / olaGeralTotal) : 75;
        const olaGeralOk = olaGeralPct >= olaGeralMeta;

        const origemBase = Object.values(item.origemBreakdown || {}).reduce((a, b) => a + b, 0);

        return `
            <div class="flex items-center justify-between pt-3 mt-3 border-t border-slate-100">
                <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">OLA Geral (Sev0+Sev1)</span>
                <span class="flex items-center gap-1.5">
                    <span class="text-xs font-extrabold text-slate-700">${olaGeralTotal > 0 ? olaGeralPct + '%' : '—'}</span>
                    ${olaGeralTotal > 0 ? buildMetaBadge(olaGeralOk) : ''}
                </span>
            </div>
            <div class="grid grid-cols-2 gap-2 mt-2">
                <div class="bg-natura-red-buriti/5 rounded-lg p-2">
                    <p class="text-[9px] font-black text-natura-red-buriti uppercase tracking-wider">Sev0</p>
                    <p class="text-sm font-extrabold text-slate-800 leading-tight">${sev0Count} <span class="text-[9px] font-semibold text-slate-400">(${sev0Pct}%)</span></p>
                    <p class="text-[9px] text-slate-400">MTTR ${formatMinutesToHHMM(sev0MTTR)}</p>
                    <div class="mt-1">${sev0Count > 0 ? `<span class="text-[9px] font-bold text-slate-600 mr-1">${sev0OLA}% OLA</span>${buildMetaBadge(sev0OLA >= 70)}` : '<span class="text-[9px] text-slate-300">—</span>'}</div>
                </div>
                <div class="bg-natura-orange/5 rounded-lg p-2">
                    <p class="text-[9px] font-black text-natura-orange uppercase tracking-wider">Sev1</p>
                    <p class="text-sm font-extrabold text-slate-800 leading-tight">${sev1Count} <span class="text-[9px] font-semibold text-slate-400">(${sev1Pct}%)</span></p>
                    <p class="text-[9px] text-slate-400">MTTR ${formatMinutesToHHMM(sev1MTTR)}</p>
                    <div class="mt-1">${sev1Count > 0 ? `<span class="text-[9px] font-bold text-slate-600 mr-1">${sev1OLA}% OLA</span>${buildMetaBadge(sev1OLA >= 80)}` : '<span class="text-[9px] text-slate-300">—</span>'}</div>
                </div>
            </div>
            <div class="mt-2 pt-2 border-t border-slate-50">
                <p class="text-[9px] text-slate-400 uppercase font-bold mb-1.5">Origem da Detecção</p>
                <div class="flex items-center gap-3">
                    <div class="flex-none w-16 h-16 relative"><canvas id="${donutCanvasId}"></canvas></div>
                    <div class="flex flex-wrap gap-1 flex-1">${buildOrigemBadgesHtml(item.origemBreakdown, origemBase)}</div>
                </div>
            </div>
        `;
    }

    // Cards de Incidentes por Jornada Impactada, com ícones
    function renderJornadaCards(jornadaMetrics, totalIncidentes) {
        const gridEl = document.getElementById('jornada-cards-grid');
        if (!gridEl) return;
        const metrics = jornadaMetrics || {};
        const keys = Object.keys(metrics).sort((a, b) => metrics[b].count - metrics[a].count);

        if (!keys.length) {
            gridEl.innerHTML = `<p class="text-xs text-slate-300 italic py-2 col-span-full">Nenhuma Jornada registrada no período filtrado.</p>`;
            return;
        }

        gridEl.innerHTML = keys.map(key => {
            const keyMatch = Object.keys(JORNADA_MAP).find(k => k.toLowerCase() === key.toLowerCase());
            const mapped = keyMatch ? JORNADA_MAP[keyMatch] : { label: key, color: 'bg-slate-50 text-slate-700 border-slate-200', icon: '🔹' };
            const item = metrics[key];
            const pct = totalIncidentes > 0 ? Math.round((item.count / totalIncidentes) * 1000) / 10 : 0;
            const avgMin = item.count > 0 ? item.durationMin / item.count : 0;
            const donutId = `jornada-donut-${key.replace(/[^a-zA-Z0-9]/g, '_')}`;

            return `
                <div class="kpi-card rounded-2xl p-4 border ${mapped.color.replace('bg-', 'border-').split(' ')[0]} bg-white">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="text-xl">${mapped.icon}</span>
                        <p class="text-xs font-bold text-slate-700 leading-tight">${mapped.label}</p>
                    </div>
                    <p class="text-2xl font-extrabold text-natura-green-cerrado">${item.count}</p>
                    <p class="text-[10px] text-slate-400 mt-1">${pct}% dos Incidentes · MTTR médio ${formatMinutesToHHMM(avgMin)}</p>
                    ${buildSevBreakdownHtml(item, donutId)}
                </div>
            `;
        }).join('');

        keys.forEach(key => {
            const donutId = `jornada-donut-${key.replace(/[^a-zA-Z0-9]/g, '_')}`;
            renderMiniDonut(donutId, metrics[key].origemBreakdown);
        });
    }

    // Cards de Incidentes por País Impactado, com bandeiras
    function renderPaisCards(paisMetrics, totalIncidentes) {
        const gridEl = document.getElementById('pais-cards-grid');
        if (!gridEl) return;
        const metrics = paisMetrics || {};
        const keys = Object.keys(metrics).sort((a, b) => metrics[b].count - metrics[a].count);

        if (!keys.length) {
            gridEl.innerHTML = `<p class="text-xs text-slate-300 italic py-2 col-span-full">Nenhum país registrado no período filtrado.</p>`;
            return;

        gridEl.innerHTML = keys.map(code => {

            const pct = totalIncidentes > 0 ? Math.round((item.count / totalIncidentes) * 1000) / 10 : 0;

                <div class="kpi-card rounded-2xl p-4 border border-slate-200 bg-white flex-none w-72 snap-start">
                    <div class="flex items-center gap-2 mb-2">
                        ${buildFlagSvg(code, 28, 20)}

                    </div>
                    <p class="text-2xl font-extrabold text-natura-green-cerrado leading-none">${item.count}</p>
                    <p class="text-[10px] text-slate-400 mt-1">${pct}% dos Incidentes</p>
                    ${buildSevBreakdownHtml(item, donutId)}
                </div>
            `;
        }).join('');

        keys.forEach(code => {
            const donutId = `pais-donut-${code.replace(/[^a-zA-Z0-9]/g, '_')}`;

    function sortObjByCount(obj) {
        return Object.keys(obj).sort((a, b) => obj[b].count - obj[a].count);
    }

    const colorCache = {};
    const fixedColors = [
        '#1B472A', '#FF6600', '#6A803E', '#E29627', '#e94839',
        '#045473', '#C9E055', '#930E44', '#99aedb', '#FFBE28',
        '#112E22', '#ac2f1c', '#60002C', '#4a1c0e'
    ];

    function getColorForKey(key) {
        if (colorCache[key]) return colorCache[key];
        const existingKeys = Object.keys(colorCache);
        const colorIndex = existingKeys.length % fixedColors.length;
        const color = fixedColors[colorIndex];
        colorCache[key] = color;
        return color;
    }

    function renderTechCharts(techMetrics, totalIncidents) {
        const sortedVol = Object.keys(techMetrics).sort((a, b) => techMetrics[b].count - techMetrics[a].count).slice(0, 10);
        const labelsVol = sortedVol;
        const counts = sortedVol.map(k => techMetrics[k].count);
        const colorsVol = sortedVol.map(k => getColorForKey(k));
        const drilldownVol = sortedVol.map(k => ({ label: k, breakdown: techMetrics[k].breakdown }));

        createBarChart('chartIncidentsByTech', labelsVol, counts, totalIncidents, 'Incidente', drilldownVol, 'Tech -> Offender', false, colorsVol);

        let setOfKeys = [...sortedVol];
        setOfKeys.sort((a, b) => {
            const valA = techMetrics[a].count ? (techMetrics[a].durationMin / techMetrics[a].count) : 0;
            const valB = techMetrics[b].count ? (techMetrics[b].durationMin / techMetrics[b].count) : 0;
            return valB - valA;
        });

        const labelsDur = setOfKeys;
        const durations = setOfKeys.map(k => {
            const val = techMetrics[k].count ? (techMetrics[k].durationMin / techMetrics[k].count / 60) : 0;
            return val.toFixed(2);
        });
        const colorsDur = setOfKeys.map(k => getColorForKey(k));

        const drilldownDur = setOfKeys.map(k => ({ label: k, breakdown: techMetrics[k].breakdown }));

        createBarChart('chartDurationByTech', labelsDur, durations, null, 'MTTR (h)', drilldownDur, 'Tech -> Offender', true, colorsDur);
    }

    function renderOffenderCharts(offenderMetrics, totalIncidents) {
        const sortedVol = Object.keys(offenderMetrics).sort((a, b) => offenderMetrics[b].count - offenderMetrics[a].count).slice(0, 10);
        const labelsVol = sortedVol;
        const counts = sortedVol.map(k => offenderMetrics[k].count);
        const colorsVol = sortedVol.map(k => getColorForKey(k));
        const drilldownVol = sortedVol.map(k => ({ label: k, breakdown: offenderMetrics[k].breakdown }));

        createBarChart('chartIncidentsByOffender', labelsVol, counts, totalIncidents, 'Incidente', drilldownVol, 'Offender -> Tech', false, colorsVol);

        let setOfKeys = [...sortedVol];
        setOfKeys.sort((a, b) => {
            const valA = offenderMetrics[a].count ? (offenderMetrics[a].durationMin / offenderMetrics[a].count) : 0;
            const valB = offenderMetrics[b].count ? (offenderMetrics[b].durationMin / offenderMetrics[b].count) : 0;
            return valB - valA;
        });

        const labelsDur = setOfKeys;
        const durations = setOfKeys.map(k => {
            const val = offenderMetrics[k].count ? (offenderMetrics[k].durationMin / offenderMetrics[k].count / 60) : 0;
            return val.toFixed(2);

        const colorsDur = setOfKeys.map(k => getColorForKey(k));

    function createBarChart(canvasId, labels, dataArr, totalForPct, labelSuffix, drilldownData, type, isTime = false, customColors = null) {
        const ctx = document.getElementById(canvasId).getContext('2d');
        if (charts[canvasId]) charts[canvasId].destroy();

            type: 'bar',
            data: {
                labels: labels,

                    label: isTime ? 'Horas' : 'Incidentes',

                    borderRadius: 4,
                    barPercentage: 0.6,
                }]
            },

                indexAxis: 'y', // Vertical list is easier to read

    // Painel lateral: Volumetria Total + MTTR Médio (default) ou totais por categoria (demais dimensões)

            container.innerHTML = `
                <div class="kpi-card rounded-xl p-3 border border-slate-200 bg-slate-50/50 flex-1 lg:flex-none">
                    <p class="text-[9px] text-slate-400 uppercase tracking-wider font-bold">Volumetria Total</p>

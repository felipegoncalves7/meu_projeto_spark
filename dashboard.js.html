<script>
    let ALL_DATA = {};
    let CURRENT_FILTERS = {
        card: 'total',
        periodKey: 'All', // Tab 1
        startDate: null,
        endDate: null,
        year: null,
        evolutionGrouping: 'monthly',
        comparisonMode: 'none' // 'none' | 'previous'
    };
    let COMPARISON_LABEL = '';

    // Globals for Chart Instances
    let charts = {};

    function logDebug(msg) {
        const container = document.getElementById('debug-log-container');
        if (container) {
            const p = document.createElement('p');
            p.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            container.appendChild(p);
            container.scrollTop = container.scrollHeight;
        }
        console.log(`[DEBUG] ${msg}`);
    }

    console.log("Dashboard Script Execution Started");

    document.addEventListener('DOMContentLoaded', function () {
        logDebug("DOM Loaded. Initializing...");

        if (typeof Chart === 'undefined') {
            logDebug("CRITICAL: Chart.js library NOT loaded.");
            return;
        }

        Chart.defaults.font.family = "'Inter', sans-serif";
        Chart.defaults.color = '#64748b';
        Chart.defaults.borderColor = '#e2e8f0';

        if (typeof ChartDataLabels !== 'undefined') Chart.register(ChartDataLabels);

        setupTabs();
        setupFiltersToggle();
        loadInitialConfig();
        const yearSelect = document.getElementById('year-select');
        yearSelect.addEventListener('change', function (e) {
            logDebug("Year changed to: " + e.target.value);
            CURRENT_FILTERS.year = e.target.value;
            recomputeSpecificFilterForNewYear();

            // Reload the currently active tab
            const activeTab = document.querySelector('.tab-btn.active-tab');
            if (activeTab) {
                const targetId = activeTab.dataset.target;
                if (targetId === 'tab-major') {
                    loadFilteredData();
                } else if (targetId === 'tab-problems') {
                    loadProblemsTab();
                }
            } else {
                loadFilteredData(); // Default
            }
        });

        // Ranking Search Handler
        const rankingSearch = document.getElementById('ranking-search');
        if (rankingSearch) {
            rankingSearch.addEventListener('input', (e) => {
                RANKING_STATE.searchQuery = e.target.value.toLowerCase();
                renderRanking();
            });
        }
    });

    // Seção de Filtros: recolhida por padrão, abre/fecha de forma interativa ao clicar no cabeçalho
    function setupFiltersToggle() {
        const btn = document.getElementById('btn-toggle-filters');
        const body = document.getElementById('filters-body');
        const chevron = document.getElementById('filters-toggle-chevron');
        if (!btn || !body) return;

        btn.addEventListener('click', () => {
            const isHidden = body.classList.contains('hidden');
            body.classList.toggle('hidden', !isHidden);
            if (chevron) chevron.classList.toggle('rotate-180', isHidden);
        });
    }

    function setupTabs() {
        const tabs = document.querySelectorAll('.tab-btn');
        logDebug(`Found ${tabs.length} tab buttons.`);
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                if (tab.classList.contains('active-tab')) return;
                tabs.forEach(t => {
                    // Reset to default state
                    t.classList.remove('active-tab', 'border-natura-orange', 'text-natura-orange');
                    t.classList.add('border-transparent', 'text-slate-500');
                    // Remove hover needed? It's CSS.
                });
                // Set active state
                tab.classList.add('active-tab', 'border-natura-orange', 'text-natura-orange');
                tab.classList.remove('border-transparent', 'text-slate-500');

                const targetId = tab.dataset.target;

                // DATA LOADING TRIGGERS
                if (targetId === 'tab-major' && !ALL_DATA.kpis) {
                    // Usually already loaded by default, but good check
                    loadFilteredData();
                } else if (targetId === 'tab-problems') {
                    loadProblemsTab();
                }

                document.querySelectorAll('.tab-content').forEach(content => {
                    if (content.id === targetId) {
                        content.classList.remove('hidden');
                        setTimeout(() => {
                            content.classList.remove('opacity-0');
                            content.classList.add('opacity-100');
                        }, 10);
                    } else {
                        content.classList.remove('opacity-100');
                        content.classList.add('opacity-0');
                        setTimeout(() => content.classList.add('hidden'), 300);
                    }
                });
            });
        });
    }

    function loadInitialConfig() {
        logDebug("Calling getInitialConfig (Backend)...");
        const loader = document.getElementById('loader-container');
        if (loader) loader.classList.remove('hidden');
        google.script.run
            .withSuccessHandler(setupDashboard)
            .withFailureHandler((e) => {
                logDebug("getInitialConfig FAILED: " + e.message);
                handleError(e);
            })
            .getInitialConfig();
    }

    function setupDashboard(data) {
        logDebug("getInitialConfig Success. Data received.");
        if (data.error) {
            logDebug("Server reported error: " + data.error);
            handleError(data.error);
            return;
        }
        ALL_DATA = data;

        // Populate Year Selector
        const yearSelect = document.getElementById('year-select');
        if (yearSelect && data.availableYears && data.availableYears.length > 0) {
            yearSelect.innerHTML = '';
            data.availableYears.forEach(year => {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                yearSelect.appendChild(option);
            });
            CURRENT_FILTERS.year = data.availableYears[0];
        }

        setupPeriodFilters(data.periodFilters); // Tab 1

        // Setup Card Filters
        const setupCardFilter = (id, type) => {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('click', () => {
                    CURRENT_FILTERS.card = type;
                    logDebug(`Filter changed to: ${type}`);
                    refreshActiveFilterText(); // Update UI
                    loadFilteredData();
                });
                el.style.cursor = 'pointer';
            }
        };

        setupCardFilter('card-total', 'total');
        setupCardFilter('card-sev0', 'sev0');
        setupCardFilter('card-sev1', 'sev1');

        setupSpecificFilters();
        setupComparisonFilter();
        setupEvolutionToggle();
        loadQualidadeMudancaData();

        logDebug("Initial setup complete. Loading Tab 1 data...");

        // Force Tab 1 Visibility immediately
        const tab1Content = document.getElementById('tab-major');
        if (tab1Content) {
            tab1Content.classList.remove('hidden', 'opacity-0');
            tab1Content.classList.add('opacity-100');
        }

        loadFilteredData();
    }

    function loadFilteredData() {
        logDebug("Loading Tab 1 Data...");
        const loader = document.getElementById('loader-container');
        if (loader) loader.classList.remove('hidden');
        google.script.run
            .withSuccessHandler(renderTab1Data)
            .withFailureHandler((e) => {
                logDebug("getFilteredData (Tab 1) FAILED: " + e.message);
                handleError(e);
            })
            .getFilteredData(
                CURRENT_FILTERS.year,
                CURRENT_FILTERS.periodKey,
                CURRENT_FILTERS.startDate,
                CURRENT_FILTERS.endDate,
                CURRENT_FILTERS.card
            );
    }


    function loadProblemsTab() {
        logDebug("Loading Major Problems Data...");
        const loader = document.getElementById('loader-container');
        // Show loader if tab is visible
        if (loader && !document.getElementById('tab-problems').classList.contains('hidden')) {
            loader.classList.remove('hidden');
        }

        google.script.run
            .withSuccessHandler(renderProblemsData)
            .withFailureHandler((e) => {
                logDebug("getMajorProblemsData FAILED: " + e.message);
                handleError(e);
            })
            .getMajorProblemsData(CURRENT_FILTERS.year);
    }

    function renderProblemsData(data) {
        logDebug("Problems Data Received.");
        console.log("Full data object:", data);
        if (data.error) {
            logDebug("Problems Data Error: " + data.error);
            handleError(data.error);
            return;
        }

        // 1. KPIs
        const setText = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
        const setPct = (id, val, total) => {
            const el = document.getElementById(id);
            if (el) {
                const pct = total > 0 ? ((val / total) * 100).toFixed(1) : "0.0";
                el.textContent = `(${pct}%)`;
            }
        };

        setText('mp-total-incidencts', data.kpis.totalIncidentes);
        setText('mp-total-problems', data.kpis.totalProblemas);

        setText('mp-open-problems', data.kpis.problemasAbertos);
        setPct('mp-open-problems-pct', data.kpis.problemasAbertos, data.kpis.totalProblemas);

        setText('mp-resolved-problems', data.kpis.problemasResolvidos);
        setPct('mp-resolved-problems-pct', data.kpis.problemasResolvidos, data.kpis.totalProblemas);

        setText('mp-impl-problems', data.kpis.problemasImpl);
        setPct('mp-impl-problems-pct', data.kpis.problemasImpl, data.kpis.totalProblemas);

        setText('mp-rca-pending', data.kpis.rcaPendentes);
        setPct('mp-rca-pending-pct', data.kpis.rcaPendentes, data.kpis.totalProblemas);

        // New KPIs
        setText('mp-avg-aging-resolved', data.kpis.avgAgingResolved + " Dias");
        setText('mp-avg-mttrc', data.kpis.avgMTTRC + " Horas");
        setText('mp-avg-aging-backlog', data.kpis.avgAgingBacklog + " Dias");

        // 2. Charts
        drawProblemsChart(data.monthly);
        drawMonthlyYTDChart(data.monthlyYTD);
        drawWeeklyWTDChart(data.weeklyWTD);

        // 3. Rankings
        const renderRank = (id, list) => {
            const container = document.getElementById(id);
            if (!container) return;
            if (!list || list.length === 0) {
                container.innerHTML = `<div class="text-[11px] text-slate-400 italic py-2 px-2">Nenhum dado encontrado.</div>`;
                return;
            }
            container.innerHTML = list.map(item => {
                return `<div class="flex justify-between items-center text-[11px] py-1.5 border-b border-slate-50 last:border-0 hover:bg-slate-50 px-2 rounded transition-colors">
                    <span class="font-medium text-slate-700 truncate pr-2 uppercase" title="${item.name}">${item.name}</span>
                    <span class="flex-none text-slate-500 whitespace-nowrap">
                        <span class="font-bold text-natura-orange">${item.count}</span> RCAs | 
                        <span class="font-bold text-natura-blue-profundo">${item.avgAging} Dias</span>
                    </span>
                </div>`;
            }).join('');
        };

        renderRank('mp-top-backlog-list', data.topBacklogTeams);
        renderRank('mp-top-resolved-list', data.topResolvedTeams);

        const loader = document.getElementById('loader-container');
        if (loader) loader.classList.add('hidden');
    }

    function drawMonthlyYTDChart(ytdData) {
        const ctx = document.getElementById('majorProblemsMonthlyYTD').getContext('2d');
        const months = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
        const active = months.filter(m => ytdData[m] !== undefined);
        const labels = active.map(m => m.charAt(0).toUpperCase() + m.slice(1));
        const resolved = active.map(m => ytdData[m].resolved);
        const aging = active.map(m => ytdData[m].avgAging);

        // Eixos dinâmicos
        const maxResolved = Math.max(...resolved, 0);
        const maxAging = Math.max(...aging, 0);
        const axisMaxResolved = Math.ceil((maxResolved + 0.1) / 10) * 10;
        const axisMaxAging = Math.ceil((maxAging + 0.1) / 10) * 10;

        if (window.ytdChartInstance) window.ytdChartInstance.destroy();
        window.ytdChartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    { label: 'Resolvidos', data: resolved, backgroundColor: '#045473', order: 1 },
                    { label: 'Aging Médio', data: aging, type: 'line', borderColor: '#1B472A', backgroundColor: '#1B472A', borderWidth: 2, pointRadius: 4, order: 0, yAxisID: 'y-aging' }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        title: { display: true, text: 'Resolvidos' },
                        max: axisMaxResolved
                    },
                    'y-aging': {
                        position: 'right',
                        beginAtZero: true,
                        title: { display: true, text: 'Aging (Dias)' },
                        grid: { drawOnChartArea: false },
                        max: axisMaxAging
                    }
                },
                plugins: {
                    datalabels: {
                        color: '#FFFFFF',
                        backgroundColor: (context) => context.dataset.type === 'line' ? '#1B472A' : null,
                        borderRadius: 4,
                        padding: { top: 4, bottom: 4, left: 6, right: 6 },
                        font: { weight: 'bold', size: 10 },
                        display: (context) => context.dataset.data[context.dataIndex] > 0
                    }
                }
            }
        });
    }

    function drawWeeklyWTDChart(wtdData) {
        const ctx = document.getElementById('majorProblemsWeeklyWTD').getContext('2d');
        const labels = Object.keys(wtdData).sort((a, b) => {
            const nA = parseInt(a.replace(/\D/g, ''));
            const nB = parseInt(b.replace(/\D/g, ''));
            return nA - nB;
        });
        const resolved = labels.map(l => wtdData[l].resolved);
        const aging = labels.map(l => wtdData[l].avgAging);

        // Eixos dinâmicos
        const maxResolved = Math.max(...resolved, 0);
        const maxAging = Math.max(...aging, 0);
        const axisMaxResolved = Math.ceil((maxResolved + 0.1) / 10) * 10;
        const axisMaxAging = Math.ceil((maxAging + 0.1) / 10) * 10;

        if (window.wtdChartInstance) window.wtdChartInstance.destroy();
        window.wtdChartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    { label: 'Resolvidos', data: resolved, backgroundColor: '#045473', order: 1 },
                    { label: 'Aging Médio', data: aging, type: 'line', borderColor: '#112E22', backgroundColor: '#112E22', borderWidth: 2, pointRadius: 4, order: 0, yAxisID: 'y-aging' }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        title: { display: true, text: 'Resolvidos' },
                        max: axisMaxResolved
                    },
                    'y-aging': {
                        position: 'right',
                        beginAtZero: true,
                        title: { display: true, text: 'Aging (Dias)' },
                        grid: { drawOnChartArea: false },
                        max: axisMaxAging
                    }
                },
                plugins: {
                    datalabels: {
                        color: '#FFFFFF',
                        backgroundColor: (context) => context.dataset.type === 'line' ? '#112E22' : null,
                        borderRadius: 4,
                        padding: { top: 4, bottom: 4, left: 6, right: 6 },
                        font: { weight: 'bold', size: 10 },
                        display: (context) => context.dataset.data[context.dataIndex] > 0
                    }
                }
            }
        });
    }

    function drawProblemsChart(monthlyData) {
        const ctx = document.getElementById('majorProblemsChart').getContext('2d');
        const months = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];

        // Filter out empty months if desired, or show all up to current?
        // User asked "Grafico de tempo por mês", showing all is safer or active ones.
        // Let's show active ones or all.
        const active = months.filter(m => monthlyData[m] !== undefined);
        const labels = active.map(m => m.charAt(0).toUpperCase() + m.slice(1));

        const dataResolved = active.map(m => monthlyData[m].resolved);
        const dataImpl = active.map(m => monthlyData[m].implementation);
        const dataRca = active.map(m => monthlyData[m].rcaPending);
        const dataIncidents = active.map(m => monthlyData[m].incidentsCount || 0);

        // Eixo dinâmico (considerando stack de problemas + linha de incidentes)
        const totals = active.map(m => (monthlyData[m].resolved || 0) + (monthlyData[m].implementation || 0) + (monthlyData[m].rcaPending || 0));
        const maxVal = Math.max(...totals, ...dataIncidents, 0);
        const axisMax = Math.ceil((maxVal + 0.1) / 10) * 10;

        if (window.problemsChartInstance) window.problemsChartInstance.destroy();

        window.problemsChartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Incidentes',
                        data: dataIncidents,
                        type: 'line',
                        borderColor: '#112E22', // Green Amazonia
                        backgroundColor: '#112E22',
                        borderWidth: 2,
                        pointRadius: 4,
                        order: 0
                    },
                    {
                        label: 'Resolvidos',
                        data: dataResolved,
                        backgroundColor: '#1B472A', // Green Cerrado
                        stack: 'stack1',
                        order: 1
                    },
                    {
                        label: 'Em Implementação',
                        data: dataImpl,
                        backgroundColor: '#E29627', // Yellow Tucuma
                        stack: 'stack1',
                        order: 1
                    },
                    {
                        label: "RCA's Pendentes",
                        data: dataRca,
                        backgroundColor: '#045473', // Blue Profundo
                        stack: 'stack1',
                        order: 1
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { stacked: true },
                    y: {
                        beginAtZero: true,
                        title: { display: true, text: 'Quantidade (Incidentes e Problemas)' },
                        max: axisMax
                    }
                },
                plugins: {
                    tooltip: { mode: 'index', intersect: false },
                    datalabels: {
                        display: (context) => {
                            return context.dataset.data[context.dataIndex] > 0;
                        },
                        color: '#FFFFFF', // All labels white
                        backgroundColor: (context) => {
                            // If it's the line, use the dark green background for the bubble
                            return context.dataset.type === 'line' ? '#112E22' : null;
                        },
                        borderRadius: 4,
                        padding: { top: 2, bottom: 2, left: 4, right: 4 },
                        font: { weight: 'bold', size: 10 },
                        formatter: (val) => val
                    }
                }
            }
        });
    }

    function renderTab1Data(data) {
        logDebug("Tab 1 Data Received. Rendering...");
        if (data.error) {
            logDebug("Tab 1 Data Error: " + data.error);
            handleError(data.error);
            return;
        }
        renderKpiCards(data.kpis);

        // Save these for switching views WITHOUT server reload
        ALL_DATA.currentKpis = data.kpis;
        updateComparisonDisplay();
        ALL_DATA.rawIncidents = data.rawIncidents || [];
        ALL_DATA.evolutionData = {
            monthly: { metrics: data.monthlyMetrics, mttr: data.mttrPorMesEmHoras, title: "Evolução Mensal" },
            weekly: { metrics: data.weeklyMetrics, mttr: data.mttrSemanalEmHoras, title: "Evolução Semanal" },
            quarterly: { metrics: data.quarterlyMetrics, mttr: data.mttrTrimestralEmHoras, title: "Evolução Trimestral" }
        };

        const group = CURRENT_FILTERS.evolutionGrouping || 'monthly';
        const groupData = ALL_DATA.evolutionData[group];
        drawEvolutionChart(groupData.metrics, groupData.mttr, groupData.title);

        // Render Technology & Offender charts in the same flow
        if (data.techMetrics) {
            ALL_DATA.techMetrics = data.techMetrics;
            renderTechCharts(data.techMetrics, data.kpis.incidentesTotal);
        }
        if (data.offenderMetrics) {
            ALL_DATA.offenderMetrics = data.offenderMetrics;
            renderOffenderCharts(data.offenderMetrics, data.kpis.incidentesTotal);
        }

        const loader = document.getElementById('loader-container');
        if (loader) loader.classList.add('hidden');

        if (CURRENT_FILTERS.periodKey === 'T4Industria') {
            const dataStoryBtn = document.getElementById('btn-data-story');
            if (dataStoryBtn) dataStoryBtn.classList.add('hidden');

            const concessaoContainer = document.getElementById('concessao-container');
            if (concessaoContainer) concessaoContainer.classList.remove('hidden');

            renderConcessaoTimeline();
        } else {
            initDataStory();

            const concessaoContainer = document.getElementById('concessao-container');
            if (concessaoContainer) concessaoContainer.classList.add('hidden');
        }

        logDebug("Tab 1 Render Complete.");
    }

    // --- FILTER LOGIC with MAPPING ---

    // Mapeamento dos nomes de exibição
    const LABEL_MAP = {
        'All': 'Período Completo',
        'Freeze': 'Freeze Q4',
        'SoftFreeze': 'Soft Freeze Q4',
        'HardFreeze': 'Hard Freeze Q4',
        'T4Industria': 'T4 Industria'
    };

    function setupPeriodFilters(filters) {
        const defaultContainer = document.getElementById('period-filter-default');
        const dropdownContainer = document.getElementById('strategic-periods-dropdown');
        if (!defaultContainer || !dropdownContainer) return;
        defaultContainer.innerHTML = '';
        dropdownContainer.innerHTML = '';

        filters.forEach(filter => {
            const isDefault = filter.key === 'All';
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.dataset.key = filter.key;
            let displayLabel = LABEL_MAP[filter.key] || filter.key;

            if (filter.key === 'T4Industria') {
                btn.innerHTML = `${displayLabel} <img src="https://flagcdn.com/w20/br.png" class="inline-block ml-1 mb-0.5" width="16" height="11">`;
            } else {
                btn.textContent = displayLabel;
            }
            btn.className = isDefault
                ? getBtnClass(filter.key === CURRENT_FILTERS.periodKey)
                : getStrategicBtnClass(filter.key === CURRENT_FILTERS.periodKey);

            btn.onclick = () => {
                CURRENT_FILTERS.periodKey = filter.key;
                CURRENT_FILTERS.startDate = filter.start;
                CURRENT_FILTERS.endDate = filter.end;
                resetSpecificFilterSelects();

                updateAllPeriodButtonsUI(filter.key);
                refreshActiveFilterText(); // Use centralized logic
                closeStrategicDropdown();

                loadFilteredData();
            };

            if (isDefault) defaultContainer.appendChild(btn);
            else dropdownContainer.appendChild(btn);
        });

        setupStrategicDropdownToggle();
        // Init logic for active filters text
        refreshActiveFilterText();
    }

    // Estilo dos itens dentro do dropdown "Períodos Estratégicos"
    function getStrategicBtnClass(isActive) {
        return isActive
            ? 'text-left px-3 py-2 rounded-lg text-sm font-bold bg-natura-green-cerrado text-white shadow-sm transition-colors'
            : 'text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors';
    }

    // Atualiza visualmente TODOS os botões de período (padrão + dropdown estratégico) com base na chave ativa
    function updateAllPeriodButtonsUI(activeKey) {
        const defaultContainer = document.getElementById('period-filter-default');
        const dropdownContainer = document.getElementById('strategic-periods-dropdown');
        let strategicActive = false;

        if (defaultContainer) {
            defaultContainer.querySelectorAll('button').forEach(b => {
                b.className = getBtnClass(b.dataset.key === activeKey);
            });
        }
        if (dropdownContainer) {
            dropdownContainer.querySelectorAll('button').forEach(b => {
                const isActive = b.dataset.key === activeKey;
                if (isActive) strategicActive = true;
                b.className = getStrategicBtnClass(isActive);
            });
        }

        const trigger = document.getElementById('btn-strategic-periods');
        if (trigger) {
            trigger.classList.toggle('border-natura-orange', strategicActive);
            trigger.classList.toggle('text-natura-orange', strategicActive);
            trigger.classList.toggle('border-slate-200', !strategicActive);
            trigger.classList.toggle('text-slate-600', !strategicActive);
        }
    }

    // Abre/fecha o dropdown de Períodos Estratégicos e fecha ao clicar fora
    function setupStrategicDropdownToggle() {
        const trigger = document.getElementById('btn-strategic-periods');
        const dropdown = document.getElementById('strategic-periods-dropdown');
        if (!trigger || !dropdown || trigger.dataset.wired) return;
        trigger.dataset.wired = 'true';

        trigger.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdown.classList.toggle('hidden');
        });
        document.addEventListener('click', (e) => {
            if (!dropdown.classList.contains('hidden') && !dropdown.contains(e.target) && e.target !== trigger) {
                dropdown.classList.add('hidden');
            }
        });
    }

    function closeStrategicDropdown() {
        const dropdown = document.getElementById('strategic-periods-dropdown');
        if (dropdown) dropdown.classList.add('hidden');
    }

    // Recalcula o intervalo de datas do filtro de Mês/Trimestre ativo quando o Ano de Referência muda
    function recomputeSpecificFilterForNewYear() {
        const key = CURRENT_FILTERS.periodKey || '';
        const year = parseInt(CURRENT_FILTERS.year, 10);
        if (key.startsWith('Mes_')) {
            const monthIndex = parseInt(key.split('_')[1], 10);
            const start = new Date(year, monthIndex, 1, 0, 0, 0);
            const end = new Date(year, monthIndex + 1, 0, 23, 59, 59);
            LABEL_MAP[key] = `${MONTH_NAMES_PT[monthIndex]}/${year}`;
            CURRENT_FILTERS.startDate = start.getTime();
            CURRENT_FILTERS.endDate = end.getTime();
        } else if (key.startsWith('Trimestre_')) {
            const q = parseInt(key.split('_')[1], 10);
            const startMonth = (q - 1) * 3;
            const start = new Date(year, startMonth, 1, 0, 0, 0);
            const end = new Date(year, startMonth + 3, 0, 23, 59, 59);
            LABEL_MAP[key] = `Q${q}/${year}`;
            CURRENT_FILTERS.startDate = start.getTime();
            CURRENT_FILTERS.endDate = end.getTime();
        }
    }

    // Limpa os seletores de Mês/Trimestre (usado quando outro filtro de período é escolhido)
    function resetSpecificFilterSelects() {
        const monthSelect = document.getElementById('month-filter-select');
        const quarterSelect = document.getElementById('quarter-filter-select');
        if (monthSelect) monthSelect.value = '';
        if (quarterSelect) quarterSelect.value = '';
    }

    const MONTH_NAMES_PT = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
        'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

    // Filtros específicos de Mês e Trimestre: calculam o intervalo de datas exato e reaproveitam
    // o mesmo mecanismo de filtro por data já usado pelos botões de período (Freeze, T4 Indústria, etc.)
    function setupSpecificFilters() {
        const monthSelect = document.getElementById('month-filter-select');
        const quarterSelect = document.getElementById('quarter-filter-select');
        if (!monthSelect || !quarterSelect) return;

        const clearPeriodButtons = () => updateAllPeriodButtonsUI(null);

        monthSelect.addEventListener('change', () => {
            const val = monthSelect.value;
            if (val === '') return;
            quarterSelect.value = '';

            const year = parseInt(CURRENT_FILTERS.year, 10);
            const monthIndex = parseInt(val, 10);
            const start = new Date(year, monthIndex, 1, 0, 0, 0);
            const end = new Date(year, monthIndex + 1, 0, 23, 59, 59);
            const key = `Mes_${val}`;
            LABEL_MAP[key] = `${MONTH_NAMES_PT[monthIndex]}/${year}`;

            CURRENT_FILTERS.periodKey = key;
            CURRENT_FILTERS.startDate = start.getTime();
            CURRENT_FILTERS.endDate = end.getTime();

            clearPeriodButtons();
            refreshActiveFilterText();
            loadFilteredData();
        });

        quarterSelect.addEventListener('change', () => {
            const val = quarterSelect.value;
            if (val === '') return;
            monthSelect.value = '';

            const year = parseInt(CURRENT_FILTERS.year, 10);
            const q = parseInt(val, 10);
            const startMonth = (q - 1) * 3;
            const start = new Date(year, startMonth, 1, 0, 0, 0);
            const end = new Date(year, startMonth + 3, 0, 23, 59, 59);
            const key = `Trimestre_${val}`;
            LABEL_MAP[key] = `Q${val}/${year}`;

            CURRENT_FILTERS.periodKey = key;
            CURRENT_FILTERS.startDate = start.getTime();
            CURRENT_FILTERS.endDate = end.getTime();

            clearPeriodButtons();
            refreshActiveFilterText();
            loadFilteredData();
        });
    }

    // Filtro de Comparação: "Nenhuma" ou "Período anterior equivalente"
    function setupComparisonFilter() {
        const comparisonSelect = document.getElementById('comparison-select');
        if (!comparisonSelect || comparisonSelect.dataset.wired) return;
        comparisonSelect.dataset.wired = 'true';

        comparisonSelect.addEventListener('change', () => {
            CURRENT_FILTERS.comparisonMode = comparisonSelect.value;
            updateComparisonDisplay();
        });
    }

    // Aplica (ou esconde) o badge de variação de um card em relação ao período de comparação
    function applyDeltaBadge(elId, current, previous, opts) {
        const el = document.getElementById(elId);
        if (!el) return;
        opts = opts || {};

        if (previous === null || previous === undefined || CURRENT_FILTERS.comparisonMode !== 'previous') {
            el.classList.add('hidden');
            return;
        }

        const diff = current - previous;
        const arrow = diff === 0 ? '≈' : (diff > 0 ? '▲' : '▼');
        const isGood = opts.isPercentagePoints ? diff >= 0 : diff <= 0;

        let valueText;
        if (opts.isPercentagePoints) {
            // Aderência OLA já é percentual: variação expressa em pontos percentuais (pp)
            valueText = `${diff > 0 ? '+' : ''}${diff.toFixed(1)}pp`;
        } else {
            // Volume de incidentes: variação expressa em % (mais elegante para leitura executiva)
            const pctChange = previous !== 0 ? (diff / previous) * 100 : (current > 0 ? 100 : 0);
            valueText = `${pctChange > 0 ? '+' : ''}${pctChange.toFixed(1)}%`;
        }

        el.textContent = `${arrow} ${valueText} vs ${COMPARISON_LABEL || 'período anterior'}`;
        el.classList.remove('hidden', 'bg-natura-green-cerrado/10', 'text-natura-green-cerrado',
            'bg-natura-red-buriti/10', 'text-natura-red-buriti');
        el.classList.add(...(isGood
            ? ['bg-natura-green-cerrado/10', 'text-natura-green-cerrado']
            : ['bg-natura-red-buriti/10', 'text-natura-red-buriti']));
    }

    // Busca os KPIs do período anterior equivalente e atualiza os badges de comparação dos cards
    function updateComparisonDisplay() {
        const badgeIds = ['delta-badge-total', 'delta-badge-sev0', 'delta-badge-sev1',
            'delta-badge-ola', 'delta-badge-ola-sev0', 'delta-badge-ola-sev1'];

        if (CURRENT_FILTERS.comparisonMode !== 'previous' || !ALL_DATA.currentKpis) {
            badgeIds.forEach(id => { const el = document.getElementById(id); if (el) el.classList.add('hidden'); });
            return;
        }

        google.script.run
            .withSuccessHandler(data => {
                if (!data || data.error || !data.available) {
                    badgeIds.forEach(id => { const el = document.getElementById(id); if (el) el.classList.add('hidden'); });
                    return;
                }
                COMPARISON_LABEL = data.label || 'período anterior';
                const cur = ALL_DATA.currentKpis;
                const prev = data.kpis;

                applyDeltaBadge('delta-badge-total', cur.incidentesTotal, prev.incidentesTotal);
                applyDeltaBadge('delta-badge-sev0', cur.incidentesSev0, prev.incidentesSev0);
                applyDeltaBadge('delta-badge-sev1', cur.incidentesSev1, prev.incidentesSev1);
                applyDeltaBadge('delta-badge-ola', cur.aderenciaOLA, prev.aderenciaOLA, { isPercentagePoints: true });
                applyDeltaBadge('delta-badge-ola-sev0', cur.aderenciaOLASev0, prev.aderenciaOLASev0, { isPercentagePoints: true });
                applyDeltaBadge('delta-badge-ola-sev1', cur.aderenciaOLASev1, prev.aderenciaOLASev1, { isPercentagePoints: true });
            })
            .withFailureHandler(e => {
                logDebug("getComparisonData FAILED: " + e.message);
            })
            .getComparisonData(CURRENT_FILTERS.year, CURRENT_FILTERS.periodKey, CURRENT_FILTERS.startDate, CURRENT_FILTERS.endDate);
    }

    // Helper to refresh Active Filters text based on ALL current filters
    function refreshActiveFilterText() {
        const periodKey = CURRENT_FILTERS.periodKey;
        const cardKey = CURRENT_FILTERS.card;
        const container = document.getElementById('active-filters-text');

        if (!container) return;
        container.innerHTML = ''; // Clear current content
        container.className = "flex flex-wrap items-center gap-2"; // Ensure Flex container

        let hasFilter = false;

        // Helper to create filter tag
        const createTag = (label, onRemove) => {
            hasFilter = true;
            const tag = document.createElement('span');
            tag.className = 'inline-flex items-center px-2 py-1 rounded-md text-xs font-bold bg-natura-green-murumuru/10 text-natura-green-cerrado border border-natura-green-murumuru/20';

            const text = document.createElement('span');
            text.textContent = label;

            const btn = document.createElement('button');
            btn.className = 'ml-1 p-0.5 rounded-full hover:bg-natura-red-buriti hover:text-white transition-colors focus:outline-none';
            btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>`;
            btn.onclick = (e) => {
                e.stopPropagation();
                onRemove();
            };

            tag.appendChild(text);
            tag.appendChild(btn);
            container.appendChild(tag);
        };

        // 1. Period Part
        const periodLabel = LABEL_MAP[periodKey] || periodKey;
        if (periodLabel !== 'Período Completo') {
            createTag(periodLabel, () => {
                // Reset to All
                const allFilter = ALL_DATA.periodFilters.find(f => f.key === 'All');
                if (allFilter) {
                    CURRENT_FILTERS.periodKey = 'All';
                    CURRENT_FILTERS.startDate = null;
                    CURRENT_FILTERS.endDate = null;
                    resetSpecificFilterSelects();
                    updateAllPeriodButtonsUI('All');
                    refreshActiveFilterText();
                    loadFilteredData();
                }
            });
        }

        // 2. Card Part
        if (cardKey !== 'total') {
            let label = cardKey;
            if (cardKey === 'sev0') label = 'Sev 0';
            else if (cardKey === 'sev1') label = 'Sev 1';

            createTag(label, () => {
                CURRENT_FILTERS.card = 'total';
                refreshActiveFilterText();
                loadFilteredData();
            });
        }

        if (!hasFilter) {
            container.textContent = 'Nenhum';
            container.className = "text-sm font-semibold text-slate-700"; // Reset to text style
        }
    }

    // evitando embutir dados dinâmicos (com aspas, acentos, etc.) direto em atributos onclick.
    let QM_ITEM_REGISTRY = {};
    let qmRegistryCounter = 0;

    function renderQualidadeMudancaData(data) {
        if (!data || data.error) {
            logDebug("Qualidade Mudança Data Error: " + (data ? data.error : 'sem resposta'));
            return;
        }

        QM_ITEM_REGISTRY = {};
        qmRegistryCounter = 0;

        ['geral', 'deploy', 'tradicional'].forEach(universoKey => {
            const block = data[universoKey] || {};
            renderQmMetricsTiles(`qm-metrics-${universoKey}`, block, QM_METRIC_CONFIG[universoKey]);

            const nEl = document.getElementById(QM_N_ELEMENT_ID[universoKey]);
            if (nEl) nEl.textContent = block.total || 0;

            renderQmRankedList(`qm-causaraiz-${universoKey}`, block.causaRaiz || [], universoKey, 'causaRaiz');
            renderQmRankedList(`qm-processo-${universoKey}`, block.processoOrigem || [], universoKey, 'processoOrigem');
        });
    }

    function formatQmPct(v) {
        return (v === null || v === undefined) ? '—' : `${v}%`;
    }

    function renderQmMetricsTiles(containerId, block, metricConfig) {
        const el = document.getElementById(containerId);
        if (!el) return;
        el.innerHTML = metricConfig.map(m => `
            <div class="bg-slate-50 rounded-xl p-3 border border-slate-100">
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wide mb-1 leading-tight">${m.label}</p>
                <p class="text-xl font-extrabold text-slate-800">${formatQmPct(block[m.key])}</p>
                <p class="text-[9px] text-slate-400">${m.suffix}</p>
            </div>
        `).join('');
    }

    // Lista rankeada (Causa Raiz / Processo de Origem): mostra Top 5 recorrentes, com botão para
    // expandir o restante. Cada item é clicável e abre o drill-down com os incidentes por trás dele.
    function renderQmRankedList(containerId, items, universoKey, kind) {
        const el = document.getElementById(containerId);
        if (!el) return;

        if (!items.length) {
            el.innerHTML = `<p class="text-xs text-slate-300 italic py-2">Nenhum registro classificado ainda.</p>`;
            return;
        }

        const maxCount = items[0].count;
        const universoLabel = QM_UNIVERSO_LABEL[universoKey];

        const buildRow = (item) => {
            const key = 'qm' + (qmRegistryCounter++);
            QM_ITEM_REGISTRY[key] = { item: item, universoLabel: universoLabel, kind: kind };
            const widthPct = maxCount > 0 ? Math.round((item.count / maxCount) * 100) : 0;
            return `
                <button type="button" data-qm-key="${key}" class="qm-drill-btn w-full text-left group">
                    <div class="flex items-center justify-between text-xs mb-0.5 gap-2">
                        <span class="font-semibold text-slate-700 group-hover:text-natura-orange transition-colors truncate">${item.label}</span>
                        <span class="font-bold text-slate-500 flex-none">${item.count}</span>
                    </div>
                    <div class="h-1.5 bg-slate-100 rounded-full overflow-hidden">
                        <div class="h-full bg-natura-orange/70 group-hover:bg-natura-orange transition-colors" style="width:${widthPct}%"></div>
                    </div>
                </button>
            `;
        };

        const top = items.slice(0, 5);
        const rest = items.slice(5);

        let html = `<div class="space-y-2">${top.map(buildRow).join('')}</div>`;

        if (rest.length > 0) {
            const restId = `${containerId}-rest`;
            html += `<div id="${restId}" class="hidden space-y-2 mt-2">${rest.map(buildRow).join('')}</div>`;
            html += `<button type="button" class="text-[10px] font-bold text-natura-orange hover:underline mt-2" onclick="toggleQmExpand('${restId}')">Ver mais ${rest.length}</button>`;
        }

        el.innerHTML = html;
    }

    function toggleQmExpand(id) {
        const el = document.getElementById(id);
        if (!el) return;
        const isHidden = el.classList.contains('hidden');
        el.classList.toggle('hidden', !isHidden);
        const btn = el.nextElementSibling;
        if (btn) btn.textContent = isHidden ? 'Ver menos' : `Ver mais ${el.children.length}`;
    }

    // Drill-down: ao clicar numa Causa Raiz ou Processo de Origem recorrente, mostra o período e os
    // detalhes de todos os incidentes que compartilham aquele valor.
    function openQualidadeDrillModal(label, ids, universoLabel, kind) {
        const modal = document.getElementById('qualidade-drill-modal');
        const titleEl = document.getElementById('qualidade-drill-title');
        const subtitleEl = document.getElementById('qualidade-drill-subtitle');
        const loadingEl = document.getElementById('qualidade-drill-loading');
        const listEl = document.getElementById('qualidade-drill-list');
        if (!modal || !ids || !ids.length) return;

        const kindLabel = kind === 'causaRaiz' ? 'Causa Raiz' : 'Processo de Origem';
        titleEl.textContent = label;
        subtitleEl.textContent = `${kindLabel} · Universo ${universoLabel} · ${ids.length} incidente(s)`;

        loadingEl.classList.remove('hidden');
        listEl.classList.add('hidden');
        listEl.classList.remove('flex');
        listEl.innerHTML = '';

        modal.classList.remove('hidden');
        setTimeout(() => modal.classList.remove('opacity-0'), 10);

        google.script.run
            .withSuccessHandler(incidents => {
                loadingEl.classList.add('hidden');
                listEl.classList.remove('hidden');
                listEl.classList.add('flex', 'flex-col', 'gap-4');

                if (!incidents || incidents.error) {
                    listEl.innerHTML = `<div class="text-sm text-red-600 p-4 text-center">Erro ao buscar os incidentes.</div>`;
                    return;
                }
                if (!incidents.length) {
                    listEl.innerHTML = `<div class="text-sm text-slate-500 italic p-4 text-center">Nenhum incidente encontrado para este filtro.</div>`;
                    return;
                }

                incidents.sort((a, b) => b.dataAberturaTimestamp - a.dataAberturaTimestamp);
                const newest = incidents[0];
                const oldest = incidents[incidents.length - 1];
                const periodText = (oldest && newest)
                    ? `Período: ${oldest.dataDefinicao.split(' ')[0]} a ${newest.dataDefinicao.split(' ')[0]}`
                    : '';
                subtitleEl.textContent = `${kindLabel} · Universo ${universoLabel} · ${incidents.length} incidente(s) · ${periodText}`;

                listEl.innerHTML = incidents.map(inc => buildIncidentCardHtml(inc)).join('');
            })
            .withFailureHandler(e => {
                loadingEl.classList.add('hidden');
                listEl.classList.remove('hidden');
                listEl.innerHTML = `<div class="text-sm text-red-600 p-4 text-center">Falha na comunicação: ${e.message}</div>`;
            })
            .getIncidentsByIds(ids);
    }

            modal.classList.add('opacity-0');

        }
    }

    function renderKpiCards(kpis) {

        setText('val-total-incidents', kpis.incidentesTotal);

    function sortObjByCount(obj) {
        return Object.keys(obj).sort((a, b) => obj[b].count - obj[a].count);

    const colorCache = {};
    const fixedColors = [
        '#1B472A', '#FF6600', '#6A803E', '#E29627', '#e94839',
        '#045473', '#C9E055', '#930E44', '#99aedb', '#FFBE28',
        '#112E22', '#ac2f1c', '#60002C', '#4a1c0e'
    ];

    function getColorForKey(key) {
        if (colorCache[key]) return colorCache[key];
        const existingKeys = Object.keys(colorCache);
        const colorIndex = existingKeys.length % fixedColors.length;
        const color = fixedColors[colorIndex];
        colorCache[key] = color;
        return color;
    }

    function renderTechCharts(techMetrics, totalIncidents) {
        const sortedVol = Object.keys(techMetrics).sort((a, b) => techMetrics[b].count - techMetrics[a].count).slice(0, 10);
        const labelsVol = sortedVol;
        const counts = sortedVol.map(k => techMetrics[k].count);
        const colorsVol = sortedVol.map(k => getColorForKey(k));
        const drilldownVol = sortedVol.map(k => ({ label: k, breakdown: techMetrics[k].breakdown }));

        createBarChart('chartIncidentsByTech', labelsVol, counts, totalIncidents, 'Incidente', drilldownVol, 'Tech -> Offender', false, colorsVol);

        let setOfKeys = [...sortedVol];
        setOfKeys.sort((a, b) => {
            const valA = techMetrics[a].count ? (techMetrics[a].durationMin / techMetrics[a].count) : 0;
            const valB = techMetrics[b].count ? (techMetrics[b].durationMin / techMetrics[b].count) : 0;
            return valB - valA;
        });

        const labelsDur = setOfKeys;
        const durations = setOfKeys.map(k => {
            const val = techMetrics[k].count ? (techMetrics[k].durationMin / techMetrics[k].count / 60) : 0;
            return val.toFixed(2);
        });
        const colorsDur = setOfKeys.map(k => getColorForKey(k));

    function drawEvolutionChart(metrics, mttrData, title) {
        const titleEl = document.getElementById('evolution-chart-title');
        if (titleEl) titleEl.textContent = title;

        const ctx = document.getElementById('monthlyIncidentsChart').getContext('2d');

        // Custom order for months to ensure they are sorted correctly
        const monthsOrder = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
        const quartersOrder = ["Q1", "Q2", "Q3", "Q4"];

        let labels = [];
        if (title.includes("Mensal")) {
            labels = monthsOrder.filter(m => metrics[m] !== undefined);
        } else if (title.includes("Trimestral")) {
            labels = quartersOrder.filter(q => metrics[q] !== undefined);
        } else {
            // Weekly: Sort by numeric part of "Wn"
            labels = Object.keys(metrics).sort((a, b) => {
                const na = parseInt(a.substring(1));
                const nb = parseInt(b.substring(1));
                return na - nb;
            });
        }

        const displayLabels = labels.map(l => l.charAt(0).toUpperCase() + l.slice(1));
        const counts = labels.map(l => metrics[l].count);
        const mttrs = labels.map(l => { const v = mttrData[l]; return v !== undefined ? v.toFixed(2) : 0; });

        // Cálculos para eixos dinâmicos (arredondando para cima nas dezenas)
        const maxCounts = Math.max(...counts, 0);
        const maxMTTR = Math.max(...mttrs.map(Number), 0);
        const axisMaxCounts = Math.ceil((maxCounts + 0.1) / 10) * 10;
        const axisMaxMTTR = Math.ceil((maxMTTR + 0.1) / 10) * 10;

        if (window.monthlyChartInstance) window.monthlyChartInstance.destroy();
        window.monthlyChartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: displayLabels,
                datasets: [
                    {
                        label: 'Incidentes', data: counts, backgroundColor: '#1B472A', order: 2, yAxisID: 'y-count',
                        datalabels: {
                            align: 'end', anchor: 'end', color: '#112E22', formatter: v => v > 0 ? v : ''
                        }
                    },
                    {
                        label: 'MTTR (h)', data: mttrs, type: 'line', borderColor: '#e94839', backgroundColor: '#e94839', order: 1,
                        yAxisID: 'y-mttr', datalabels: { display: false }
                    }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                onClick: (e, activeEls) => {
                    if (activeEls.length > 0) {
                        const idx = activeEls[0].index;
                        const label = displayLabels[idx];
                        let contextType = 'monthly';
                        if (title.includes("Semanal")) contextType = 'weekly';
                        else if (title.includes("Trimestral")) contextType = 'quarterly';
                        openIncidentsModal(contextType, label);
                    }
                },
                scales: {
                    'y-count': {
                        position: 'left',
                        beginAtZero: true,
                        grid: { display: false },
                        max: axisMaxCounts
                    },
                    'y-mttr': {
                        position: 'right',
                        beginAtZero: true,
                        grid: { display: true },
                        max: axisMaxMTTR
                    }
                },
                plugins: {
                    legend: {
                        display: true,
                        position: 'bottom',
                        labels: { boxWidth: 12, padding: 15, font: { size: 11 } }
                    },
                    tooltip: {
                        callbacks: {
                            label: function (context) {
                                const label = context.dataset.label || '';
                                const value = context.parsed.y;
                                if (context.datasetIndex === 1) {
                                    const hours = Math.floor(value);
                                    const minutes = Math.round((value - hours) * 60);
                                    return `${label}: ${hours}h ${minutes}m`;
                                }
                                return `${label}: ${value}`;
                            }
                        }
                    }
                }
            }
        });
    }

    function initDataStory() {
        const btn = document.getElementById('btn-data-story');
        if (!btn) return;

        // Ativar apenas para 2026 (comparando com 2025)
        if (CURRENT_FILTERS.year == "2026") {
            btn.classList.remove('hidden');
        } else {
            btn.classList.add('hidden');
        }

        btn.onclick = () => {
            document.getElementById('data-story-modal').classList.remove('hidden');
            document.getElementById('story-loading').classList.remove('hidden');
            document.getElementById('story-content').classList.add('hidden');

            // Lógica de Comparação Espelhada (YTD - Year to Day)
            const today = new Date();
            const baseYear = 2025;

            let start = CURRENT_FILTERS.startDate;
            let end = CURRENT_FILTERS.endDate;

            // Mirror today into 2025 for ceiling comparison
            let mirrorToday = new Date(today);
            mirrorToday.setFullYear(baseYear);

            if (CURRENT_FILTERS.periodKey === 'All') {
                // De 01/01/2025 até hoje/2025
                let s = new Date(baseYear, 0, 1, 0, 0, 0);
                start = s.getTime();
                end = mirrorToday.getTime();
            } else {
                // Caso existam datas de filtro (ex: Freeze), espelhamos para 2025
                if (start) {
                    let s = new Date(start);
                    s.setFullYear(baseYear);
                    start = s.getTime();
                }
                if (end) {
                    let e = new Date(end);
                    e.setFullYear(baseYear);
                    // Não comparar contra o futuro: limitamos ao mirrorToday
                    if (e > mirrorToday) e = mirrorToday;
                    end = e.getTime();
                } else if (!end && CURRENT_FILTERS.periodKey) {
                    // Se não tem end mas tem periodKey, limitamos ao mirrorToday
                    end = mirrorToday.getTime();
                }
            }

            logDebug(`Requesting baseline story for ${baseYear}. Range: ${start ? new Date(start).toLocaleDateString() : 'Start'} to ${end ? new Date(end).toLocaleDateString() : 'End'}`);

            // Busca dos dados de 2025 com o intervalo ESPELHADO
            google.script.run
                .withSuccessHandler(renderDataStory)
                .withFailureHandler(e => {
                    alert("Erro ao buscar histórico: " + e.message);
                    document.getElementById('data-story-modal').classList.add('hidden');
                })
                .getFilteredData(
                    baseYear,
                    CURRENT_FILTERS.periodKey,
                    start,
                    end,
                    CURRENT_FILTERS.card
                );
        };
    }

    function parseDataStoryTime(timeStr) {
        if (!timeStr) return 0;
        const parts = timeStr.split(':');
        if (parts.length === 2) {
            return (parseInt(parts[0], 10) * 60) + parseInt(parts[1], 10);
        }
        return 0;
    }

    function renderDataStory(baselineData) {
        document.getElementById('story-loading').classList.add('hidden');
        document.getElementById('story-content').classList.remove('hidden');

        const curr = ALL_DATA.currentKpis;
        const volCurr = curr.incidentesTotal || 0;
        const mttrCurrMin = parseDataStoryTime(curr.mttrTotal);

        // --- PREPARAÇÃO DE DADOS (COMUM) ---
        const group = CURRENT_FILTERS.evolutionGrouping || 'monthly';
        const currMetrics = ALL_DATA.evolutionData[group].metrics;
        const currMttr = ALL_DATA.evolutionData[group].mttr;

        let prevMetrics = {};
        let prevMttrMap = {};
        let titleLabel = "";

        if (group === 'monthly') {
            prevMetrics = baselineData.monthlyMetrics;
            prevMttrMap = baselineData.mttrPorMesEmHoras;
            titleLabel = "Análise Mensal";
        } else if (group === 'quarterly') {
            prevMetrics = baselineData.quarterlyMetrics;
            prevMttrMap = baselineData.mttrTrimestralEmHoras;
            titleLabel = "Análise Trimestral";
        } else {
            prevMetrics = baselineData.weeklyMetrics;
            prevMttrMap = baselineData.mttrSemanalEmHoras;
            titleLabel = "Análise Semanal";
        }

        // --- AGREGACAO PARA COMPARACAO JUSTA (PERIODO VS PERIODO) ---
        // Descobrir quais chaves (meses/semanas) tem dados em 2026
        const activeKeys = Object.keys(currMetrics).filter(k => currMetrics[k].count > 0);

        let volPrev = 0;
        let fairTotalDurationMinPrev = 0;

        activeKeys.forEach(k => {
            if (prevMetrics[k]) {
                volPrev += prevMetrics[k].count;
                fairTotalDurationMinPrev += prevMetrics[k].durationMin;
            }
        });

        const mttrPrevMin = volPrev > 0 ? (fairTotalDurationMinPrev / volPrev) : 0;
        const formatMttr = (totalMin) => {
            const h = Math.floor(totalMin / 60);
            const m = Math.round(totalMin % 60);
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        };
        const mttrPrevFormatted = formatMttr(mttrPrevMin);

        let volDiff = volCurr - volPrev;
        let volDiffPct = volPrev > 0 ? (volDiff / volPrev) * 100 : (volCurr > 0 ? 100 : 0);

        let mttrDiff = mttrCurrMin - mttrPrevMin;
        let mttrDiffPct = mttrPrevMin > 0 ? (mttrDiff / mttrPrevMin) * 100 : (mttrCurrMin > 0 ? 100 : 0);

        // Define situation
        let isBetter = (volCurr <= volPrev && mttrCurrMin < mttrPrevMin) || (volCurr < volPrev && mttrCurrMin <= mttrPrevMin);
        let isWorse = (volCurr > volPrev && volDiffPct > 10) || (mttrCurrMin > mttrPrevMin && mttrDiffPct > 10);

        let headline = "";
        let alertClass = "";
        let alertBg = "";

        if (isBetter) {
            headline = "🎉 Excelente! Reduzimos o volume e o tempo de impacto em relação ao mesmo período de 2025.";
            alertClass = "border-natura-green-cerrado";
            alertBg = "bg-natura-green-capim/20";
        } else if (isWorse) {
            headline = "⚠️ Atenção: Há um aumento nos incidentes ou no tempo de resposta contra o mesmo período de 2025.";
            alertClass = "border-natura-red-buriti";
            alertBg = "bg-natura-red-buriti/10";
        } else {
            headline = "📊 Estabilidade: Os resultados atuais estão alinhados historicamente com o mesmo período de 2025.";
            alertClass = "border-natura-blue-profundo";
            alertBg = "bg-natura-blue-ceu/20";
        }

        const box = document.getElementById('story-alert-box');
        box.className = `border-l-4 p-4 rounded-r-xl shadow-sm transition-all mb-2 ${alertClass} ${alertBg}`;
        document.getElementById('story-headline').textContent = headline;

        // Update DOM Elements
        document.getElementById('story-vol-curr').textContent = volCurr;
        document.getElementById('story-vol-prev').textContent = volPrev;
        const volEl = document.getElementById('story-vol-diff');

        if (volDiff > 0) {
            volEl.innerHTML = `<span class="text-natura-red-buriti">↑ +${volDiffPct.toFixed(1)}%</span>`;
        } else if (volDiff < 0) {
            volEl.innerHTML = `<span class="text-natura-green-cerrado">↓ ${Math.abs(volDiffPct).toFixed(1)}%</span>`;
        } else {
            volEl.innerHTML = `<span class="text-slate-400">= 0%</span>`;
        }

        document.getElementById('story-mttr-curr').textContent = curr.mttrTotal;
        document.getElementById('story-mttr-prev').textContent = mttrPrevFormatted;
        const mttrEl = document.getElementById('story-mttr-diff');

        if (mttrDiff > 0) {
            mttrEl.innerHTML = `<span class="text-natura-red-buriti">↑ +${mttrDiffPct.toFixed(1)}%</span>`;
        } else if (mttrDiff < 0) {
            mttrEl.innerHTML = `<span class="text-natura-green-cerrado">↓ ${Math.abs(mttrDiffPct).toFixed(1)}%</span>`;
        } else {
            mttrEl.innerHTML = `<span class="text-slate-400">= 0%</span>`;
        }

        // Build summary paragraph
        let summary = `Comparando exclusivamente os mesmos períodos do ano anterior, observamos que o volume de Major Incidentes `;
        if (volDiffPct !== 0) {
            summary += `${volDiff > 0 ? 'cresceu' : 'caiu'} em ${Math.abs(volDiffPct).toFixed(1)}%, passando de ${volPrev} para ${volCurr}. `;
        } else {
            summary += `manteve-se idêntico (${volCurr} incidentes). `;
        }

        summary += `Enquanto isso, a velocidade de recuperação (MTTR) `;
        if (mttrDiffPct !== 0) {
            summary += `${mttrDiff > 0 ? 'piorou' : 'melhorou'} em ${Math.abs(mttrDiffPct).toFixed(1)}%, mudando de ${mttrPrevFormatted} para ${curr.mttrTotal}.`;
        } else {
            summary += `está rigorosamente igual (${curr.mttrTotal}).`;
        }

        document.getElementById('story-summary').textContent = summary;

        // --- BREAKDOWN SECTION ---
        // Ordenação das chaves já identificadas como ativas
        if (group === 'monthly') {
            const monthsOrder = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
            activeKeys.sort((a, b) => monthsOrder.indexOf(a) - monthsOrder.indexOf(b));
        } else if (group === 'quarterly') {
            activeKeys.sort();
        } else {
            activeKeys.sort((a, b) => parseInt(a.substring(1)) - parseInt(b.substring(1)));
        }

        let html = "";
        if (activeKeys.length === 0) {
            html = `<p class="text-[11px] text-slate-500 italic p-3 text-center border border-dashed border-slate-200 rounded-lg">Nenhum dado do período vigente encontrado para comparar.</p>`;
        } else {
            activeKeys.forEach(k => {
                const cVol = currMetrics[k] ? currMetrics[k].count : 0;
                const pVol = prevMetrics[k] ? prevMetrics[k].count : 0;

                const cMttr = currMttr[k] || 0;
                const pMttr = prevMttrMap[k] || 0;

                const fmtMttr = (val) => {
                    const h = Math.floor(val);
                    const m = Math.round((val - h) * 60);
                    return `${h}h ${m}m`;
                };

                let volDiffLocal = cVol - pVol;
                let mttrDiffLocal = cMttr - pMttr;

                let volDiffLocalPct = pVol > 0 ? (volDiffLocal / pVol) * 100 : (cVol > 0 ? 100 : 0);
                let mttrDiffLocalPct = pMttr > 0 ? (mttrDiffLocal / pMttr) * 100 : (cMttr > 0 ? 100 : 0);

                let volBadge = volDiffLocal > 0 ? `<span class="text-natura-red-buriti font-bold">↑ +${volDiffLocal} (+${Math.abs(volDiffLocalPct).toFixed(1)}%)</span>` : (volDiffLocal < 0 ? `<span class="text-natura-green-cerrado font-bold">↓ ${Math.abs(volDiffLocal)} (-${Math.abs(volDiffLocalPct).toFixed(1)}%)</span>` : `<span class="text-slate-400">=</span>`);
                let mttrBadge = mttrDiffLocal > 0 ? `<span class="text-natura-red-buriti font-bold">↑ +${fmtMttr(mttrDiffLocal)} (+${Math.abs(mttrDiffLocalPct).toFixed(1)}%)</span>` : (mttrDiffLocal < 0 ? `<span class="text-natura-green-cerrado font-bold">↓ ${fmtMttr(Math.abs(mttrDiffLocal))} (-${Math.abs(mttrDiffLocalPct).toFixed(1)}%)</span>` : `<span class="text-slate-400">=</span>`);

                const displayLabel = k.charAt(0).toUpperCase() + k.slice(1);

                html += `
                <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-[inset_0_2px_4px_rgba(0,0,0,0.01)] hover:bg-white transition-colors">
                    <span class="font-bold text-slate-700 w-28 shrink-0 flex items-center gap-2"><div class="w-1.5 h-1.5 rounded-full bg-slate-300"></div>${displayLabel}</span>
                    <div class="flex-1 grid grid-cols-2 gap-4 text-xs bg-white p-2 rounded shadow-sm border border-slate-100">
                        <div class="flex items-center justify-between">
                            <div>
                               <span class="text-slate-400 uppercase tracking-widest text-[9px] block mb-0.5">Incidentes</span>
                               <div class="flex items-baseline gap-1">
                                    <span class="font-bold text-slate-800 text-[13px]">${cVol}</span>
                                    <span class="text-slate-400 text-[9px]">vs ${pVol}</span>
                               </div>
                            </div>
                            <div class="text-right text-[11px]">${volBadge}</div>
                        </div>
                        <div class="flex items-center justify-between pl-3 border-l border-slate-100">
                            <div>
                               <span class="text-slate-400 uppercase tracking-widest text-[9px] block mb-0.5">MTTR</span>
                               <div class="flex items-baseline gap-1">
                                    <span class="font-bold text-slate-800 text-[13px]">${fmtMttr(cMttr)}</span>
                                    <span class="text-slate-400 text-[9px]">vs ${fmtMttr(pMttr)}</span>
                               </div>
                            </div>
                            <div class="text-right text-[11px]">${mttrBadge}</div>
                        </div>
                    </div>
                </div>
                `;
            });
        }
        document.getElementById('story-breakdown-title').textContent = `Comparação Exata por Período (${titleLabel})`;
        document.getElementById('story-breakdown-list').innerHTML = html;
    }

    function renderRanking() {
        const { category, type, context, searchQuery } = RANKING_STATE;
        const titleEl = document.getElementById('ranking-modal-title');
        const listEl = document.getElementById('ranking-list');
        const btnVol = document.getElementById('btn-ranking-vol');
        const btnMttr = document.getElementById('btn-ranking-mttr');

        if (btnVol && btnMttr) {
            [btnVol, btnMttr].forEach(btn => {
                btn.classList.remove('bg-white', 'text-natura-green-cerrado', 'shadow-sm', 'text-slate-500');
            });

            if (type === 'vol') {
                btnVol.classList.add('bg-white', 'text-natura-green-cerrado', 'shadow-sm');
                btnMttr.classList.add('text-slate-500');
            } else {
                btnMttr.classList.add('bg-white', 'text-natura-green-cerrado', 'shadow-sm');
                btnVol.classList.add('text-slate-500');
            }
        }

        listEl.innerHTML = '';

        let dataObj = category === 'tech' ? ALL_DATA.techMetrics : ALL_DATA.offenderMetrics;
        if (!dataObj) return;

        titleEl.textContent = `Ranking: ${category === 'tech' ? 'Tecnologia' : 'Ofensor'}`;

        let sortFn;
        if (type === 'vol') {
            sortFn = (a, b) => dataObj[b].count - dataObj[a].count;
        } else {
            sortFn = (a, b) => {
                const valA = dataObj[a].count ? (dataObj[a].durationMin / dataObj[a].count) : 0;
                const valB = dataObj[b].count ? (dataObj[b].durationMin / dataObj[b].count) : 0;
                return valB - valA;
            };
        }

        let sortedKeys = Object.keys(dataObj).sort(sortFn);

        // Filter by Search Query
        if (searchQuery) {
            sortedKeys = sortedKeys.filter(k => k.toLowerCase().includes(searchQuery));
        }

        const totalIncidents = (ALL_DATA.currentKpis && ALL_DATA.currentKpis.incidentesTotal) || 1;

        if (sortedKeys.length === 0) {
            listEl.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400 italic">Nenhum resultado encontrado para "${searchQuery}"</div>`;
            return;
        }

        sortedKeys.forEach((key, index) => {
            const count = dataObj[key].count;
            const pct = ((count / totalIncidents) * 100).toFixed(1);

            let mainValue = '';
            let subValue = '';

            if (context === 'mttr') {
                const avgMin = count ? (dataObj[key].durationMin / count) : 0;
                mainValue = formatMinutesToHHMM(avgMin);
                subValue = `${count} Inc. | ${pct}%`;
            } else {
                mainValue = `${count}`;
                subValue = `${pct}% do total`;
            }

            const itemHtml = `
                <div class="flex justify-between items-center py-2 px-3 border border-slate-100 hover:border-natura-orange/30 hover:bg-white rounded-lg transition-all bg-white/50 shadow-sm">
                    <div class="flex items-center gap-2 min-w-0">
                        <div class="flex-none w-5 h-5 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 text-[10px] font-bold border border-slate-200">
                            ${index + 1}
                        </div>
                        <div class="flex flex-col min-w-0">
                            <span class="font-bold text-slate-700 text-xs truncate uppercase leading-tight" title="${key}">${key}</span>
                            <span class="text-[9px] text-slate-400 font-bold uppercase tracking-tight">${subValue}</span>
                        </div>
                    </div>
                    <span class="flex-none font-black text-natura-orange whitespace-nowrap text-sm ml-2">
                        ${mainValue}
                    </span>
                </div>
            `;
            listEl.innerHTML += itemHtml;
        });
    }

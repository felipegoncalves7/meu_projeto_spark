<script>
/* ==========================================================================
   Sub-visão O&L · Análise Tático-Estratégica (frontend)
   Dados: getOLAnaliseData(ano) em OperacaoLogisticaAnalise.gs. Unidade de análise = Incidente de O&L
   (Stream O&L / Planejamento Logístico) com origem Tecnologia. Período, comparativo, camada e CARD
   são aplicados aqui, em memória.
   ========================================================================== */
(function () {
  'use strict';

  /* --------------------------------------------------------------- constantes */
  var MONTHS = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
  var MABBR = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
  var COUNTRY_NAMES = {

    gt: 'Guatemala', sv: 'El Salvador', hn: 'Honduras', ni: 'Nicarágua', cr: 'Costa Rica', pa: 'Panamá',
    do: 'República Dominicana', uy: 'Uruguai', my: 'Malásia', card: 'CARD'

    risk: { label: 'Risco aceito', order: 3 }, other: { label: 'Outro status', order: 4 }, nd: { label: 'Sem status', order: 5 }
  };

    desafio: { key: 'desafio', label: 'Desafio', symbol: '★' },
    none: { key: 'none', label: 'Sem referência', symbol: '–' },
    nodata: { key: 'none', label: 'Sem dado', symbol: '–' }
  };

  /* ------------------------------------------------------------------ ícones */
  var ICONS = {
    spark: '<path d="M12 3.5l1.8 5.2 5.2 1.8-5.2 1.8L12 17.5l-1.8-5.2L5 10.5l5.2-1.8z"/><path class="dots" d="M18.5 17v4M16.5 19h4"/>',
    alert: '<path d="M12 4l9 15.5H3z"/><path d="M12 10v4.5"/><circle class="fill" cx="12" cy="17" r="1"/>',
    box: '<path d="M12 3.5l8 4v9l-8 4-8-4v-9z"/><path d="M4 7.5l8 4 8-4M12 11.5v9"/>',
    factory: '<path d="M3.5 20V10.5l6 3v-3l6 3V5.5h4V20z"/><path class="dots" d="M7 17h10"/>',
    headset: '<path d="M4.5 14v-2a7.5 7.5 0 0 1 15 0v2"/><rect x="3.5" y="13.5" width="3.5" height="5.5" rx="1.2"/><rect x="17" y="13.5" width="3.5" height="5.5" rx="1.2"/><path d="M19 19c0 1.6-2 2.2-5 2.2"/>',
    calendar: '<rect x="4" y="5.5" width="16" height="14.5" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/><path class="dots" d="M8 14.5h8"/>',
    gauge: '<path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/><path class="dots" d="M6.5 11.5l1 .8M12 7.5v1.2M17.5 11.5l-1 .8"/><circle class="fill" cx="12" cy="16" r="1.3"/>',
    truck: '<path d="M3 6.5h11v9H3zM14 9.5h3.6l3 3.2v2.8H14"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/><path class="dots" d="M5 10h6"/>',
    warehouse: '<path d="M3.5 20V9l8.5-5 8.5 5v11"/><path d="M7 20v-7h10v7"/><path class="dots" d="M7 16.5h10"/>',
    hub: '<circle cx="12" cy="12" r="2.6"/><circle cx="5" cy="6" r="1.8"/><circle cx="19" cy="6" r="1.8"/><circle cx="5" cy="18" r="1.8"/><circle cx="19" cy="18" r="1.8"/><path d="M6.5 7.2l3.5 3M17.5 7.2l-3.5 3M6.5 16.8l3.5-3M17.5 16.8l-3.5-3"/>',
    pea: '<path d="M4 9.5h12v9H4z"/><path d="M16 12h2.8l1.7 2.3v4.2H16"/><path d="M7.5 9.5V6.5h5v3"/><path class="dots" d="M6.5 14h7"/>',
    leaf: '<path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14z"/><path class="dots" d="M5 19l8-8"/>',
    monitor: '<rect x="3.5" y="4.5" width="17" height="11.5" rx="1.5"/><path d="M9 20h6M12 16v4"/><path class="dots" d="M7 10h10"/>',
    users: '<circle cx="9" cy="8.5" r="3"/><path d="M3.5 19c.5-3.2 2.7-5 5.5-5s5 1.8 5.5 5"/><circle cx="17" cy="9.5" r="2.3"/><path class="dots" d="M16 14.2c2.4.2 4 1.8 4.5 4.8"/>',
    phone: '<path d="M5 4.5h4l1.5 4-2.2 1.5a11 11 0 0 0 5.7 5.7l1.5-2.2 4 1.5v4c0 .8-.7 1.5-1.5 1.5A16 16 0 0 1 3.5 6c0-.8.7-1.5 1.5-1.5z"/>',
    layers: '<path d="M12 4l8.5 4.5L12 13 3.5 8.5z"/><path d="M3.5 12.5L12 17l8.5-4.5"/><path class="dots" d="M3.5 16.5L12 21l8.5-4.5"/>',
    clock: '<circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/>',
    target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.5"/><circle class="fill" cx="12" cy="12" r="1.4"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    pin: '<path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.2"/>',
    chevron: '<path d="M9 6l6 6-6 6"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    list: '<path d="M8 7h12M8 12h12M8 17h12"/><path class="dots" d="M4 7h.1M4 12h.1M4 17h.1"/>',
    chart: '<path d="M4 20h16"/><path d="M7 16v-5M12 16V7M17 16v-8"/>',
    info: '<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5"/><circle class="fill" cx="12" cy="8" r="1"/>',
    flag: '<path d="M5.5 21V4"/><path d="M5.5 4.5h11l-2.5 4 2.5 4h-11"/><path class="dots" d="M8.5 8.5h3"/>',
    server: '<rect x="4" y="4" width="16" height="6.5" rx="1.2"/><rect x="4" y="13.5" width="16" height="6.5" rx="1.2"/><circle class="fill" cx="7.5" cy="7.2" r="1"/><circle class="fill" cx="7.5" cy="16.8" r="1"/><path class="dots" d="M11 7.2h6M11 16.8h6"/>',
    radar: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><path d="M12 12l5.5-5.5"/><circle class="fill" cx="15.5" cy="14.5" r="1.1"/>',
    repeat: '<path d="M5 9.5A6.5 6.5 0 0 1 17.5 7l1.5 1.5"/><path d="M19 4.5v4h-4"/><path d="M19 14.5A6.5 6.5 0 0 1 6.5 17L5 15.5"/><path d="M5 19.5v-4h4"/>',
    search: '<circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/><path class="dots" d="M8 10.5h5"/>',
    shuffle: '<path d="M4 7h3.5c4 0 5 10 9 10H20"/><path d="M4 17h3.5c1.5 0 2.5-1.4 3.4-3.2M13.5 10.2c.9-1.8 1.9-3.2 3.4-3.2H20"/><path d="M17.5 4.5L20 7l-2.5 2.5M17.5 14.5L20 17l-2.5 2.5"/>',
    wrench: '<path d="M14.5 4.5a4.5 4.5 0 0 0-4.3 5.8L4.5 16a2.1 2.1 0 0 0 3 3l5.7-5.7a4.5 4.5 0 0 0 5.8-4.3l-2.6 2.6-2.8-.6-.6-2.8z"/>',
    download: '<path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14"/>',
    sheet: '<rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M4 9.5h16M4 14.5h16M10 9.5v10.5"/>',
    dotgrid: '<circle class="fill" cx="7" cy="7" r="1.3"/><circle class="fill" cx="12" cy="7" r="1.3"/><circle class="fill" cx="17" cy="7" r="1.3"/><circle class="fill" cx="7" cy="12" r="1.3"/><circle class="fill" cx="12" cy="12" r="1.3"/><circle class="fill" cx="17" cy="12" r="1.3"/><circle class="fill" cx="7" cy="17" r="1.3"/><circle class="fill" cx="12" cy="17" r="1.3"/><circle class="fill" cx="17" cy="17" r="1.3"/>'
  };
  function icon(name) { return '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + (ICONS[name] || ICONS.dotgrid) + '</svg>'; }
  function tile(name, size) { return '<span class="ico-tile' + (size ? ' ' + size : '') + '" aria-hidden="true">' + icon(name) + '</span>'; }
  function entIcon(kind, name) {
    if (kind === 'sistema') {
      var n = fold(name);
      if (/\bura\b/.test(n)) return 'phone';
      if (/\bcrm\b/.test(n)) return 'users';
      if (/\bo9\b|apo/.test(n)) return 'layers';
      return 'monitor';
    }
    return { cd: 'warehouse', hub: 'hub', pea: 'pea', planta: 'factory', ecoparque: 'leaf' }[kind] || 'pin';
  }

  /* --------------------------------------------------------------- utilitários */
  function isNum(v) { return typeof v === 'number' && isFinite(v); }
  function r2(v) { return Math.round(v * 100) / 100; }
  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fold(s) { return String(s === null || s === undefined ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim(); }
  function fmtNum(v, d) { return isNum(v) ? v.toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }) : '—'; }
  function fmtPct(v, d) { return isNum(v) ? fmtNum(v, d === undefined ? 1 : d) + '%' : '—'; }
  function fmtInt(v) { return isNum(v) ? Math.round(v).toLocaleString('pt-BR') : '—'; }
  function fmtSigned(v, d) { if (!isNum(v)) return '—'; var r = Number(v.toFixed(d)); return (r > 0 ? '+' : r < 0 ? '−' : '') + fmtNum(Math.abs(r), d); }
  function fmtHM(min) {
    if (!isNum(min)) return '—';
    var m = Math.round(Math.abs(min)), h = Math.floor(m / 60), mm = m % 60;
    return (h < 10 ? '0' : '') + h + ':' + (mm < 10 ? '0' : '') + mm;
  }
  function fmtDur(min) {
    if (!isNum(min)) return '—';
    var m = Math.round(min);
    if (m < 60) return m + 'min';
    var h = Math.floor(m / 60), mm = m % 60;
    return h.toLocaleString('pt-BR') + 'h' + (mm ? (mm < 10 ? '0' : '') + mm : '');
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function fmtDate(ms) { if (!isNum(ms)) return '—'; var d = new Date(ms); return pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
  function fmtDay(ms) { if (!isNum(ms)) return '—'; var d = new Date(ms); return pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + '/' + d.getFullYear(); }
  function plural(n, s, p) { return n === 1 ? s : p; }
  function pct(n, d) { return d > 0 ? n / d * 100 : null; }
  function uniq(a) { return a.filter(function (v, i) { return a.indexOf(v) === i; }); }
  function $(id) { return document.getElementById(id); }
  function sum(a) { return a.reduce(function (s, v) { return s + (isNum(v) ? v : 0); }, 0); }
  function avg(a) { var b = a.filter(isNum); return b.length ? sum(b) / b.length : null; }
  function flag(iso, lg) {
    if (!iso || iso === 'nd') return '';
    var c = String(iso).toLowerCase(), nm = COUNTRY_NAMES[c] || c.toUpperCase();
    if (c === 'card') return '<span class="tag">CARD</span>';
    return '<span class="fi fi-' + esc(c) + (lg ? ' lg' : '') + '" role="img" aria-label="' + esc(nm) + '" title="' + esc(nm) + '"></span>';
  }
  function origemKey(o) { var f = fold(o); return f === 'end-users' ? 'eu' : f === 'monitoracao' ? 'mon' : f === 'experiencias' ? 'exp' : 'na'; }

  /* ------------------------------------------------------------------ deltas */
  function nobase(txt) { return { cls: 'nobase', arrow: '', txt: txt || 'sem base', d: null }; }
  function clsFor(d, dir) { return d === 0 ? 'flat' : ((d < 0) === (dir === 'lower') ? 'good' : 'bad'); }
  function arrowFor(d) { return d === 0 ? '=' : (d < 0 ? '▼' : '▲'); }
  function deltaCount(cur, prev, dir) {
    if (!isNum(cur) || !isNum(prev)) return nobase();
    var d = cur - prev, p = prev > 0 ? d / prev * 100 : null;
    return { cls: clsFor(d, dir || 'lower'), arrow: arrowFor(d), d: d, txt: d === 0 ? 'estável' : fmtSigned(d, 0) + (isNum(p) ? ' (' + fmtSigned(p, 0) + '%)' : '') };
  }
  function deltaMin(cur, prev) {
    if (!isNum(cur) || !isNum(prev)) return nobase();
    var d = Math.round(cur) - Math.round(prev);
    return { cls: clsFor(d, 'lower'), arrow: arrowFor(d), d: d, txt: d === 0 ? 'estável' : (d > 0 ? '+' : '−') + fmtHM(d) };
  }
  function deltaPP(cur, prev, dec, dir) {
    if (!isNum(cur) || !isNum(prev)) return nobase();
    var f = Math.pow(10, dec), d = (Math.round(cur * f) - Math.round(prev * f)) / f;
    return { cls: clsFor(d, dir || 'higher'), arrow: arrowFor(d), d: d, txt: fmtSigned(d, dec) + ' p.p.' };
  }
  function deltaHtml(dl, vs) {
    return '<span class="delta ' + dl.cls + '">' + (dl.arrow ? '<span class="arrow" aria-hidden="true">' + dl.arrow + '</span>' : '') + esc(dl.txt) +
      (vs && dl.cls !== 'nobase' ? ' <span class="vs">vs ' + esc(vs) + '</span>' : '') + '</span>';
  }

  /* ---------------------------------------------------- status (disponibilidade) */
  function hasRefs(r) { return !!r && isNum(r.min) && isNum(r.meta) && isNum(r.des) && r.min <= r.meta && r.meta <= r.des; }
  function statusOf(v, refs) {
    if (!isNum(v)) return STATUS.nodata;
    if (!hasRefs(refs)) return STATUS.none;
    if (r2(v) < r2(refs.min)) return STATUS.atencao;
    if (r2(v) < r2(refs.meta)) return STATUS.minimo;
    if (r2(v) < r2(refs.des)) return STATUS.meta;
    return STATUS.desafio;
  }
  function chip(st, sm) { return '<span class="chip is-' + st.key + (sm ? ' sm' : '') + '"><span class="sym" aria-hidden="true">' + st.symbol + '</span>' + esc(st.label) + '</span>'; }

  /* ------------------------------------------------------------------ estado */
  var D = null, M = null, ALL = [], BYID = {}, charts = {}, CACHE = {};
  var state = {
    year: null, periodKey: 'l6', cmp: 'yoy', layer: 'all', card: 'exc', rank: 'tec', modal: null,
    base: { flow: '', layer: '', sev: '', origem: '', prb: '', q: '' },
    eng: { type: 'rca', sort: 'volume', teams: [] }
  };
  var BASE_URL = (document.body && document.body.getAttribute('data-base-url')) || '';
  var T = {};

  /* ---------------------------------------------------------- preparação */
  function ydOf(y) { if (!D) return null; if (D.current && D.current.year === y) return D.current; if (D.previous && D.previous.year === y) return D.previous; return null; }
  function prepare() {
    ALL = []; BYID = {};
    T = D.config.targets;
    [D.current, D.previous].forEach(function (yd) {
      if (!yd || !yd.incidents) return;
      var rowsBy = {};
      (yd.rows || []).forEach(function (r) { (rowsBy[r.inc] = rowsBy[r.inc] || []).push(r); });
      Object.keys(yd.incidents).forEach(function (id) {
        var I = yd.incidents[id];
        I.rows = rowsBy[id] || [];
        if (!isNum(I.ab) && isNum(I.abMI)) I.ab = I.abMI;
        if (!isNum(I.m) && isNum(I.ab)) I.m = new Date(I.ab).getMonth() + 1;
        var md = null;
        I.rows.forEach(function (r) { if (isNum(r.dur)) md = Math.max(md || 0, r.dur); });
        I.ttrU = isNum(I.ttr) ? I.ttr : md;
        I.sevN = I.sev === 0 || I.sev === 1 ? I.sev : null;
        I.isChange = fold(I.ofe) === 'mudanca';
        I.ok = origemKey(I.origem);
        var tgt = I.sevN === 0 ? T.olaSev0 : (I.sevN === 1 ? T.olaSev1 : null);
        I.olaOk = isNum(I.ttrU) && tgt ? I.ttrU <= tgt : null;
        I.outlier = isNum(I.ttrU) && ((I.sevN === 0 && I.ttrU >= T.outlierSev0) || (I.sevN === 1 && I.ttrU >= T.outlierSev1));
        I.flows = uniq(I.rows.map(function (r) { return r.flow; }).filter(function (f) { return f && f !== 'outros'; }));
        I.ents = uniq(I.rows.filter(function (r) { return !r.unm && r.flow !== 'outros'; }).map(function (r) { return r.entName; }));
        I.mks = uniq(I.rows.map(function (r) { return r.mk; }).filter(Boolean));
        I.card = I.rows.some(function (r) { return r.card; });
        I.imps = uniq(I.rows.map(function (r) { return r.imp; }).filter(Boolean));
        I.prbObjs = (I.prbs || []).map(function (p) { return D.problems[p]; }).filter(Boolean);
        I.chgObj = I.sm && D.changes[I.sm] ? D.changes[I.sm] : null;
        I.tImpMain = (I.tImp || []).filter(function (t) { return t && t !== 'N/A'; })[0] || 'N/A';
        ALL.push(I);
        BYID[id] = I;
      });
    });
    ALL.sort(function (a, b) { return (b.ab || 0) - (a.ab || 0); });
  }

  /* ------------------------------------------------------------- períodos */
  function endOfDay(ms) { var d = new Date(ms); d.setHours(23, 59, 59, 999); return d.getTime(); }
  function shiftYear(ms, n) { var d = new Date(ms); d.setFullYear(d.getFullYear() + n); return d.getTime(); }
  function monthsBack(y, m, n) {
    var out = [];
    for (var i = n - 1; i >= 0; i--) { var mm = m - i, yy = y; while (mm < 1) { mm += 12; yy--; } out.push({ y: yy, m: mm }); }
    return out;
  }
  // Os períodos respeitam a aba Status_Apuracao (mesma regra da Disponibilidade na Visão O&L): vão até o último mês
  // Apurado ou Parcial. Meses com apuração não iniciada ficam fora, mesmo que já tenham incidentes registrados.
  // O corte no dia de hoje só vale quando o último mês considerado é o mês corrente.
  function refPoint() {
    var t = new Date(D.today), y = D.year, st = (D.current && D.current.statuses) || [];
    var maxM = y === t.getFullYear() ? t.getMonth() + 1 : (y < t.getFullYear() ? 12 : 0);
    var last = 0, closed = 0;
    for (var m = 1; m <= maxM; m++) {
      if (st[m - 1] === 'APURADO' || st[m - 1] === 'PARCIAL') last = m;
      if (st[m - 1] === 'APURADO') closed = m;
    }
    if (!last) return { y: y - 1, m: 12, closed: 12, cut: null, partial: false, none: true };
    var isNow = y === t.getFullYear() && last === t.getMonth() + 1;
    return { y: y, m: last, closed: closed, cut: isNow ? endOfDay(D.today) : null, partial: st[last - 1] === 'PARCIAL', none: false };
  }
  function rangeTxt(months) {
    if (!months.length) return '—';
    var a = months[0], b = months[months.length - 1];
    if (months.length === 1) return MABBR[a.m - 1] + '/' + a.y;
    if (a.y === b.y) return MABBR[a.m - 1] + '–' + MABBR[b.m - 1] + '/' + b.y;
    return MABBR[a.m - 1] + '/' + a.y + '–' + MABBR[b.m - 1] + '/' + b.y;
  }
  function mkWin(key, label, group, months, cut) {
    var set = {};
    months.forEach(function (x) { set[x.y + '-' + x.m] = true; });
    var w = { key: key, label: label, group: group, months: months, cut: cut, set: set };
    var t = cut ? new Date(cut) : null;
    var stOf = function (x) { var yd = ydOf(x.y); return yd && yd.statuses ? yd.statuses[x.m - 1] : null; };
    var partial = months.filter(function (x) { return stOf(x) === 'PARCIAL'; });
    var notStarted = months.filter(function (x) { return stOf(x) === 'NAO_INICIADO'; });
    var own = key !== 'yoy' && key !== 'pop';
    var mlist = function (l) { return l.map(function (x) { return MABBR[x.m - 1]; }).join(', '); };
    w.range = rangeTxt(months) + (t && months.some(function (x) { return x.y === t.getFullYear() && x.m === t.getMonth() + 1; }) ? ' (até ' + pad2(t.getDate()) + '/' + pad2(t.getMonth() + 1) + ')' : '') +
      (partial.length && own ? ' · ' + mlist(partial) + ' parcial' : '') +

      return '<li><div><a href="#' + st[0] + '">' + esc(st[1]) + '</a><span class="legend">' + esc(st[2]) + '</span></div></li>';
    }).join('') + '</ol></div>';
    $('sec-agenda').innerHTML = sectionHead('flag', 'Visão O&amp;L · Análise tático-estratégica', 'Agenda O&amp;L — ' + esc(M.L.cur),
      'Sub-visão para a agenda com a liderança de O&amp;L: incidentes, disponibilidade, problemas e mudanças, por fluxo e localidade.') +
      scopeNotices() + '<div class="ox-agenda">' + left + right + '</div>';
  }

  /* -------------------------------------------------------------- Panorama */
  function kpiCard(o) {
    return '<div class="ox-kpi' + (o.alert ? ' is-alert' : '') + '"><div class="kh"><span class="eyebrow">' + o.title + (o.tip ? ' <span class="info-i" data-tip="' + esc(o.tip) + '">i</span>' : '') + '</span>' + tile(o.icon, 'sm') + '</div>' +
      '<div class="kv">' + o.value + '</div>' + (o.delta || '') + (o.split ? '<div class="ks">' + o.split + '</div>' : '') + (o.foot ? '<div class="legend">' + o.foot + '</div>' : '') + '</div>';
  }
  function splitCell(label, v, cls, dl) { return '<div><div class="legend">' + label + '</div><div class="v ' + (cls || '') + '">' + v + '</div>' + (dl || '') + '</div>'; }
  function renderPanorama() {
    var c = M.sCur, p = M.sPrev, P = p || {}, vs = vsTxt();
    var nMonths = M.w.months.length;
    var dl = function (fn, a, b, x, y) { return p ? deltaHtml(fn(a, b, x, y)) : deltaHtml(nobase()); };
    var ps = prbSummary(M.problems);
    var cards = [
      kpiCard({ title: 'Incidentes', icon: 'alert', value: fmtInt(c.n), delta: deltaHtml(p ? deltaCount(c.n, P.n, 'lower') : nobase(), vs),
        split: splitCell('<span class="sev-dot s0"></span>Sev 0', c.sev0, '', dl(deltaCount, c.sev0, P.sev0, 'lower')) + splitCell('<span class="sev-dot s1"></span>Sev 1', c.sev1, '', dl(deltaCount, c.sev1, P.sev1, 'lower')),
        foot: 'Média de ' + fmtNum(c.n / nMonths, 1) + ' por mês' + (p ? ' (comparativo: ' + fmtNum(P.n / nMonths, 1) + ')' : '') }),
      kpiCard({ title: 'MTTR', icon: 'clock', value: fmtHM(c.mttr), delta: deltaHtml(p ? deltaMin(c.mttr, P.mttr) : nobase(), vs),
        tip: 'Tempo médio de restauração pelo TTR oficial (MajorIncidentes). Metas: Sev 0 ≤ ' + fmtHM(T.mttrSev0) + ' e Sev 1 ≤ ' + fmtHM(T.mttrSev1) + '.',
        split: splitCell('Sev 0 · meta ' + fmtHM(T.mttrSev0), fmtHM(c.mttr0), targetCls(c.mttr0, T.mttrSev0), dl(deltaMin, c.mttr0, P.mttr0)) + splitCell('Sev 1 · meta ' + fmtHM(T.mttrSev1), fmtHM(c.mttr1), targetCls(c.mttr1, T.mttrSev1), dl(deltaMin, c.mttr1, P.mttr1)),
        alert: (isNum(c.mttr0) && c.mttr0 > T.mttrSev0) || (isNum(c.mttr1) && c.mttr1 > T.mttrSev1) }),
      kpiCard({ title: 'MTTR sem outliers', icon: 'target', value: (c.out0 + c.out1) + '<small>' + plural(c.out0 + c.out1, 'outlier', 'outliers') + '</small>',
        tip: 'Desconsidera incidentes com TTR ≥ ' + fmtHM(T.outlierSev0) + ' (Sev 0) e ≥ ' + fmtHM(T.outlierSev1) + ' (Sev 1). Metas: Sev 0 ≤ ' + fmtHM(T.mttrSemOutliersSev0) + ' e Sev 1 ≤ ' + fmtHM(T.mttrSemOutliersSev1) + '.',
        split: splitCell('Sev 0 · meta ' + fmtHM(T.mttrSemOutliersSev0), fmtHM(c.mttrSO0), targetCls(c.mttrSO0, T.mttrSemOutliersSev0), dl(deltaMin, c.mttrSO0, P.mttrSO0)) + splitCell('Sev 1 · meta ' + fmtHM(T.mttrSemOutliersSev1), fmtHM(c.mttrSO1), targetCls(c.mttrSO1, T.mttrSemOutliersSev1), dl(deltaMin, c.mttrSO1, P.mttrSO1)),
        foot: isNum(c.outShare) ? 'Outliers somam ' + fmtPct(c.outShare, 0) + ' das horas de TTR do período' : '' }),
      kpiCard({ title: 'OLA de resolução', icon: 'check', value: fmtPct(c.ola), delta: deltaHtml(p ? deltaPP(c.ola, P.ola, 1, 'higher') : nobase(), vs),
        tip: 'Incidentes resolvidos dentro do OLA: Sev 0 ≤ ' + fmtHM(T.olaSev0) + ' e Sev 1 ≤ ' + fmtHM(T.olaSev1) + ' (TTR oficial).',
        split: splitCell('Sev 0 · ≤ ' + fmtHM(T.olaSev0), fmtPct(c.ola0), olaCls(c.ola0), dl(deltaPP, c.ola0, P.ola0, 1, 'higher')) + splitCell('Sev 1 · ≤ ' + fmtHM(T.olaSev1), fmtPct(c.ola1), olaCls(c.ola1), dl(deltaPP, c.ola1, P.ola1, 1, 'higher')),
        alert: isNum(c.ola) && c.ola < 80 }),
      kpiCard({ title: 'Detectados pela Monitoração', icon: 'radar', value: fmtPct(c.pMon, 0), delta: deltaHtml(p ? deltaPP(c.pMon, P.pMon, 1, 'higher') : nobase(), vs),
        tip: 'Origem da Detecção pelo Caller do ServiceNow: Monitoração (integrações), Experiências e End-users (pessoas).',
        split: splitCell('End-users', fmtPct(c.pEu, 0), isNum(c.pEu) && c.pEu >= 40 ? 'bad' : '', dl(deltaPP, c.pEu, P.pEu, 1, 'lower')) + splitCell('Experiências', fmtPct(c.pExp, 0), '', dl(deltaPP, c.pExp, P.pExp, 1, 'higher')),
        alert: isNum(c.pEu) && c.pEu >= 40 }),
      kpiCard({ title: 'Infraestrutura', icon: 'server', value: fmtPct(c.pInfra, 0) + '<small>' + c.lay.infra + ' ' + plural(c.lay.infra, 'incidente', 'incidentes') + '</small>', delta: deltaHtml(p ? deltaCount(c.lay.infra, P.lay.infra, 'lower') : nobase(), vs),
        tip: 'Camada do incidente (Aplicação x Infraestrutura) pelo Ofensor, Category/Grupo do ServiceNow e Tecnologia impactada. Ver regras na seção Aplicação x Infra.',
        split: splitCell('MTTR Aplicação', fmtHM(c.mttrLay.app)) + splitCell('MTTR Infra', fmtHM(c.mttrLay.infra)) }),
      kpiCard({ title: 'Causados por Mudança', icon: 'shuffle', value: fmtInt(c.chg) + '<small>' + fmtPct(c.pChg, 0) + '</small>', delta: deltaHtml(p ? deltaCount(c.chg, P.chg, 'lower') : nobase(), vs),
        split: splitCell('Deploy', c.list.filter(function (I) { return I.isChange && I.typeSm === 'DEPLOY'; }).length) + splitCell('Tradicional', c.list.filter(function (I) { return I.isChange && I.typeSm && I.typeSm !== 'DEPLOY'; }).length) }),
      kpiCard({ title: 'Problemas resolvidos', icon: 'search', value: fmtPct(pct(ps.resolved, ps.total), 0) + '<small>' + ps.resolved + ' de ' + ps.total + '</small>',
        tip: 'Problemas ligados aos incidentes do período com status Resolvido ou Fechado (MajorProblems / Problem_ServiceNow).',
        split: splitCell('Em RCA', ps.rca, ps.rca ? 'bad' : '') + splitCell('Em implementação', ps.fix),
        foot: isNum(ps.agingRes) ? 'Aging médio de resolução: ' + fmtNum(ps.agingRes, 0) + ' dias' : '' })
    ].join('');

    var od = M.olDisp, odp = M.olDispP;
    var dispBanner = '<div class="notice is-info" style="align-items:center">' + icon('gauge') + '<div style="display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center"><b>Disponibilidade O&amp;L</b>' +
      (isNum(od.cv) ? '<span class="num" style="font-size:18px;font-weight:700">' + fmtPct(od.cv, 2) + '</span>' + chip(od.status, true) +
        (hasRefs(od.refs) ? '<span class="legend">Meta ' + fmtPct(od.refs.meta, 2) + ' · Mínimo ' + fmtPct(od.refs.min, 2) + '</span>' : '') +
        deltaHtml(deltaPP(od.cv, odp.cv, 2, 'higher'), vsTxt()) + '<span class="legend">média simples de ' + od.n + ' ' + plural(od.n, 'mês apurado', 'meses apurados') + ' do período</span>'
        : '<span class="legend">sem meses apurados no período</span>') +
      '<a href="#sec-disp" class="legend" style="font-weight:700">ver por fluxo →</a></div></div>';

    var ins = buildInsights();
    var insHtml = '<div class="insights"><div class="eyebrow">' + icon('spark').replace('class="ico"', 'class="ico" style="width:14px;height:14px;vertical-align:-2px;margin-right:4px"') + 'Leitura executiva</div><ul>' + ins.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul></div>';

    var charts2 = '<div class="ox-split" style="margin-top:14px"><div class="panel"><div class="panel-head"><div class="sub-title">' + icon('chart') + 'Incidentes por mês e camada</div></div><div class="ox-chart"><canvas id="ox-ch-trend"></canvas></div>' +
      '<div class="legend" style="margin-top:6px">Barras = ' + esc(M.L.curShort) + ' por camada · linha = ' + esc(M.L.prevShort) + ' (mesma posição do mês). Clique numa barra para ver os incidentes do mês.</div></div>' +
      '<div class="panel"><div class="panel-head"><div class="sub-title">' + icon('clock') + 'MTTR mensal por Severidade (h)</div></div><div class="ox-chart"><canvas id="ox-ch-mttr"></canvas></div>' +
      '<div class="legend" style="margin-top:6px">Linhas pontilhadas = metas de MTTR (Sev 0 ' + fmtHM(T.mttrSev0) + ' · Sev 1 ' + fmtHM(T.mttrSev1) + ').</div></div></div>';

    $('sec-panorama').innerHTML = sectionHead('spark', 'Panorama · ' + esc(M.L.cur), 'O que aconteceu em O&amp;L no período',
      'Comparativo com o ' + esc(M.L.cmpName) + ' (' + esc(M.L.prev) + '). Clique nos cards de fluxo, localidade e nos rankings para ver os incidentes.',
      '<button type="button" class="btn btn-accent" data-action="open-all">' + icon('list') + 'Ver incidentes (' + c.n + ')</button>') +
      dispBanner + '<div class="ox-kpis" style="margin-top:12px">' + cards + '</div>' + insHtml + charts2;
    drawTrend();
    drawMttr();
  }

  function monthSeries(w, fn) { return w.months.map(function (x) { var mw = mkWin('m', '', '', [x], w.cut); return fn(select(mw), x); }); }
  function drawTrend() {
    var cv = $('ox-ch-trend');
    if (!cv || !window.Chart) return;
    var labels = M.w.months.map(function (x) { return MABBR[x.m - 1] + '/' + String(x.y).slice(2); });
    var app = monthSeries(M.w, function (l) { return l.filter(function (I) { return I.layer === 'app'; }).length; });
    var inf = monthSeries(M.w, function (l) { return l.filter(function (I) { return I.layer === 'infra'; }).length; });
    var prv = M.prev ? monthSeries(M.cw, function (l) { return l.length; }) : null;
    var ds = [];
    if (state.layer !== 'infra') ds.push({ type: 'bar', label: 'Aplicação', data: app, backgroundColor: '#466E85', stack: 's', borderRadius: 2, maxBarThickness: 38, order: 2 });
    if (state.layer !== 'app') ds.push({ type: 'bar', label: 'Infraestrutura', data: inf, backgroundColor: '#FE772C', stack: 's', borderRadius: 2, maxBarThickness: 38, order: 2 });
    if (prv) ds.push({ type: 'line', label: M.L.prevShort, data: prv, borderColor: '#8E9A84', backgroundColor: '#8E9A84', borderWidth: 2, pointRadius: 3, tension: 0.25, order: 1, datalabels: { display: false } });
    charts.trend = new Chart(cv, {
      type: 'bar', data: { labels: labels, datasets: ds },
      options: {
        responsive: true, maintainAspectRatio: false,
        onClick: function (e, els) { if (!els.length) return; var x = M.w.months[els[0].index]; openModal({ title: 'Incidentes de ' + MONTHS[x.m - 1] + '/' + x.y, eyebrow: 'Panorama', icon: 'calendar', list: select(mkWin('m', '', '', [x], M.w.cut)) }); },
        plugins: {
          legend: { position: 'top', align: 'end', labels: { boxWidth: 10, boxHeight: 10, font: { size: 11 } } },
          datalabels: { display: function (ctx) { return ctx.dataset.type !== 'line' && ctx.dataset.data[ctx.dataIndex] > 0; }, color: '#fff', font: { size: 10, weight: '700' } },
          tooltip: { mode: 'index', intersect: false }
        },
        scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, beginAtZero: true, grace: '10%', ticks: { precision: 0 }, grid: { color: 'rgba(51,61,32,.08)' } } }
      }
    });
  }
  function drawMttr() {
    var cv = $('ox-ch-mttr');
    if (!cv || !window.Chart) return;
    var labels = M.w.months.map(function (x) { return MABBR[x.m - 1] + '/' + String(x.y).slice(2); });
    var h = function (v) { return isNum(v) ? Math.round(v / 6) / 10 : null; };
    var s0 = monthSeries(M.w, function (l) { return h(stats(l).mttr0); }), s1 = monthSeries(M.w, function (l) { return h(stats(l).mttr1); });
    charts.mttr = new Chart(cv, {
      type: 'line',
      data: { labels: labels, datasets: [
        { label: 'Sev 0', data: s0, borderColor: '#691B34', backgroundColor: '#691B34', borderWidth: 2, pointRadius: 3.5, spanGaps: true, tension: 0.2 },
        { label: 'Sev 1', data: s1, borderColor: '#FF6D00', backgroundColor: '#FF6D00', borderWidth: 2, pointRadius: 3.5, spanGaps: true, tension: 0.2 },
        { label: 'Meta Sev 0', data: labels.map(function () { return T.mttrSev0 / 60; }), borderColor: 'rgba(105,27,52,.55)', borderDash: [3, 4], borderWidth: 1.5, pointRadius: 0 },
        { label: 'Meta Sev 1', data: labels.map(function () { return T.mttrSev1 / 60; }), borderColor: 'rgba(255,109,0,.6)', borderDash: [3, 4], borderWidth: 1.5, pointRadius: 0 }
      ] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'top', align: 'end', labels: { boxWidth: 10, boxHeight: 10, font: { size: 11 } } },
          tooltip: { callbacks: { label: function (ctx) { var v = ctx.parsed.y; return ctx.dataset.label + ': ' + (isNum(v) ? fmtHM(v * 60) : '—'); } } },
          datalabels: { display: function (ctx) { return ctx.datasetIndex < 2 && isNum(ctx.dataset.data[ctx.dataIndex]); }, align: function (ctx) { return ctx.datasetIndex === 0 ? 'bottom' : 'top'; }, offset: 2, font: { size: 9.5, weight: '700' }, color: function (ctx) { return ctx.datasetIndex === 0 ? '#691B34' : '#9A3F0B'; }, formatter: function (v) { return fmtHM(v * 60); } }
        },
        scales: { x: { grid: { display: false } }, y: { beginAtZero: true, grace: '15%', grid: { color: 'rgba(51,61,32,.08)' }, ticks: { callback: function (v) { return v + 'h'; } } } }
      }
    });
  }

  /* -------------------------------------------------------- Leitura executiva */
  function topOf(list, keyFn, n) {
    var m = countBy(list, keyFn);
    return Object.keys(m).map(function (k) { return { k: k, list: m[k], n: m[k].length }; }).sort(function (a, b) { return b.n - a.n || a.k.localeCompare(b.k); }).slice(0, n || 5);
  }
  function buildInsights() {
    var c = M.sCur, p = M.sPrev, out = [], vs = M.L.prevShort;
    if (!c.n) return ['Nenhum incidente de O&amp;L de origem Tecnologia em ' + esc(M.L.cur) + '.'];
    var dl = p ? deltaCount(c.n, p.n, 'lower') : null;
    out.push('<b>' + c.n + ' ' + plural(c.n, 'incidente', 'incidentes') + '</b> em ' + esc(M.L.cur) + ' (' + c.sev0 + ' Sev 0 · ' + c.sev1 + ' Sev 1)' +
      (dl && dl.cls !== 'nobase' ? ', ' + (dl.d === 0 ? 'estável' : (dl.d < 0 ? 'redução de ' : 'aumento de ') + fmtInt(Math.abs(dl.d)) + (p.n ? ' (' + fmtSigned(dl.d / p.n * 100, 0) + '%)' : '')) + ' vs ' + esc(vs) + ' (' + p.n + ')' : '') + '.');
    // concentração por fluxo
    var fl = M.flows.filter(function (f) { return f.s.n; }).sort(function (a, b) { return b.s.n - a.s.n; });
    if (fl.length) out.push('<b>' + esc(fl[0].cfg.short) + '</b> concentra ' + fl[0].s.n + ' ' + plural(fl[0].s.n, 'incidente', 'incidentes') + ' (' + fmtPct(pct(fl[0].s.n, c.n), 0) + ' do total)' + (fl[1] ? '; em seguida ' + esc(fl[1].cfg.short) + ' (' + fl[1].s.n + ')' : '') + '.');
    // hotspot de localidade
    var ents = topOf(c.list, KEYS.ent, 3);
    if (ents.length && ents[0].n >= 2) out.push('Localidade/sistema mais impactado: <b>' + esc(ents[0].k) + '</b> com ' + ents[0].n + ' incidentes' + (ents[1] ? ', depois ' + esc(ents[1].k) + ' (' + ents[1].n + ')' : '') + '.');
    // pareto de tecnologias
    var tec = topOf(c.list, KEYS.tec, 50);
    if (tec.length >= 3) {
      var t3 = {}; tec.slice(0, 3).forEach(function (t) { t.list.forEach(function (I) { t3[I.id] = true; }); });
      out.push('Top 3 tecnologias impactadas (<b>' + esc(tec.slice(0, 3).map(function (t) { return t.k; }).join(', ')) + '</b>) respondem por ' + fmtPct(pct(Object.keys(t3).length, c.n), 0) + ' dos incidentes.');
    }
    // camada
    if (c.lay.infra) out.push('<b>Infraestrutura</b>: ' + c.lay.infra + ' ' + plural(c.lay.infra, 'incidente', 'incidentes') + ' (' + fmtPct(c.pInfra, 0) + ') impactaram as aplicações de O&amp;L, com MTTR ' + fmtHM(c.mttrLay.infra) + ' vs ' + fmtHM(c.mttrLay.app) + ' em Aplicação' + (p ? ' (' + p.lay.infra + ' no comparativo)' : '') + '.');
    else out.push('Nenhum incidente classificado como Infraestrutura no período: todos os ' + c.n + ' são de camada de Aplicação.');
    // MTTR
    var m1 = isNum(c.mttr1) && c.mttr1 > T.mttrSev1, m0 = isNum(c.mttr0) && c.mttr0 > T.mttrSev0;
    if (m0 || m1) out.push('MTTR acima da meta em ' + [m0 ? 'Sev 0 (' + fmtHM(c.mttr0) + ' vs ' + fmtHM(T.mttrSev0) + ')' : '', m1 ? 'Sev 1 (' + fmtHM(c.mttr1) + ' vs ' + fmtHM(T.mttrSev1) + ')' : ''].filter(Boolean).join(' e ') +
      (c.out0 + c.out1 ? '; ' + (c.out0 + c.out1) + ' ' + plural(c.out0 + c.out1, 'outlier concentra', 'outliers concentram') + ' ' + fmtPct(c.outShare, 0) + ' das horas de TTR' : '') + '.');
    else if (isNum(c.mttr)) out.push('MTTR dentro das metas de Severidade (Sev 0 ' + fmtHM(c.mttr0) + ' · Sev 1 ' + fmtHM(c.mttr1) + ').');
    // OLA
    if (isNum(c.ola)) out.push('OLA de resolução em <b>' + fmtPct(c.ola) + '</b> (Sev 0 ' + fmtPct(c.ola0) + ' · Sev 1 ' + fmtPct(c.ola1) + ')' + (p && isNum(p.ola) ? ', ' + fmtSigned(c.ola - p.ola, 1) + ' p.p. vs ' + esc(vs) : '') + '.');
    // detecção
    if (isNum(c.pEu)) out.push('<b>' + fmtPct(c.pEu, 0) + '</b> dos incidentes foram reportados por End-users e ' + fmtPct(c.pMon, 0) + ' detectados pela Monitoração' + (isNum(c.mttrOrg.eu) && isNum(c.mttrOrg.mon) ? ' (MTTR ' + fmtHM(c.mttrOrg.eu) + ' x ' + fmtHM(c.mttrOrg.mon) + ')' : '') + '.');
    // mudança
    if (c.chg) out.push('<b>' + c.chg + '</b> ' + plural(c.chg, 'incidente causado', 'incidentes causados') + ' por Mudança (' + fmtPct(c.pChg, 0) + ')' + (p ? ', vs ' + p.chg + ' no comparativo' : '') + '.');
    // problemas
    var ps = prbSummary(M.problems);
    if (ps.total) out.push('<b>' + ps.total + ' ' + plural(ps.total, 'Problema', 'Problemas') + '</b> ligados aos incidentes do período: ' + fmtPct(pct(ps.resolved, ps.total), 0) + ' resolvidos, ' + ps.rca + ' em RCA e ' + ps.fix + ' em implementação' + (isNum(ps.agingRes) ? ' (aging médio de resolução de ' + fmtNum(ps.agingRes, 0) + ' dias)' : '') + '.');
    // reincidência
    var rec = tec.filter(function (t) { return t.n >= 2; });
    if (rec.length) out.push(rec.length + ' ' + plural(rec.length, 'tecnologia teve', 'tecnologias tiveram') + ' 2 ou mais incidentes no período; a mais recorrente foi <b>' + esc(rec[0].k) + '</b> (' + rec[0].n + ').');
    // disponibilidade
    var bad = M.flows.filter(function (f) { return f.disp && f.disp.status && f.disp.status.key === 'atencao'; });
    if (bad.length) out.push('Disponibilidade abaixo do Mínimo no período em: <b>' + esc(bad.map(function (f) { return f.cfg.short; }).join(', ')) + '</b>.');
    return out;
  }

  /* ------------------------------------------------- Aplicação x Infraestrutura */
  function layerPanel(layer, list, prevList) {
    var s = stats(list), sp = prevList ? stats(prevList) : null;
    var tops = topOf(list, KEYS.ofe, 5), tecs = topOf(list, KEYS.tec, 5), locs = topOf(list, KEYS.ent, 5);
    var max = function (a) { return a.length ? a[0].n : 1; };
    return '<div class="panel"><div class="panel-head"><div class="sub-title">' + layerTag(layer) + '</div><button type="button" class="btn" data-action="open-layer" data-layer="' + layer + '">' + icon('list') + 'Ver (' + s.n + ')</button></div>' +
      '<div class="ox-strip c4">' +
      '<div><div class="legend">Incidentes</div><div class="v">' + s.n + ' <small>' + fmtPct(pct(s.n, M.sAll.n), 0) + '</small></div>' + deltaHtml(sp ? deltaCount(s.n, sp.n, 'lower') : nobase(), vsTxt()) + '</div>' +
      '<div><div class="legend">Sev 0 · Sev 1</div><div class="v">' + s.sev0 + ' · ' + s.sev1 + '</div></div>' +
      '<div><div class="legend">MTTR</div><div class="v">' + fmtHM(s.mttr) + '</div>' + deltaHtml(sp ? deltaMin(s.mttr, sp.mttr) : nobase()) + '</div>' +

  function engagementData(type) {
    var seen = {}, back = {}, res = {}, cover = {}, inWin = {}, base = 0;
    M.cur.forEach(function (I) { inWin[I.id] = true; if ((I.prbs || []).length) base++; });
    M.problems.forEach(function (p) {
      (p.tasks || []).forEach(function (t) {
        var tt = fold(t.taskType), k;
        if (t.src === 'RCATask_List') k = tt === 'root cause analysis' ? 'rca' : (tt.indexOf('implement') !== -1 ? 'implementation' : '');
        else k = t.type === 'RCA' ? 'rca' : 'implementation';
        if (k !== type || !t.num || seen[t.num]) return;
        seen[t.num] = true;
        var end = t.closed && isNum(t.closedAt) ? t.closedAt : D.today;
        var aging = isNum(t.opened) ? Math.max(0, Math.floor((end - t.opened) / 86400000)) : 0;
        var bucket = t.closed ? res : back, g = t.group || 'N/A';
        var e = bucket[g] = bucket[g] || { name: g, count: 0, total: 0, incs: {} };
        e.count++; e.total += aging;
        p.incidents.forEach(function (id) { if (inWin[id]) e.incs[id] = true; });
        if (t.closed && type === 'rca') { cover[g] = cover[g] || {}; p.incidents.forEach(function (id) { if (inWin[id]) cover[g][id] = true; }); }

      }).sort(function (a, b) { return b.count - a.count; });

  /* ------------------------------------------------------------ Disponibilidade */
  function heatRow(name, nodeFor, lv, cls) {
    var dw = dispWindow(nodeFor, M.w), dp = dispWindow(nodeFor, M.cw);
    if (!dw.cells.some(function (c) { return isNum(c.v); }) && !isNum(dp.cv)) return '';
    var cells = dw.cells.map(function (c) {
      if (c.st === 'NAO_INICIADO' || !isNum(c.v)) return '<td class="c st-none">—</td>';
      var st = statusOf(c.v, c.refs || dw.refs);
      return '<td class="c st-' + st.key + (c.st === 'PARCIAL' ? ' is-partial' : '') + '" data-tip="' + esc(MONTHS[c.m - 1] + '/' + c.y + ': ' + fmtPct(c.v, 2) + ' · ' + st.label + (c.st === 'PARCIAL' ? ' (apuração parcial)' : '')) + '">' + fmtNum(c.v, 2) + '</td>';
    }).join('');
    return '<tr class="' + (lv ? 'lv1' : '') + (cls ? ' ' + cls : '') + '"><td class="nm">' + esc(name) + '</td>' + cells +
      '<td class="c st-' + dw.status.key + '">' + (isNum(dw.cv) ? fmtNum(dw.cv, 2) : '—') + '</td><td class="c">' + (isNum(dp.cv) ? fmtNum(dp.cv, 2) : '—') + '</td><td class="n">' + deltaHtml(deltaPP(dw.cv, dp.cv, 2, 'higher')) + '</td>' +
      '<td class="n">' + (hasRefs(dw.refs) ? fmtNum(dw.refs.meta, 2) : '—') + '</td></tr>';
  }
  function renderDisp() {

    var body = heatRow('O&L (total)', dispOlNode, 0, 'total');
    M.flows.forEach(function (f) {
      body += heatRow(f.cfg.short, function (y) { return dispFlowNode(y, f.cfg.key); }, 0);
      var node = dispFlowNode(D.year, f.cfg.key);
      (node && node.children || []).forEach(function (ch) {
        body += heatRow(ch.name, function (y) { return findDesc(dispFlowNode(y, f.cfg.key), [ch.name]); }, 1);
      });
    });
    var has = !!body;
    // incidentes que mais consumiram disponibilidade (apuração)
    var byInc = {};
    M.w.months.forEach(function (x) {
      var yd = ydOf(x.y), ap = yd && yd.apuracao;
      if (!ap || !ap.found) return;
      ap.rows.forEach(function (r) { if (r.m !== x.m || !r.isInc) return; var e = byInc[r.inc] = byInc[r.inc] || { inc: r.inc, min: 0, flows: {}, servs: {} }; e.min += r.min; if (r.flow) e.flows[r.flow] = true; if (r.serv) e.servs[r.serv] = true; });
    });
    var top = Object.keys(byInc).map(function (k) { return byInc[k]; }).sort(function (a, b) { return b.min - a.min; }).slice(0, 10);
    var totalMin = sum(Object.keys(byInc).map(function (k) { return byInc[k].min; }));
    var flowLbl = function (k) { var f = D.config.flows.find(function (x) { return x.key === k; }); return f ? f.short : k; };
    var topTbl = top.length ? '<div class="ox-tbl-wrap"><table class="ox-tbl"><thead><tr><th>Incidente</th><th class="n">Minutos apurados</th><th class="n">% do período</th><th>Fluxo(s)</th><th>Serviço(s)</th><th>Tecnologia · ofensor</th></tr></thead><tbody>' +

          '<td>' + esc(Object.keys(e.flows).map(flowLbl).join(', ')) + '</td><td><div class="desc">' + esc(Object.keys(e.servs).slice(0, 4).join(', ')) + '</div></td><td>' + (I ? esc(I.tImpMain + ' · ' + I.ofe) + ' ' + layerTag(I.layer) : '<span class="muted">fora da base de O&amp;L/Tecnologia</span>') + '</td></tr>';
      }).join('') + '</tbody></table></div>' : '<div class="empty">Sem minutos de indisponibilidade apurados (aba apuracao) no período.</div>';
    $('sec-disp').innerHTML = sectionHead('gauge', 'Indicador oficial', 'Disponibilidade por fluxo e país',
      'Resultado mensal da aba Disponibilidade com o status vs Mínimo/Meta/Desafio. "Período" = média simples dos meses apurados (meses em apuração parcial aparecem hachurados e não entram na média).') +
      (has ? '<div class="ox-tbl-wrap"><table class="ox-tbl ox-heat"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>' : '<div class="empty">Aba de Disponibilidade não encontrada ou sem O&amp;L para o período.</div>') +
      '<div class="panel" style="margin-top:14px"><div class="panel-head"><div class="sub-title">' + icon('clock') + 'Incidentes que mais consumiram disponibilidade</div></div>' + topTbl +
      '<div class="ox-note">Minutos apurados por incidente na aba apuracao (marca Natura, Stream O&amp;L/Planejamento Logístico), somando todos os países e serviços. Total do período: ' + fmtInt(totalMin) + ' min.</div></div>';
  }

  /* ---------------------------------------------- Oportunidades & próximos passos */
  function buildOpportunities() {
    var c = M.sCur, p = M.sPrev, list = M.cur, ops = [];
    var push = function (o) { o.id = o.rule + ':' + fold(o.subject || '').replace(/[^a-z0-9]+/g, '-'); ops.push(o); };
    if (!c.n) return ops;
    // 1. Monitoração
    if (isNum(c.pEu) && c.pEu >= 30) {
      var eu = topOf(list.filter(function (I) { return I.ok === 'eu'; }), KEYS.tec, 3);
      push({ rule: 'mon', subject: 'monitoracao', prio: c.pEu >= 50 ? 'alta' : 'media', front: 'Monitoração', title: 'Ampliar a detecção pela Monitoração',
        ev: '<b>' + fmtPct(c.pEu, 0) + '</b> dos incidentes (' + c.org.eu + ') foram reportados por End-users; só ' + fmtPct(c.pMon, 0) + ' vieram da Monitoração.' + (eu.length ? ' Principais tecnologias: ' + esc(eu.map(function (t) { return t.k + ' (' + t.n + ')'; }).join(', ')) + '.' : ''),
        action: 'Mapear alertas faltantes (sintéticos, filas, jobs e integrações) para essas tecnologias e acompanhar a meta de detecção pela Monitoração por fluxo.',
        ids: list.filter(function (I) { return I.ok === 'eu'; }).map(function (I) { return I.id; }) });
    }
    // 2. Infraestrutura
    var infra = list.filter(function (I) { return I.layer === 'infra'; });
    if (infra.length >= 2) {
      var io = topOf(infra, KEYS.ofe, 3), ie = topOf(infra, KEYS.ent, 3);
      push({ rule: 'infra', subject: 'infra', prio: pct(infra.length, c.n) >= 25 ? 'alta' : 'media', front: 'Infraestrutura', title: 'Plano conjunto com Infraestrutura para as aplicações de O&L',
        ev: '<b>' + infra.length + '</b> incidentes de infraestrutura (' + fmtPct(pct(infra.length, c.n), 0) + '), MTTR ' + fmtHM(stats(infra).mttr) + '. Ofensores: ' + esc(io.map(function (t) { return t.k + ' (' + t.n + ')'; }).join(', ')) + (ie.length ? '. Localidades / sistemas: ' + esc(ie.map(function (t) { return t.k + ' (' + t.n + ')'; }).join(', ')) : '') + '.',
        action: 'Revisar redundância (link, energia, rede local) nas localidades citadas e acordar com Infraestrutura o tempo de acionamento e comunicação quando a falha impactar as aplicações de O&L.',
        ids: infra.map(function (I) { return I.id; }) });
    }
    // 3. Reincidência sem Problem
    clusters(list, KEYS.tec, 2).filter(function (cl) { return cl.noPrb > 0; }).slice(0, 3).forEach(function (cl) {
      push({ rule: 'rec', subject: cl.k, prio: cl.n >= 3 ? 'alta' : 'media', front: 'Problemas', title: 'Tratar a recorrência em ' + cl.k,
        ev: '<b>' + cl.n + '</b> incidentes com ' + esc(cl.k) + ' no período (intervalo médio de ' + (isNum(cl.gap) ? fmtNum(cl.gap, 0) + ' dias' : '—') + '); ' + cl.noPrb + ' sem Problem associado.',
        action: 'Abrir (ou vincular) Problema com RCA para a recorrência e definir solução definitiva com o time da aplicação.',
        ids: cl.list.map(function (I) { return I.id; }) });
    });
    // 4. MTTR acima da meta
    [[0, c.mttr0, T.mttrSev0, c.mttrSO0, T.mttrSemOutliersSev0], [1, c.mttr1, T.mttrSev1, c.mttrSO1, T.mttrSemOutliersSev1]].forEach(function (x) {
      if (!(isNum(x[1]) && x[1] > x[2])) return;
      var worst = M.flows.filter(function (f) { return isNum(f.s['mttr' + x[0]]); }).sort(function (a, b) { return b.s['mttr' + x[0]] - a.s['mttr' + x[0]]; })[0];
      var tail = isNum(x[3]) && x[3] <= x[4];
      push({ rule: 'mttr', subject: 'sev' + x[0], prio: 'alta', front: 'Restauração', title: 'Reduzir o MTTR de Sev ' + x[0],
        ev: 'MTTR Sev ' + x[0] + ' em <b>' + fmtHM(x[1]) + '</b> (meta ' + fmtHM(x[2]) + ')' + (worst ? '; pior fluxo: ' + esc(worst.cfg.short) + ' (' + fmtHM(worst.s['mttr' + x[0]]) + ')' : '') + '. Sem outliers: ' + fmtHM(x[3]) + (tail ? ' — dentro da meta, ou seja, o desvio vem de poucos incidentes longos.' : '.'),
        action: tail ? 'Revisar os outliers (acionamento, escalonamento e fornecedor) com post-mortem e gatilhos de escalonamento por tempo.' : 'Revisar runbooks, acionamento e escalonamento dos times de aplicação do fluxo; medir MTTA/MTTR por grupo resolvedor.',
        ids: list.filter(function (I) { return I.sevN === x[0]; }).map(function (I) { return I.id; }) });
    });
    // 5. OLA
    if (isNum(c.ola) && c.ola < 80) push({ rule: 'ola', subject: 'ola', prio: c.ola < 60 ? 'alta' : 'media', front: 'Restauração', title: 'Recuperar a aderência ao OLA de resolução',
      ev: 'OLA de resolução em <b>' + fmtPct(c.ola) + '</b> (Sev 0 ' + fmtPct(c.ola0) + ' · Sev 1 ' + fmtPct(c.ola1) + ')' + (p && isNum(p.ola) ? ', vs ' + fmtPct(p.ola) + ' no comparativo' : '') + '.',
      action: 'Acompanhar semanalmente os incidentes fora do OLA por fluxo e grupo resolvedor e tratar as causas de atraso (dependência de fornecedor, acesso, diagnóstico).',
      ids: list.filter(function (I) { return I.olaOk === false; }).map(function (I) { return I.id; }) });
    // 6. Mudança
    var chg = list.filter(function (I) { return I.isChange; });
    if (chg.length >= 2 || pct(chg.length, c.n) >= 15) {
      var g = topOf(chg, function (I) { return [(I.chgObj && I.chgObj.group) || '']; }, 2);
      push({ rule: 'chg', subject: 'mudanca', prio: pct(chg.length, c.n) >= 20 ? 'alta' : 'media', front: 'Mudanças', title: 'Reduzir incidentes causados por Mudança',
        ev: '<b>' + chg.length + '</b> incidentes causados por Mudança (' + fmtPct(pct(chg.length, c.n), 0) + ')' + (g.length ? '; grupos: ' + esc(g.map(function (t) { return t.k + ' (' + t.n + ')'; }).join(', ')) : '') + '.',
        action: 'Reforçar testes em não-produção, plano de rollback e janelas fora do pico da operação (expedição/faturamento) para as SMs que afetam O&L.',
        ids: chg.map(function (I) { return I.id; }) });
    }
    // 7. Planos de ação vencidos
    var od = [];
    M.problems.forEach(function (pp) { (pp.tasks || []).forEach(function (t) { if (t.type === 'IMP' && !t.closed && isNum(t.due) && t.due < D.today) od.push({ t: t, p: pp }); }); });
    if (od.length) push({ rule: 'acts', subject: 'vencidas', prio: 'alta', front: 'Problemas', title: 'Cobrar os planos de ação vencidos',
      ev: '<b>' + od.length + '</b> ' + plural(od.length, 'ação vencida', 'ações vencidas') + ' em Problemas ligados aos incidentes do período (grupos: ' + esc(uniq(od.map(function (x) { return x.t.group; })).slice(0, 4).join(', ')) + ').',
      action: 'Revisar prazos com os grupos responsáveis e registrar o novo compromisso (ou risco aceito) no ServiceNow.',
      ids: uniq([].concat.apply([], od.map(function (x) { return x.p.incidents; }))) });
    // 8. RCA envelhecido
    var oldRca = M.problems.filter(function (pp) { return prbStatus(pp) === 'rca' && (prbAging(pp) || 0) > 30; });
    if (oldRca.length) push({ rule: 'rca', subject: 'aging', prio: oldRca.length >= 3 ? 'alta' : 'media', front: 'Problemas', title: 'Acelerar os RCAs em aberto há mais de 30 dias',
      ev: '<b>' + oldRca.length + '</b> ' + plural(oldRca.length, 'Problema', 'Problemas') + ' em RCA há mais de 30 dias (' + esc(oldRca.slice(0, 4).map(function (pp) { return pp.id; }).join(', ')) + ').',
      action: 'Definir dono e data para conclusão do RCA e, quando necessário, envolver fornecedor/infra.',
      ids: uniq([].concat.apply([], oldRca.map(function (pp) { return pp.incidents; }))) });
    // 9. Incidentes Sev 0 sem Problem
    var s0np = list.filter(function (I) { return I.sevN === 0 && !(I.prbs || []).length; });
    if (s0np.length) push({ rule: 'noprb', subject: 'sev0', prio: 'alta', front: 'Problemas', title: 'Garantir Problem para todo Sev 0',
      ev: '<b>' + s0np.length + '</b> ' + plural(s0np.length, 'incidente Sev 0 sem', 'incidentes Sev 0 sem') + ' Problem associado (' + esc(s0np.slice(0, 4).map(function (I) { return I.id; }).join(', ')) + ').',
      action: 'Abrir o Problema e a RCA para cada Sev 0 de O&L e acompanhar até o plano de ação.', ids: s0np.map(function (I) { return I.id; }) });
    // 10. Hotspot de localidade
    var hot = topOf(list, function (I) { return I.rows.filter(function (r) { return rowOk(r) && r.entKind !== 'sistema'; }).map(function (r) { return r.entName; }); }, 1)[0];
    if (hot && hot.n >= 3) {

  function onSeg(segEl, v) {
    var id = segEl.id;
    if (id === 'ox-cmp') { if (state.cmp === v) return; state.cmp = v; setSegActive(segEl, v); rerender(); }
    else if (id === 'ox-layer') { if (state.layer === v) return; state.layer = v; setSegActive(segEl, v); rerender(); }
    else if (id === 'ox-card') { if (state.card === v) return; state.card = v; setSegActive(segEl, v); rerender(); }
    else if (id === 'ox-rank') { state.rank = v; if (charts.pareto) { charts.pareto.destroy(); charts.pareto = null; } renderTecnologias(); }
    else if (id === 'ox-modal-year') { state.modal.which = v; renderModal(); }
    else if (id === 'ox-eng-type') { state.eng.type = v; setSegActive(segEl, v); renderEngagement(); }
    else if (id === 'ox-eng-sort') { state.eng.sort = v; renderEngagement(); }
  }
  function setSegActive(segEl, v) { Array.prototype.forEach.call(segEl.querySelectorAll('button'), function (b) { b.classList.toggle('is-active', b.getAttribute('data-v') === v); }); }
  function onKey(ev) {
    if (ev.key === 'Escape' && state.modal) { closeModal(); return; }
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.getAttribute && ev.target.getAttribute('role') === 'button' && ev.target.hasAttribute('data-action')) { ev.preventDefault(); ev.target.click(); }
  }
  function onEngTeam(ev) {
    var t = ev.target;
    if (!t || !t.getAttribute || t.getAttribute('data-eng') !== 'team') return;
    var v = String(t.value || '').trim();
    var opts = Array.prototype.map.call(document.querySelectorAll('#ox-eng-teams option'), function (o) { return o.value; });
    var hit = opts.find(function (o) { return o === v; }) || opts.find(function (o) { return fold(o) === fold(v); });
    if (hit && state.eng.teams.indexOf(hit) === -1) state.eng.teams.push(hit);
    t.value = '';
    renderEngagement();
  }
  var baseTimer = null;
  function onBaseFilter(ev) {
    var t = ev.target, k = t && t.getAttribute && t.getAttribute('data-bf');
    if (!k) return;
    state.base[k] = t.value;
    clearTimeout(baseTimer);
    baseTimer = setTimeout(function () {
      var list = baseFiltered();
      $('ox-base-table').innerHTML = incTable(list);
      var sub = document.querySelector('#sec-base .sec-head .sub');
      if (sub) sub.textContent = list.length + ' de ' + M.cur.length + ' incidentes de ' + M.L.cur + ' (filtro de camada do topo aplicado).';
    }, k === 'q' ? 220 : 0);
  }

  var tipEl = null;
  function onOver(ev) {
    var t = ev.target.closest('[data-tip]');
    if (!t) return;
    tipEl = tipEl || $('ox-tooltip');
    tipEl.textContent = t.getAttribute('data-tip');
    tipEl.hidden = false;
    var r = t.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    var x = Math.min(window.innerWidth - w - 8, Math.max(8, r.left + r.width / 2 - w / 2)), y = r.top - h - 8;
    if (y < 8) y = r.bottom + 8;
    tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
  }
  function onOut(ev) { var t = ev.target.closest('[data-tip]'); if (!t || (ev.relatedTarget && t.contains(ev.relatedTarget))) return; if (tipEl) tipEl.hidden = true; }

  var spy = null;
  function setupScrollSpy() {
    if (spy || !('IntersectionObserver' in window)) return;
    var links = Array.prototype.slice.call(document.querySelectorAll('#ox-nav a'));
    spy = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { if (en.isIntersecting) links.forEach(function (l) { l.classList.toggle('is-active', l.getAttribute('data-sec') === en.target.id); }); });
    }, { rootMargin: '-150px 0px -60% 0px' });
    links.forEach(function (l) { var s = $(l.getAttribute('data-sec')); if (s) spy.observe(s); });
  }
  function destroyCharts() { Object.keys(charts).forEach(function (k) { if (charts[k]) charts[k].destroy(); charts[k] = null; }); }

  /* ------------------------------------------------------------------ carga */
  function setLoading(on) { $('ox-loading').hidden = !on; }
  function showError(msg) {
    setLoading(false);
    var box = $('ox-error');
    box.hidden = false;
    box.innerHTML = '<div class="error-box"><div class="sub-title" style="color:#691B34">' + icon('alert') + 'Não foi possível carregar a análise de O&amp;L</div><p>' + esc(msg) + '</p><button type="button" class="btn btn-accent" id="ox-retry">Tentar novamente</button></div>';
    $('ox-retry').onclick = function () { box.hidden = true; load(state.year); };
  }
  function fillPeriods() {
    var ps = $('ox-period'), list = periodDefs(), groups = {}, order = [];
    if (!list.find(function (w) { return w.key === state.periodKey; })) state.periodKey = list[0].key;
    list.forEach(function (w) { if (!groups[w.group]) { groups[w.group] = []; order.push(w.group); } groups[w.group].push(w); });
    ps.innerHTML = order.map(function (g) { return '<optgroup label="' + esc(g) + '">' + groups[g].map(function (w) { return '<option value="' + w.key + '"' + (w.key === state.periodKey ? ' selected' : '') + '>' + esc(w.label + ' · ' + w.range) + '</option>'; }).join('') + '</optgroup>'; }).join('');
    ps.disabled = false;
  }
  function onData(res) {
    setLoading(false);
    if (!res || !res.ok) { showError((res && res.error) || 'Resposta vazia do servidor.'); return; }
    CACHE[res.year] = res;
    D = res;
    state.year = res.year;
    prepare();
    fillPeriods();
    $('ox-error').hidden = true;
    renderAll();
    setupScrollSpy();
  }
  function load(year) {
    if (year && CACHE[year]) { onData(CACHE[year]); return; }
    setLoading(true);
    if (!(window.google && google.script && google.script.run)) { showError('google.script.run indisponível (abra pela URL do Web App).'); return; }
    google.script.run.withSuccessHandler(onData).withFailureHandler(function (e) { showError(e && e.message ? e.message : String(e)); }).getOLAnaliseData(year || null);
  }
  function init() {
    if (window.Chart && window.ChartDataLabels) { Chart.register(window.ChartDataLabels); Chart.defaults.set('plugins.datalabels', { display: false }); }
    if (window.Chart) { Chart.defaults.font.family = "'Aptos', 'Segoe UI', system-ui, sans-serif"; Chart.defaults.color = '#333D20'; }
    Array.prototype.forEach.call(document.querySelectorAll('#ox-nav a'), function (a) {
      a.insertAdjacentHTML('afterbegin', icon(a.getAttribute('data-icon')));
      a.addEventListener('click', function (ev) { ev.preventDefault(); var s = $(a.getAttribute('data-sec')); if (s) { if (window.olScrollTo) window.olScrollTo(s); else s.scrollIntoView(); } });
    });
    var portal = $('ox-portal-link'); if (portal) portal.href = BASE_URL || '#';
    var ol = $('ox-ol-link'); if (ol) ol.href = BASE_URL ? BASE_URL + '?view=ol' : '#';
    document.addEventListener('click', onClick);
    document.addEventListener('keydown', onKey);
    document.addEventListener('change', function (ev) { onActInput(ev); onBaseFilter(ev); onEngTeam(ev); });
    document.addEventListener('input', function (ev) { var t = ev.target; if (t && t.getAttribute && (t.getAttribute('data-act') === 'owner' || t.getAttribute('data-act') === 'note')) onActInput(ev); if (t && t.getAttribute && t.getAttribute('data-bf') === 'q') onBaseFilter(ev); });
    document.addEventListener('mouseover', onOver);
    document.addEventListener('mouseout', onOut);
    window.addEventListener('scroll', function () { if (tipEl) tipEl.hidden = true; }, { passive: true });
    $('ox-period').addEventListener('change', function () { state.periodKey = this.value; rerender(); });
    load(null);
  }

  window.OLX_DEBUG = { getState: function () { return state; }, getModel: function () { return M; }, getData: function () { return D; } };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>

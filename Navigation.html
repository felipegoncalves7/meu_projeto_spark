<script>
/* Navegação entre as Visões (Portal, Geral, O&L) sem sair do quadro: funciona no Google Sites e na URL direta do Web App.
   Links com data-nav="portal|geral|ol" trocam o documento do próprio quadro; se algo falhar, abre a URL do Web App. */
(function () {
  // Sem trava global: document.open() descarta os listeners, então cada Visão registra os seus.
  function overlay(on, msg) {
    var el = document.getElementById('nav-overlay');
    if (!on) { if (el) el.remove(); return; }
    if (!el) {
      el = document.createElement('div');
      el.id = 'nav-overlay';
      el.setAttribute('role', 'status');
      el.style.cssText = 'position:fixed;inset:0;z-index:2147483000;background:rgba(246,247,245,.88);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;font:600 13px system-ui,-apple-system,Segoe UI,sans-serif;color:#333D20';
      el.innerHTML = '<div style="width:34px;height:34px;border-radius:50%;border:3px solid rgba(51,61,32,.14);border-top-color:#FF6D00;animation:navspin 1s linear infinite"></div><div id="nav-overlay-msg"></div><style>@keyframes navspin{to{transform:rotate(360deg)}}</style>';
      document.body.appendChild(el);
    }
    document.getElementById('nav-overlay-msg').textContent = msg || 'Carregando…';
  }

  function fallback(view) {
    var base = (document.body && document.body.getAttribute('data-base-url')) || '';
    var url = base ? base + (view && view !== 'portal' ? '?view=' + view : '') : '';
    overlay(false);
    if (url) { try { window.open(url, '_blank'); } catch (e) { /* ignora */ } }
  }

  window.olNavigate = function (view) {
    if (!(window.google && google.script && google.script.run)) { fallback(view); return; }
    overlay(true, 'Carregando a visão…');
    google.script.run
      .withSuccessHandler(function (html) {
        if (!html) { fallback(view); return; }
        document.open();
        document.write(html);
        document.close();
        try { window.scrollTo(0, 0); } catch (e) { /* ignora */ }
      })
      .withFailureHandler(function () { fallback(view); })
      .getViewHtml(view);
  };

  // Rolagem dentro do quadro. Se o documento do quadro rola, usa window.scrollTo (não mexe na página-mãe do Google Sites,
  // onde element.scrollIntoView() empurra o quadro para fora da tela). Se o quadro tem a altura do conteúdo (sem rolagem própria),
  // usa scrollIntoView para a página que o contém rolar até a seção.
  window.olScrollTo = function (el) {
    if (!el) return;
    var de = document.documentElement;
    var scrollable = (de.scrollHeight - window.innerHeight) > 4;
    if (!scrollable) { try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) { el.scrollIntoView(); } return; }
    var head = document.querySelector('.ol-head') || document.getElementById('app-header');
    var off = head ? head.getBoundingClientRect().height + 8 : 0;
    var top = el.getBoundingClientRect().top + (window.pageYOffset || de.scrollTop || 0) - off;
    try { window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' }); } catch (e) { window.scrollTo(0, Math.max(0, top)); }
  };

  // O Apps Script injeta <base target="_top">: qualquer link "#..." navegaria a página-mãe. Aqui viram rolagem interna.
  document.addEventListener('click', function (ev) {
    var l = ev.target && ev.target.closest ? ev.target.closest('a[href^="#"]') : null;
    if (!l || l.hasAttribute('data-nav') || ev.defaultPrevented) return;
    ev.preventDefault();
    var id = (l.getAttribute('href') || '').slice(1);
    var t = id ? document.getElementById(id) : null;
    if (t) window.olScrollTo(t); else if (!id) window.scrollTo(0, 0);
  });

  document.addEventListener('click', function (ev) {
    var a = ev.target && ev.target.closest ? ev.target.closest('[data-nav]') : null;
    if (!a || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button) return;
    if (!(window.google && google.script && google.script.run)) return;
    ev.preventDefault();
    window.olNavigate(a.getAttribute('data-nav'));
  });
})();
</script>

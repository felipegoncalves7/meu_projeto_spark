<script>
/* ==========================================================================
   Visão O&L — Operação & Logística (frontend)
   Dados: getOperacaoLogisticaData(ano) em OperacaoLogistica.gs. Todos os cálculos de
   período, comparativos YTD x mesmo período do ano anterior e status (Mínimo/Meta/Desafio)
   são feitos aqui, em memória, para troca instantânea de período/origem.
   ========================================================================== */
(function () {
  'use strict';

  /* --------------------------------------------------------------- constantes */
  var MONTHS = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
  var MABBR = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];

  // abaixo do Mínimo = Atenção; [Mínimo, Meta) = Mínimo; [Meta, Desafio) = Meta; >= Desafio = Desafio.
  var STATUS = {
    atencao: { key: 'atencao', label: 'Atenção', symbol: '!', rank: 0 },
    minimo: { key: 'minimo', label: 'Mínimo', symbol: '≥', rank: 1 },
    meta: { key: 'meta', label: 'Meta', symbol: '✓', rank: 2 },
    desafio: { key: 'desafio', label: 'Desafio', symbol: '★', rank: 3 },
    none: { key: 'none', label: 'Sem referência', symbol: '–', rank: 4 },
    nodata: { key: 'none', label: 'Sem dado', symbol: '–', rank: 5 }
  };
  var STATUS_COLOR = { atencao: '#691B34', minimo: '#FFB338', meta: '#77985B', desafio: '#00F1AE', none: '#C9CFC4' };

  var COUNTRY_NAMES = {
    br: 'Brasil', ar: 'Argentina', cl: 'Chile', co: 'Colômbia', ec: 'Equador', mx: 'México', pe: 'Peru',
    gt: 'Guatemala', sv: 'El Salvador', hn: 'Honduras', ni: 'Nicarágua', cr: 'Costa Rica', pa: 'Panamá',
    do: 'República Dominicana', uy: 'Uruguai', my: 'Malásia'
  };
  var COUNTRY_ORDER = ['br', 'ar', 'cl', 'co', 'ec', 'mx', 'pe', 'gt', 'sv', 'hn', 'ni', 'cr', 'pa', 'do', 'uy', 'my'];
  var KIND_LABEL = { cd: 'Centro de Distribuição', hub: 'HUB', pea: 'PEA', planta: 'Planta', ecoparque: 'Ecoparque', sistema: 'Sistema / Aplicação' };
  var FLOW_KEYWORDS_TXT = {
    separacao: 'Impactos de Separação, Faturamento, Expedição e Facturación/Separación',
    manufatura: 'Impactos de Fabricação, Evolutio, GTA e PlantSuite',
    atendimento: 'Impactos de CRM e URA',
    planejamento: 'Stream Planejamento Logístico — SAP APO (2025) e O9 (2026)'
  };

  /* ------------------------------------------------------------------ ícones */
  // Malha 24, linha contínua + pontilhado (iconografia do brandbook).
  var ICONS = {
    spark: '<path d="M12 3.5l1.8 5.2 5.2 1.8-5.2 1.8L12 17.5l-1.8-5.2L5 10.5l5.2-1.8z"/><path class="dots" d="M18.5 17v4M16.5 19h4"/>',
    alert: '<path d="M12 4l9 15.5H3z"/><path d="M12 10v4.5"/><circle class="fill" cx="12" cy="17" r="1"/>',
    box: '<path d="M12 3.5l8 4v9l-8 4-8-4v-9z"/><path d="M4 7.5l8 4 8-4M12 11.5v9"/>',
    factory: '<path d="M3.5 20V10.5l6 3v-3l6 3V5.5h4V20z"/><path class="dots" d="M7 17h10"/>',
    headset: '<path d="M4.5 14v-2a7.5 7.5 0 0 1 15 0v2"/><rect x="3.5" y="13.5" width="3.5" height="5.5" rx="1.2"/><rect x="17" y="13.5" width="3.5" height="5.5" rx="1.2"/><path d="M19 19c0 1.6-2 2.2-5 2.2"/>',
    calendar: '<rect x="4" y="5.5" width="16" height="14.5" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/><path class="dots" d="M8 14.5h8"/>',
    gauge: '<path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/><path class="dots" d="M6.5 11.5l1 .8M12 7.5v1.2M17.5 11.5l-1 .8"/><circle class="fill" cx="12" cy="16" r="1.3"/>',
    truck: '<path d="M3 6.5h11v9H3zM14 9.5h3.6l3 3.2v2.8H14"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/><path class="dots" d="M5 10h6"/>',
    warehouse: '<path d="M3.5 20V9l8.5-5 8.5 5v11"/><path d="M7 20v-7h10v7"/><path class="dots" d="M7 16.5h10"/>',
    hub: '<circle cx="12" cy="12" r="2.6"/><circle cx="5" cy="6" r="1.8"/><circle cx="19" cy="6" r="1.8"/><circle cx="5" cy="18" r="1.8"/><circle cx="19" cy="18" r="1.8"/><path d="M6.5 7.2l3.5 3M17.5 7.2l-3.5 3M6.5 16.8l3.5-3M17.5 16.8l-3.5-3"/>',
    pea: '<path d="M4 9.5h12v9H4z"/><path d="M16 12h2.8l1.7 2.3v4.2H16"/><path d="M7.5 9.5V6.5h5v3"/><path class="dots" d="M6.5 14h7"/>',
    leaf: '<path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14z"/><path class="dots" d="M5 19l8-8"/>',
    monitor: '<rect x="3.5" y="4.5" width="17" height="11.5" rx="1.5"/><path d="M9 20h6M12 16v4"/><path class="dots" d="M7 10h10"/>',
    users: '<circle cx="9" cy="8.5" r="3"/><path d="M3.5 19c.5-3.2 2.7-5 5.5-5s5 1.8 5.5 5"/><circle cx="17" cy="9.5" r="2.3"/><path class="dots" d="M16 14.2c2.4.2 4 1.8 4.5 4.8"/>',
    phone: '<path d="M5 4.5h4l1.5 4-2.2 1.5a11 11 0 0 0 5.7 5.7l1.5-2.2 4 1.5v4c0 .8-.7 1.5-1.5 1.5A16 16 0 0 1 3.5 6c0-.8.7-1.5 1.5-1.5z"/>',
    layers: '<path d="M12 4l8.5 4.5L12 13 3.5 8.5z"/><path d="M3.5 12.5L12 17l8.5-4.5"/><path class="dots" d="M3.5 16.5L12 21l8.5-4.5"/>',
    clock: '<circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/>',
    target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.5"/><circle class="fill" cx="12" cy="12" r="1.4"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    pin: '<path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.2"/>',
    chevron: '<path d="M9 6l6 6-6 6"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    download: '<path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14"/>',
    list: '<path d="M8 7h12M8 12h12M8 17h12"/><path class="dots" d="M4 7h.1M4 12h.1M4 17h.1"/>',
    chart: '<path d="M4 20h16"/><path d="M7 16v-5M12 16V7M17 16v-8"/>',
    eye: '<path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/>',
    'eye-off': '<path d="M3 3l18 18"/><path d="M10.6 6a9.8 9.8 0 0 1 1.4-.1c6 0 9.5 6.1 9.5 6.1a16 16 0 0 1-3.2 3.9M6.6 7.7A15.6 15.6 0 0 0 2.5 12S6 18.1 12 18.1c1.4 0 2.6-.3 3.7-.8"/><path class="dots" d="M9.9 10a2.8 2.8 0 0 0 4 4"/>',
    info: '<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5"/><circle class="fill" cx="12" cy="8" r="1"/>',
    dotgrid: '<circle class="fill" cx="7" cy="7" r="1.3"/><circle class="fill" cx="12" cy="7" r="1.3"/><circle class="fill" cx="17" cy="7" r="1.3"/><circle class="fill" cx="7" cy="12" r="1.3"/><circle class="fill" cx="12" cy="12" r="1.3"/><circle class="fill" cx="17" cy="12" r="1.3"/><circle class="fill" cx="7" cy="17" r="1.3"/><circle class="fill" cx="12" cy="17" r="1.3"/><circle class="fill" cx="17" cy="17" r="1.3"/>'
  };
  function icon(name) { return '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + (ICONS[name] || ICONS.dotgrid) + '</svg>'; }
  function tile(name, size) { return '<span class="ico-tile' + (size ? ' ' + size : '') + '" aria-hidden="true">' + icon(name) + '</span>'; }
  function entIcon(e) {
    if (e.kind === 'sistema') {
      var n = fold(e.name);
      if (/\bura\b/.test(n)) return 'phone';
      if (/\bcrm\b/.test(n)) return 'users';
      if (/\bo9\b|apo/.test(n)) return 'layers';
      return 'monitor';
    }
    return { cd: 'warehouse', hub: 'hub', pea: 'pea', planta: 'factory', ecoparque: 'leaf' }[e.kind] || 'pin';
  }

  /* --------------------------------------------------------------- utilitários */
  function isNum(v) { return typeof v === 'number' && isFinite(v); }
  function r2(v) { return Math.round(v * 100) / 100; }
  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fold(s) { return String(s === null || s === undefined ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim(); }
  function matchKw(text, kw) {
    if (!text || !kw) return false;
    if (kw.length <= 4) return new RegExp('(^|[^a-z0-9])' + kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '([^a-z0-9]|$)').test(text);
    return text.indexOf(kw) !== -1;
  }
  function fmtNum(v, d) { return isNum(v) ? v.toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }) : '—'; }
  function fmtPct(v, d) { return isNum(v) ? fmtNum(v, d === undefined ? 2 : d) + '%' : '—'; }
  function fmtInt(v) { return isNum(v) ? Math.round(v).toLocaleString('pt-BR') : '—'; }
  function fmtSigned(v, d) { if (!isNum(v)) return '—'; var r = Number(v.toFixed(d)); return (r > 0 ? '+' : r < 0 ? '−' : '') + fmtNum(Math.abs(r), d); }
  function fmtHM(min) {
    if (!isNum(min)) return '—';
    var m = Math.round(Math.abs(min)), h = Math.floor(m / 60), mm = m % 60;
    return (h < 10 ? '0' : '') + h + ':' + (mm < 10 ? '0' : '') + mm;
  }
  function fmtDur(min) {
    if (!isNum(min)) return '—';
    var m = Math.round(min);
    if (m < 60) return m + 'min';
    var h = Math.floor(m / 60), mm = m % 60;
    return h.toLocaleString('pt-BR') + 'h' + (mm ? (mm < 10 ? '0' : '') + mm : '');
  }
  function fmtDate(ms) {
    if (!isNum(ms)) return '—';
    var d = new Date(ms), p = function (n) { return (n < 10 ? '0' : '') + n; };
    return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function plural(n, s, p) { return n === 1 ? s : p; }
  function mean(a) { return a.reduce(function (s, v) { return s + v; }, 0) / a.length; }
  function range(a, b) { var out = []; for (var i = a; i <= b; i++) out.push(i); return out; }
  function uniq(a) { return a.filter(function (v, i) { return a.indexOf(v) === i; }); }
  function $(id) { return document.getElementById(id); }

  function flag(iso, lg) {
    if (!iso) return '';
    var c = String(iso).toLowerCase(), nm = COUNTRY_NAMES[c] || c.toUpperCase();
    return '<span class="fi fi-' + esc(c) + (lg ? ' lg' : '') + '" role="img" aria-label="' + esc(nm) + '" title="' + esc(nm) + '"></span>';
  }
  function countryOfName(name) {
    var n = fold(name).split(' - ')[0];
    for (var k in COUNTRY_NAMES) if (fold(COUNTRY_NAMES[k]) === n) return k;
    return null;
  }

  /* ---------------------------------------------------------------- status */
  function hasRefs(r) { return !!r && isNum(r.min) && isNum(r.meta) && isNum(r.des) && r.min <= r.meta && r.meta <= r.des; }
  function statusOf(v, refs) {
    if (!isNum(v)) return STATUS.nodata;
    if (!hasRefs(refs)) return STATUS.none;
    // Comparação na precisão exibida (2 casas): 99,86% exibido atinge a Meta de 99,86%
    if (r2(v) < r2(refs.min)) return STATUS.atencao;
    if (r2(v) < r2(refs.meta)) return STATUS.minimo;
    if (r2(v) < r2(refs.des)) return STATUS.meta;
    return STATUS.desafio;
  }
  function chip(st, sm) { return '<span class="chip is-' + st.key + (sm ? ' sm' : '') + '"><span class="sym" aria-hidden="true">' + st.symbol + '</span>' + esc(st.label) + '</span>'; }
  function sdot(st) { return '<span class="sdot is-' + st.key + '" aria-hidden="true"></span>'; }

  /* ------------------------------------------------------------------ deltas */
  // dir: 'lower' = quanto menor, melhor (incidentes, MTTR, horas); 'higher' = quanto maior, melhor (disponibilidade, OLA).
  function nobase(txt) { return { cls: 'nobase', arrow: '', txt: txt || 'sem base comparável', d: null }; }
  function clsFor(d, dir) { return d === 0 ? 'flat' : ((d < 0) === (dir === 'lower') ? 'good' : 'bad'); }
  function arrowFor(d) { return d === 0 ? '=' : (d < 0 ? '▼' : '▲'); }
  function deltaCount(cur, prev, dir) {
    if (!isNum(cur) || !isNum(prev)) return nobase();
    var d = cur - prev, pct = prev > 0 ? d / prev * 100 : null;
    return { cls: clsFor(d, dir || 'lower'), arrow: arrowFor(d), d: d, txt: d === 0 ? 'estável' : fmtSigned(d, 0) + (isNum(pct) ? ' (' + fmtSigned(pct, 0) + '%)' : '') };
  }
  function deltaMin(cur, prev) {
    if (!isNum(cur) || !isNum(prev)) return nobase();
    var d = Math.round(cur) - Math.round(prev);
    return { cls: clsFor(d, 'lower'), arrow: arrowFor(d), d: d, txt: d === 0 ? 'estável' : (d > 0 ? '+' : '−') + fmtHM(d) };
  }
  function deltaDur(cur, prev) {
    if (!isNum(cur) || !isNum(prev)) return nobase();
    var d = Math.round(cur) - Math.round(prev), pct = prev > 0 ? d / prev * 100 : null;
    return { cls: clsFor(d, 'lower'), arrow: arrowFor(d), d: d, txt: d === 0 ? 'estável' : (d > 0 ? '+' : '−') + fmtDur(Math.abs(d)) + (isNum(pct) ? ' (' + fmtSigned(pct, 0) + '%)' : '') };
  }
  function deltaPP(cur, prev, dec, dir) {
    if (!isNum(cur) || !isNum(prev)) return nobase();
    var f = Math.pow(10, dec), d = (Math.round(cur * f) - Math.round(prev * f)) / f;
    return { cls: clsFor(d, dir || 'higher'), arrow: arrowFor(d), d: d, txt: fmtSigned(d, dec) + ' p.p.' };
  }
  function deltaHtml(dl, vs) {
    return '<span class="delta ' + dl.cls + '">' + (dl.arrow ? '<span class="arrow" aria-hidden="true">' + dl.arrow + '</span>' : '') + esc(dl.txt) +
      (vs && dl.cls !== 'nobase' ? ' <span class="vs">vs ' + esc(vs) + '</span>' : '') + '</span>';
  }

  /* ---------------------------------------- OLA de resolução (oculto por padrão) */
  var OLA_NAME = 'OLA de resolução';
  function olaOn() { return !!state.showOla; }
  function olaShowBtn(small) {
    return '<button type="button" class="ola-btn' + (small ? ' sm' : '') + '" data-action="ola-show" aria-label="Exibir ' + OLA_NAME + '">' + icon('eye') + 'Exibir</button>';
  }
  function olaHideBtn() { return '<button type="button" class="ola-btn sm ghost" data-action="ola-hide" aria-label="Ocultar ' + OLA_NAME + '">' + icon('eye-off') + 'Ocultar</button>'; }

  /* --------------------------------------------- faixa Mínimo · Meta · Desafio */
  // Escala determinística (mesmo critério do site de Disponibilidade): depende só das referências exibidas.
  function domainFor(refs) {
    var mn = r2(refs.min), ch = r2(refs.des), span = ch - mn;
    if (!(span > 0)) span = 0.1;
    var lo = mn - span * 0.6, hi = Math.min(100, ch + span * 3);
    if (hi <= ch) hi = ch + span * 0.1;
    return [lo, hi];
  }
  function bpos(v, d) { return Math.max(0, Math.min(100, (v - d[0]) / (d[1] - d[0]) * 100)); }
  // o: { lg, labels, prev (valor do mesmo período do ano anterior), prevLabel, curLabel }
  function bandHtml(refs, value, o) {
    o = o || {};
    if (!hasRefs(refs)) return o.lg ? '<div class="no-ref">Referências (Mínimo/Meta/Desafio) não definidas para este item</div>' : '<span class="legend">sem referência</span>';
    var d = domainFor(refs), mn = r2(refs.min), tg = r2(refs.meta), ch = r2(refs.des);
    var pMin = bpos(mn, d), pTgt = bpos(tg, d), pCh = bpos(ch, d);
    var tip = 'Mínimo ' + fmtPct(refs.min) + ' · Meta ' + fmtPct(refs.meta) + ' · Desafio ' + fmtPct(refs.des) +
      (isNum(value) ? '\n' + (o.curLabel || 'Resultado') + ': ' + fmtPct(value) : '') +
      (isNum(o.prev) ? '\n' + (o.prevLabel || 'Ano anterior') + ': ' + fmtPct(o.prev) : '');
    function seg(cls, l, r) { return '<span class="band-seg z-' + cls + '" style="left:' + l.toFixed(2) + '%;width:' + Math.max(0, r - l).toFixed(2) + '%"></span>'; }
    var h = '<div class="band' + (o.lg ? ' lg' : '') + '" role="img" aria-label="' + esc(tip) + '" data-tip="' + esc(tip) + '"><div class="band-bar"><div class="band-segs">' +
      seg('atencao', 0, pMin) + seg('minimo', pMin, pTgt) + seg('meta', pTgt, pCh) + seg('desafio', pCh, 100) + '</div>';
    [pMin, pTgt, pCh].forEach(function (x) { h += '<span class="band-tick" style="left:' + x.toFixed(2) + '%"></span>'; });
    if (isNum(o.prev)) h += '<span class="band-prev" style="left:' + bpos(r2(o.prev), d).toFixed(2) + '%"></span>';
    if (isNum(value)) {
      var v = r2(value), cls = v < d[0] ? ' under' : (v > d[1] ? ' over' : '');
      h += '<span class="band-now' + cls + '" style="left:' + bpos(v, d).toFixed(2) + '%"></span>';
    }
    h += '</div>';
    if (o.labels) {
      h += '<div class="band-labels">';
      [['Mínimo', mn, pMin], ['Meta', tg, pTgt], ['Desafio', ch, pCh]].forEach(function (t) {
        h += '<span class="band-label" style="left:' + t[2].toFixed(2) + '%">' + (o.lg ? '<span class="k">' + t[0] + '</span>' : '') + '<span class="v num">' + (o.lg ? fmtPct(t[1]) : fmtNum(t[1], 2)) + '</span></span>';
      });
      h += '</div>';
    }
    return h + '</div>';
  }
  function bandLegend(curLabel, prevLabel) {
    return '<div class="band-legend legend"><span><i class="mk-now"></i>' + esc(curLabel) + '</span>' + (prevLabel ? '<span><i class="mk-prev"></i>' + esc(prevLabel) + '</span>' : '') + '</div>';
  }

  /* ------------------------------------------------------------------ estado */
  var D = null;          // payload do ano selecionado
  var M = null;          // modelo derivado (período/origem)
  var IDX = { cur: {}, prev: {} };
  var CACHE = {};
  var charts = {};
  var state = { year: null, periodKey: null, outMode: 'com', gran: 'month', sel: 'ol', expanded: {}, chartMetric: 'inc', rank: 'tec', entSort: {}, modal: null, outScope: 'ol', outMonth: null, showOla: false, card: 'exc' };
  // Outliers: set = incidentes desconsiderados na visão "sem outliers"; rule = incidentes com >= 1.000 min;
  // suggested = sugestão estatística (minutos apurados acima de Q3 + 1,5·IQR no ano). ver invalida os caches.
  var OUT = { set: {}, official: {}, suggested: {}, ver: 0, source: 'none' };
  var APUC = { cur: {}, prev: {} }, ADJ = {};
  var BASE_URL = (document.body && document.body.getAttribute('data-base-url')) || '';

  /* --------------------------------------------------------------- períodos */
  function statusInfo(statuses) {
    var closed = 0, avail = 0, m;
    for (m = 1; m <= 12 && statuses[m - 1] === 'APURADO'; m++) closed = m;
    for (m = 1; m <= 12 && statuses[m - 1] !== 'NAO_INICIADO'; m++) avail = m;
    return { closed: closed, avail: avail };
  }
  function buildPeriods(statuses) {
    var info = statusInfo(statuses), list = [];
    function add(key, label, months, group) {
      var pending = months.some(function (m) { return statuses[m - 1] === 'NAO_INICIADO'; });
      var partial = months.some(function (m) { return statuses[m - 1] === 'PARCIAL'; });
      list.push({ key: key, label: label, months: months, group: group, disabled: pending || !months.length, partial: partial && !pending });
    }
    if (info.closed > 0) add('ytd', (info.closed === 12 ? 'Ano completo · Jan–Dez' : 'YTD · Jan–' + MABBR[info.closed - 1] + ' (apurado)'), range(1, info.closed), 'YTD');
    if (info.avail > info.closed) add('ytdp', 'YTD · Jan–' + MABBR[info.avail - 1] + ' (inclui parcial)', range(1, info.avail), 'YTD');
    for (var q = 1; q <= 4; q++) add('q' + q, 'Q' + q + ' · ' + MABBR[(q - 1) * 3] + '–' + MABBR[(q - 1) * 3 + 2], range((q - 1) * 3 + 1, q * 3), 'Trimestres');
    add('s1', '1º Semestre · Jan–Jun', range(1, 6), 'Semestres');
    add('s2', '2º Semestre · Jul–Dez', range(7, 12), 'Semestres');
    for (var m = 1; m <= 12; m++) add('m' + m, MONTHS[m - 1], [m], 'Meses');
    return list;
  }
  function getPeriod(key) {
    var list = buildPeriods(D.current.statuses);
    return list.find(function (p) { return p.key === key; }) || list.find(function (p) { return !p.disabled; }) || list[0];
  }

    var rowsCur = filterRows(cur.rows, iw.months, undefined, iw.cutCur), rowsPrev = prevOk ? filterRows(prev.rows, iw.months, undefined, iw.cutPrev) : null;
    var overall = { cur: agg(cur, rowsCur), prev: rowsPrev ? agg(prev, rowsPrev) : null };
    // Fluxos de Localidade (Separação/Manufatura) consideram ESTRITAMENTE as Localidades do catálogo do fluxo;
    // as demais linhas (unm) ficam fora do fluxo e são listadas como aviso.
    var flows = D.config.flows.map(function (f) {
      var inFlow = function (r) { return r.flow === f.key && !r.unm && cardOk(r); };
      var rc = rowsCur.filter(inFlow);
      var rp = rowsPrev ? rowsPrev.filter(inFlow) : null;
      var unm = rowsCur.filter(function (r) { return r.flow === f.key && r.unm && cardOk(r); });
      return { cfg: f, rowsCur: rc, rowsPrev: rp, unmCur: unm, cur: agg(cur, rc), prev: rp ? agg(prev, rp) : null, disp: dispFor('f:' + f.key, months), entities: buildEntities(f, rc, rp, months) };
    });
    return {
      per: per, months: months, imonths: iw.months, iw: iw, prevOk: prevOk, labels: labels, dlabels: dlabels, rowsCur: rowsCur, rowsPrev: rowsPrev, overall: overall, flows: flows,
      olDisp: dispFor('ol', months), unmatchedCur: rowsCur.filter(function (r) { return r.flow === 'outros'; })
    };
  }

  /* ============================================================ RENDER */
  function renderAll() {
    destroyCharts();
    M = computeModel();
    renderStamp();
    renderResumo();
    renderOutliers();
    renderIncidentes();
    renderFlows();
    renderDisponibilidade();
    renderFoot();

  }

  function renderStamp() {
    var s = 'Atualizado em ' + (D.lastUpdated || 'N/A') + ' · Apuração ' + D.current.year + ': ' + apuracaoSummary(D.current.statuses);

  function sectionHead(ic, eyebrow, title, sub, actions) {
    return '<div class="sec-head">' + tile(ic, 'lg') + '<div class="titles"><div class="eyebrow">' + eyebrow + '</div><h2>' + title + '</h2>' +

  /* ------------------------------------------------------- Resumo executivo */
  function renderResumo() {
    var DL = M.dlabels, L = M.labels, od = M.olDisp, c = M.overall.cur, p = M.overall.prev;
    var tag = od.cur && od.cur.partial ? '<span class="tag is-partial">◔ Apuração parcial</span>' : (isNum(od.cv) ? '<span class="tag is-closed">● Período fechado</span>' : '');
    var gapTxt = isNum(od.gap) ? (od.gap === 0 ? 'na Meta' : fmtNum(Math.abs(od.gap), 2) + ' p.p. ' + (od.gap > 0 ? 'acima' : 'abaixo') + ' da Meta') : '';
    var calc = od.cur && od.cur.official === false ? ' <span class="info-i" data-tip="Consolidado do período calculado pela média simples dos meses oficiais da aba Disponibilidade_' + D.current.year + ' (mesmo método aplicado ao ano anterior).">i</span>' : '';
    var heroLeft = '<div class="hero-kpi"><div class="eyebrow">Disponibilidade O&amp;L · ' + esc(DL.cur) + calc + '</div>' +
      '<div class="value num">' + (isNum(od.cv) ? fmtNum(od.cv, 2) + '<small>%</small>' : '<span class="muted" style="font-size:22px">sem dado no período</span>') + '</div>' +
      '<div class="hero-meta">' + deltaHtml(od.delta, DL.prev) + (isNum(od.cv) ? chip(od.status) : '') + tag + '</div>' + outAltLine(DL) +
      (gapTxt ? '<div class="legend">' + esc(gapTxt) + (isNum(od.pv) ? ' · ' + esc(DL.prev) + ': ' + fmtPct(od.pv) : '') + '</div>' : '') +
      '<div class="hero-ruler">' + bandHtml(od.refs, od.cv, { lg: true, labels: true, prev: od.pv, curLabel: DL.cur, prevLabel: DL.prev }) + '</div>' +
      (hasRefs(od.refs) ? bandLegend(DL.cur, isNum(od.pv) ? DL.prev + ' (mesmo período)' : '') : '') +
      (IDX.cur.ol ? '<div class="eyebrow" style="margin-top:18px">Disponibilidade O&amp;L · comparativos em p.p. vs ' + D.previous.year + '</div>' + ppGridHtml('ol') : '') + '</div>';

    function row(label, cv, pv, dl, cls) {
      return '<tr' + (cls ? ' class="' + cls + '"' : '') + '><td>' + label + '</td><td class="cur">' + cv + '</td><td class="prev">' + pv + '</td><td>' + deltaHtml(dl) + '</td></tr>';
    }
    var P = p || {};
    var table = '<div class="tbl-scroll"><table class="cmp-table"><thead><tr><th>Indicador</th><th>' + esc(L.cur) + '</th><th>' + esc(L.prev) + '</th><th>Variação</th></tr></thead><tbody>' +
      row('Incidentes O&amp;L', fmtInt(c.incidents), p ? fmtInt(P.incidents) : '—', deltaCount(c.incidents, p ? P.incidents : null, 'lower')) +
      row('<span class="sev-dot s0"></span>Sev 0', fmtInt(c.sev0), p ? fmtInt(P.sev0) : '—', deltaCount(c.sev0, p ? P.sev0 : null, 'lower'), 'sub-row') +
      row('<span class="sev-dot s1"></span>Sev 1', fmtInt(c.sev1), p ? fmtInt(P.sev1) : '—', deltaCount(c.sev1, p ? P.sev1 : null, 'lower'), 'sub-row') +
      row('MTTR (geral)', fmtHM(c.mttr), p ? fmtHM(P.mttr) : '—', deltaMin(c.mttr, p ? P.mttr : null)) +
      (olaOn() ? row(OLA_NAME, fmtPct(c.ola, 1), p ? fmtPct(P.ola, 1) : '—', deltaPP(c.ola, p ? P.ola : null, 1, 'higher')) : '') +
      '</tbody></table></div>' + (olaOn() ? '' : '<div class="ola-hint">' + icon('eye-off') + '<span>' + OLA_NAME + ' oculto</span>' + olaShowBtn(true) + '</div>');
    var heroRight = '<div><div class="eyebrow" style="margin-bottom:10px">' + esc(L.cur) + ' vs mesmo período de ' + esc(L.prevYear) + '</div>' + table +
      '<div class="legend" style="margin-top:8px">Incidentes de O&amp;L = Stream O&amp;L ou Planejamento Logístico (aba Major_Incidents_Impactos_' + D.current.year + ')' +
      ', origem Tecnologia, qualquer Localidade/Impacto. MTTR' + (olaOn() ? ' e OLA' : '') + ' pelo TTR oficial do Incidente (MajorIncidentes).</div></div>';

    var tiles = '<div class="flow-tiles">' + M.flows.map(function (f) {
      var d = f.disp, st = d.status;
      return '<button type="button" class="flow-tile" data-action="goto" data-target="sec-flow-' + f.cfg.key + '">' +
        '<div class="ft-head">' + tile(f.cfg.icon, 'sm') + '<span class="ft-name">' + esc(f.cfg.short) + '</span></div>' +
        '<div class="ft-row"><span class="ft-val num">' + (isNum(d.cv) ? fmtPct(d.cv) : '<span class="muted" style="font-size:14px">sem dado</span>') + '</span>' + (isNum(d.cv) ? chip(st, true) : '') + '</div>' +
        '<div class="ft-row">' + deltaHtml(d.delta, L.prevYear) + '</div>' +
        bandHtml(d.refs, d.cv, { prev: d.pv, curLabel: DL.cur, prevLabel: DL.prev }) +
        '<div class="ft-inc"><div class="ft-inc-main"><span class="n num">' + f.cur.incidents + '</span><span class="u">' + plural(f.cur.incidents, 'incidente', 'incidentes') + '</span></div>' +
        '<div class="ft-inc-cmp">' + deltaHtml(deltaCount(f.cur.incidents, f.prev ? f.prev.incidents : null, 'lower')) + (f.prev ? '<span class="vs">vs ' + f.prev.incidents + ' em ' + esc(L.prev) + '</span>' : '') + '</div></div>' +
        '</button>';
    }).join('') + '</div>';

    var ins = buildInsights();
    var insHtml = ins.length ? '<div class="insights"><div class="eyebrow">' + icon('spark').replace('class="ico"', 'class="ico" style="width:14px;height:14px;vertical-align:-2px;margin-right:4px"') + 'Leitura executiva</div><ul>' + ins.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul></div>' : '';

    $('sec-resumo').innerHTML = sectionHead('truck', 'Visão O&amp;L · Resumo executivo', 'Operação &amp; Logística — ' + esc(M.labels.curYear) + ' vs ' + esc(M.labels.prevYear),
      'Comparativos sempre contra o mesmo período do ano anterior. Incidentes até hoje; Disponibilidade até o último mês apurado (aba Status_Apuracao).') +
      periodNotices() + '<div class="hero">' + heroLeft + heroRight + '</div>' + tiles + insHtml;
  }

  function outAltLine(DL) {
    if (!outCount() || !hasApuracao('cur')) return '';
    var alt = dispFor('ol', M.months, state.outMode === 'sem' ? 'com' : 'sem');
    if (!isNum(alt.cv)) return '';
    return '<div class="out-alt" role="button" tabindex="0" data-action="goto" data-target="sec-outliers">' + icon('target') +
      '<span>' + (state.outMode === 'sem' ? 'Oficial (com outliers)' : 'Sem os ' + outCount() + ' ' + plural(outCount(), 'outlier', 'outliers')) + ': <b>' + fmtPct(alt.cv) + '</b></span>' +
      chip(alt.status, true) + deltaHtml(alt.delta, DL.prev) + '<span class="legend">ver impacto isolado →</span></div>';
  }

  function buildInsights() {
    var DL = M.dlabels, L = M.labels, od = M.olDisp, out = [], c = M.overall.cur, p = M.overall.prev;
    if (isNum(od.cv)) {
      out.push('Disponibilidade de O&amp;L em ' + esc(DL.cur) + ': <b>' + fmtPct(od.cv) + '</b>' +
        (isNum(od.pv) ? ' (<b>' + esc(od.delta.txt) + '</b> vs ' + esc(DL.prev) + ')' : '') + ' — status <b>' + esc(od.status.label) + '</b>' +
        (isNum(od.gap) ? ' (' + fmtSigned(od.gap, 2) + ' p.p. vs Meta)' : '') + '.');
    }
    var fl = M.flows.filter(function (f) { return isNum(f.disp.cv) && isNum(f.disp.pv); }).map(function (f) { return { f: f, d: f.disp.delta.d }; });
    if (fl.length > 1) {
      fl.sort(function (a, b) { return b.d - a.d; });
      var best = fl[0], worst = fl[fl.length - 1];
      out.push('Maior evolução vs ' + esc(L.prevYear) + ': <b>' + esc(best.f.cfg.short) + '</b> (' + fmtSigned(best.d, 2) + ' p.p.)' +
        (worst.d < best.d ? '; maior retração: <b>' + esc(worst.f.cfg.short) + '</b> (' + fmtSigned(worst.d, 2) + ' p.p.)' : '') + '.');
    }
    var below = M.flows.filter(function (f) { return isNum(f.disp.cv) && (f.disp.status.key === 'atencao' || f.disp.status.key === 'minimo'); });
    if (below.length) out.push('Abaixo da Meta no período: ' + below.map(function (f) { return '<b>' + esc(f.cfg.short) + '</b> (' + fmtPct(f.disp.cv) + ', ' + esc(f.disp.status.label) + ')'; }).join('; ') + '.');
    else if (M.flows.some(function (f) { return isNum(f.disp.cv); })) out.push('Todos os fluxos com dado no período estão na Meta ou acima.');
    out.push('<b>' + c.incidents + '</b> ' + plural(c.incidents, 'incidente', 'incidentes') + ' de O&amp;L (' + c.sev0 + ' Sev 0 · ' + c.sev1 + ' Sev 1)' +
      (p ? ', ' + esc(deltaCount(c.incidents, p.incidents, 'lower').txt) + ' vs ' + p.incidents + ' em ' + esc(L.prev) : '') + '.');
    if (isNum(c.mttr)) {
      out.push('MTTR <b>' + fmtHM(c.mttr) + '</b>' + (p && isNum(p.mttr) ? ' (' + esc(deltaMin(c.mttr, p.mttr).txt) + ' vs ' + fmtHM(p.mttr) + ')' : '') +
        (olaOn() && isNum(c.ola) ? ' · ' + OLA_NAME + ' <b>' + fmtPct(c.ola, 1) + '</b>' + (p && isNum(p.ola) ? ' (' + esc(deltaPP(c.ola, p.ola, 1).txt) + ')' : '') : '') + '.');
    }
    if (outCount() && hasApuracao('cur') && state.outMode === 'com') {
      var ws = dispFor('ol', M.months, 'sem');
      if (isNum(ws.cv) && isNum(od.cv) && r2(ws.cv) > r2(od.cv)) {
        out.push('Sem os <b>' + outCount() + ' ' + plural(outCount(), 'outlier', 'outliers') + '</b>, O&amp;L fecharia ' + esc(DL.cur) + ' em <b>' + fmtPct(ws.cv) + '</b> (' + esc(deltaPP(ws.cv, od.cv, 2).txt) + ' sobre o oficial; status <b>' + esc(ws.status.label) + '</b>' + (isNum(ws.pv) ? '; ' + esc(ws.delta.txt) + ' vs ' + esc(DL.prev) : '') + ').');
      }
    }
    var all = [];
    M.flows.forEach(function (f) { f.entities.forEach(function (e) { if (e.cur.incidents > 0) all.push({ f: f, e: e }); }); });
    all.sort(function (a, b) { return b.e.cur.incidents - a.e.cur.incidents || b.e.cur.sev0 - a.e.cur.sev0; });
    if (all.length) {
      var t = all[0];
      out.push('Mais incidentes no período: <b>' + esc(t.e.name) + '</b> (' + esc(t.f.cfg.short) + ') — ' + t.e.cur.incidents + ' ' + plural(t.e.cur.incidents, 'incidente', 'incidentes') + ' (' + t.e.cur.sev0 + ' Sev 0 · ' + t.e.cur.sev1 + ' Sev 1).');
    }
    return out;
  }

  /* ------------------------------------------- Impacto isolado & Outliers */
  function incInfo(inc) {
    var cache = D._incInfo || (D._incInfo = {});
    if (cache[inc]) return cache[inc];
    var info = { tit: '', sev: null, ents: {}, mks: {} }, meta = D.current.incidents && D.current.incidents[inc];
    if (meta && isNum(meta.sev)) info.sev = meta.sev;
    D.current.rows.forEach(function (r) {
      if (r.inc !== inc) return;
      if (!info.tit && r.tit) info.tit = r.tit;
      if (!isNum(info.sev) && isNum(r.sev)) info.sev = r.sev;
      info.ents[r.entName] = true; if (r.mk) info.mks[r.mk] = true;
    });
    return (cache[inc] = info);
  }
  function outScopes() {
    var list = [{ key: 'ol', label: 'O&L', icon: 'truck' }];
    D.config.flows.forEach(function (f) { if (IDX.cur['f:' + f.key]) list.push({ key: 'f:' + f.key, label: f.short, icon: f.icon }); });
    return list;
  }
  function outMonthsAvailable() {
    return range(1, 12).filter(function (m) { return D.current.statuses[m - 1] !== 'NAO_INICIADO'; });
  }
  function scopeRows(rows, scope) {
    if (scope === 'ol') return rows;
    var key = scope.slice(2);
    return rows.filter(function (r) { return r.flow === key && !r.unm && cardOk(r); });
  }
  function scopeLabel(scope) {
    if (scope === 'ol') return 'O&L (consolidado)';
    var f = D.config.flows.find(function (x) { return 'f:' + x.key === scope; });
    return f ? f.label : scope;
  }
  // Itens (incidentes/janelas) que compõem a indisponibilidade do nó no mês, com a sua fatia em p.p.
  function isolatedItems(scope, month) {
    var node = IDX.cur[scope];
    if (!node) return { A: null, total: 0, items: [] };
    var A = node.months[month - 1], a = attribution(scope, 'cur')[month];
    if (!isNum(A) || !a || !(a.total > 0)) return { A: A, total: a ? a.total : 0, items: [] };
    var gap = Math.max(0, 100 - A), nPer = M.months.length, inPer = M.months.indexOf(month) !== -1;
    var items = Object.keys(a.byInc).map(function (inc) {
      var min = a.byInc[inc], pp = gap * min / a.total;
      return { inc: inc, isInc: /^INC\d+$/i.test(inc), min: min, share: min / a.total * 100, pp: pp, ppPer: inPer ? pp / nPer : null };
    }).sort(function (x, y) { return y.min - x.min; });
    return { A: A, total: a.total, items: items };
  }

  function ppTxt(v) { return v < 0.0005 ? '< 0,001 p.p.' : '−' + fmtNum(v, 3) + ' p.p.'; }

  function renderOutliers() {
    var sec = $('sec-outliers');
    if (!sec) return;
    if (charts.wf) { charts.wf.destroy(); charts.wf = null; }
    var DL = M.dlabels, L = M.labels, cy = D.current.year;
    var scopes = outScopes();
    if (!scopes.find(function (x) { return x.key === state.outScope; })) state.outScope = 'ol';
    var avail = outMonthsAvailable();
    if (!state.outMonth || avail.indexOf(state.outMonth) === -1) state.outMonth = avail.indexOf(1) !== -1 ? 1 : (avail[0] || 1);
    var scope = state.outScope, month = state.outMonth;
    var restore = outSetIsDefault() ? '' : '<button type="button" class="btn" data-action="out-restore">' + icon('layers') + 'Restaurar Outliers (≥ 1.000 min)</button>';
    var head = sectionHead('target', 'Disponibilidade · Impacto isolado', 'Impacto isolado dos incidentes e Outliers de Disponibilidade',
      'Quanto cada incidente custou à Disponibilidade no mês e como ficaria o resultado se os Outliers de Disponibilidade não tivessem acontecido.', restore);

    var notes = '';
    var nOut = outCount();
    var nCur = Object.keys(OUT.rule).filter(function (k) { return OUT.rule[k].year === cy; }).length, nPrev = Object.keys(OUT.rule).length - nCur;
    notes += '<div class="notice is-info">' + icon('info') + '<div><b>Outliers de Disponibilidade</b> = incidentes com <b>1.000 minutos ou mais</b> de indisponibilidade apurada (soma na aba apuracao_[Ano]): <b>' + nCur + '</b> em ' + cy + ' e <b>' + nPrev + '</b> em ' + D.previous.year + '. ' +
      'Marque/desmarque na tabela para simular outros cenários — a seleção da tela não altera a planilha.</div></div>';
    if (!hasApuracao('cur')) {
      sec.innerHTML = head + notes + '<div class="notice">' + icon('alert') + '<div>Aba <b>apuracao_' + cy + '</b> não encontrada (ou sem linhas de O&amp;L): sem os minutos apurados por incidente não é possível isolar o impacto na Disponibilidade.</div></div>';
      return;
    }

    var segScope = '<div class="seg" id="ol-out-scope">' + scopes.map(function (x) { return '<button type="button" data-v="' + x.key + '"' + (x.key === scope ? ' class="is-active"' : '') + '>' + esc(x.label) + '</button>'; }).join('') + '</div>';
    var segMonth = '<div class="seg" id="ol-out-month">' + avail.map(function (m) { return '<button type="button" data-v="' + m + '"' + (m === month ? ' class="is-active"' : '') + '>' + MABBR[m - 1] + (D.current.statuses[m - 1] === 'PARCIAL' ? ' ◔' : '') + '</button>'; }).join('') + '</div>';
    var toolbar = '<div class="disp-toolbar"><div class="field-inline"><span class="eyebrow">Escopo</span>' + segScope + '</div><div class="field-inline"><span class="eyebrow">Mês</span>' + segMonth + '</div></div>';

    var iso = isolatedItems(scope, month);
    var mLbl = MABBR[month - 1] + '/' + cy;
    var mOff = dispFor(scope, [month], 'com'), mSem = dispFor(scope, [month], 'sem');
    var pOff = dispFor(scope, M.months, 'com'), pSem = dispFor(scope, M.months, 'sem');
    function valBlock(label, d) {
      return '<div class="ov-col"><span class="legend">' + label + '</span><span class="ov-val num">' + fmtPct(d.cv) + '</span>' + (isNum(d.cv) ? chip(d.status, true) : '') + '</div>';
    }
    function gainHtml(a, b) {
      var g = deltaPP(b.cv, a.cv, 2, 'higher');
      return g.cls === 'nobase' ? '' : '<div class="ov-gain">' + deltaHtml({ cls: g.d > 0 ? 'good' : 'flat', arrow: g.d > 0 ? '▲' : '=', txt: (g.d > 0 ? g.txt : '0,00 p.p.') + ' sem outliers' }) + '</div>';
    }
    var rc = scopeRows(filterRows(D.current.rows, M.imonths, 'com', M.iw.cutCur), scope);
    var aOff = agg(D.current, rc), aSem = agg(D.current, rc.filter(function (r) { return !isOutlier(r.inc); }));
    function krow(label, a, b) { return '<tr><td>' + label + '</td><td class="num">' + a + '</td><td class="num strong">' + b + '</td></tr>'; }
    var cards = '<div class="grid cols-3 out-cards">' +

      '<div class="kpi"><div class="kpi-head"><span class="eyebrow">Período · ' + esc(DL.cur) + '</span></div><div class="ov-row">' + valBlock('Oficial', pOff) + '<span class="ov-arrow">→</span>' + valBlock('Sem outliers', pSem) + '</div>' + gainHtml(pOff, pSem) +
        '<div class="kpi-foot">vs ' + esc(DL.prev) + ' (' + fmtPct(pOff.pv) + '): oficial ' + deltaHtml(pOff.delta) + ' · sem outliers ' + deltaHtml(pSem.delta) + '</div></div>' +
      '<div class="kpi"><div class="kpi-head"><span class="eyebrow">Incidentes · ' + esc(L.cur) + '</span><span class="legend">' + nOut + ' ' + plural(nOut, 'outlier', 'outliers') + '</span></div>' +
        '<table class="cmp-table ov-table"><thead><tr><th></th><th>Oficial</th><th>Sem outliers</th></tr></thead><tbody>' +
        krow('Incidentes', fmtInt(aOff.incidents), fmtInt(aSem.incidents)) + krow('MTTR', fmtHM(aOff.mttr), fmtHM(aSem.mttr)) +
        (olaOn() ? krow(OLA_NAME, fmtPct(aOff.ola, 1), fmtPct(aSem.ola, 1)) : '') + '</tbody></table></div>' +
      '</div>';

    var maxPer = M.months.length;
    var listItems = iso.items.filter(function (it) { return it.isInc; });
    var table = listItems.length ? '<div class="tbl-wrap" style="max-height:440px"><table class="tbl out-tbl"><thead><tr><th>Outlier</th><th>Incidente</th><th>Minutos apurados</th><th>% da indisponibilidade</th><th>Impacto no mês</th><th>Impacto em ' + esc(L.cur) + '</th></tr></thead><tbody>' +
      listItems.map(function (it) {
        var info = incInfo(it.inc), on = isOutlier(it.inc);
        var tags = OUT.rule[it.inc] ? '<span class="tag is-off" data-tip="' + esc('Outlier de Disponibilidade: ' + fmtInt(OUT.rule[it.inc].min) + ' min de indisponibilidade apurada (≥ 1.000 min)') + '">Outlier ≥ 1.000 min</span>' : '';
        var sub = info ? [isNum(info.sev) ? 'Sev ' + info.sev : '', Object.keys(info.ents).slice(0, 3).join(', ')].filter(Boolean).join(' · ') : '';
        return '<tr class="' + (on ? 'is-out' : '') + '"><td>' + (it.isInc ? '<label class="ck"><input type="checkbox" data-action="toggle-outlier" data-inc="' + esc(it.inc) + '"' + (on ? ' checked' : '') + ' aria-label="Marcar ' + esc(it.inc) + ' como Outlier"></label>' : '') + '</td>' +
          '<td><div class="id">' + esc(it.inc) + ' ' + tags + '</div>' + (info && info.tit ? '<div class="desc">' + esc(info.tit) + '</div>' : '') + (sub ? '<div class="desc">' + esc(sub) + (info && Object.keys(info.mks).length ? ' ' + Object.keys(info.mks).map(function (k) { return flag(k); }).join('') : '') + '</div>' : '') + '</td>' +
          '<td class="nowrap num">' + fmtInt(it.min) + ' min<div class="desc">' + fmtDur(it.min) + '</div></td>' +
          '<td class="nowrap"><div class="share-bar"><span style="width:' + Math.min(100, it.share).toFixed(1) + '%"></span></div><span class="num">' + fmtNum(it.share, 1) + '%</span></td>' +
          '<td class="nowrap num strong">' + ppTxt(it.pp) + '</td>' +
          '<td class="nowrap num">' + (isNum(it.ppPer) ? ppTxt(it.ppPer) : '<span class="muted">fora do período</span>') + '</td></tr>';
      }).join('') + '</tbody></table></div>' : '<div class="empty">' + (isNum(iso.A) ? (iso.A >= 100 ? 'Sem indisponibilidade em ' + esc(mLbl) + '.' : 'Nenhum minuto apurado casou com este escopo em ' + esc(mLbl) + ' (a fatia por incidente não pode ser calculada).') : 'Sem dado de Disponibilidade em ' + esc(mLbl) + '.') + '</div>';

    var wfPanel = '<div class="panel"><div class="panel-head"><div class="sub-title">' + icon('chart') + 'Cascata · ' + esc(mLbl) + ' · ' + esc(scopeLabel(scope)) + '</div></div>' +
      (iso.items.length ? '<div class="chart-box"><canvas id="ol-chart-wf"></canvas></div><div class="legend" style="margin-top:6px">De 100% ao resultado oficial: cada barra é a fatia do incidente na indisponibilidade do mês (vinho = Outlier). A última barra é o resultado sem os Outliers.</div>' : '<div class="empty">Sem composição de indisponibilidade para exibir.</div>') + '</div>';
    var listPanel = '<div class="panel"><div class="panel-head"><div class="sub-title">' + icon('list') + 'Incidentes de ' + esc(mLbl) + ' por impacto</div><span class="legend">' + listItems.length + ' ' + plural(listItems.length, 'incidente', 'incidentes') + ' · ' + fmtInt(iso.total) + ' min apurados no escopo (inclui manutenções programadas)</span></div>' + table + '</div>';

    // resumo por fluxo: período oficial x sem outliers
    var flowRows = [{ key: 'ol', label: 'O&L (consolidado)', icon: 'truck' }].concat(D.config.flows.map(function (f) { return { key: 'f:' + f.key, label: f.label, icon: f.icon }; })).filter(function (x) { return IDX.cur[x.key]; });
    var flowTable = '<div class="tbl-scroll"><table class="cmp-table out-flows"><thead><tr><th>Escopo</th><th>' + esc(DL.cur) + ' oficial</th><th>Sem outliers</th><th>Ganho</th><th>vs ' + esc(DL.prev) + ' (oficial)</th><th>vs ' + esc(DL.prev) + ' (sem outliers)</th></tr></thead><tbody>' +
      flowRows.map(function (x) {
        var o = dispFor(x.key, M.months, 'com'), w = dispFor(x.key, M.months, 'sem'), g = deltaPP(w.cv, o.cv, 2, 'higher');
        return '<tr' + (x.key === scope ? ' class="is-sel"' : '') + '><td><span class="rh-inline">' + tile(x.icon, 'sm') + esc(x.label) + '</span></td>' +

    if (iso.items.length) drawWaterfall(scope, iso, mSem);

  function drawWaterfall(scope, iso, mSem) {
    var cv = $('ol-chart-wf');
    if (!cv || !window.Chart) return;
    var node = IDX.cur[scope], refs = { min: node.min, meta: node.meta, des: node.des };
    var incItems = iso.items.filter(function (it) { return it.isInc; }), winPP = iso.items.filter(function (it) { return !it.isInc; }).reduce(function (s0, it) { return s0 + it.pp; }, 0);
    var top = incItems.slice(0, 8), rest = incItems.slice(8);
    var labels = ['100%'], data = [], colors = [], tips = [];
    var A = iso.A, Asem = mSem.cv;
    var lo = Math.min(A, isNum(Asem) ? Asem : A, hasRefs(refs) ? refs.min : A);
    var ymin = Math.max(0, Math.floor((lo - Math.max(0.03, (100 - lo) * 0.2)) * 100) / 100);
    data.push([ymin, 100]); colors.push('#C9CFC4'); tips.push('Sem indisponibilidade');
    var level = 100;
    top.forEach(function (it) {
      labels.push(it.isInc ? it.inc.replace(/^INC0*/, 'INC ') : 'Janela');
      data.push([level - it.pp, level]); level -= it.pp;
      colors.push(isOutlier(it.inc) ? '#691B34' : '#FF6D00');
      var info = it.isInc ? incInfo(it.inc) : null;
      tips.push(it.inc + (info && info.tit ? ' — ' + info.tit : '') + '\n' + fmtInt(it.min) + ' min · −' + fmtNum(it.pp, 3) + ' p.p.' + (isOutlier(it.inc) ? ' · Outlier' : ''));
    });
    if (rest.length) {
      var pp = rest.reduce(function (s, it) { return s + it.pp; }, 0), anyOut = rest.some(function (it) { return isOutlier(it.inc); });
      labels.push('Demais (' + rest.length + ')'); data.push([level - pp, level]); level -= pp; colors.push(anyOut ? '#9C5A6E' : '#E8B48C');
      tips.push(rest.length + ' itens · −' + fmtNum(pp, 3) + ' p.p.');
    }
    if (winPP > 0) { labels.push('Manutenções'); data.push([level - winPP, level]); level -= winPP; colors.push('#8FA3AD'); tips.push('Manutenções programadas (não são incidentes) · −' + fmtNum(winPP, 3) + ' p.p.'); }
    labels.push('Oficial'); data.push([ymin, A]); colors.push('#333D20'); tips.push('Resultado oficial: ' + fmtPct(A));
    labels.push('Sem outliers'); data.push([ymin, isNum(Asem) ? Asem : A]); colors.push('#77985B'); tips.push('Sem outliers (estimado): ' + fmtPct(Asem));
    var ds = [{ type: 'bar', label: 'Disponibilidade', data: data, backgroundColor: colors, borderRadius: 2, maxBarThickness: 34, order: 2 }];
    if (hasRefs(refs)) ds.push({ type: 'line', label: 'Meta ' + fmtPct(refs.meta), data: labels.map(function () { return r2(refs.meta); }), borderColor: '#77985B', borderDash: [6, 4], borderWidth: 1.5, pointRadius: 0, order: 1 });
    charts.wf = new Chart(cv, {
      data: { labels: labels, datasets: ds },
      options: {
        responsive: true, maintainAspectRatio: false, layout: { padding: { top: 16 } },
        plugins: {
          legend: { display: hasRefs(refs), position: 'top', align: 'end', labels: { boxWidth: 10, boxHeight: 10, font: { size: 11 }, filter: function (it) { return it.datasetIndex === 1; } } },
          tooltip: { callbacks: { label: function (ctx) { return ctx.datasetIndex === 0 ? tips[ctx.dataIndex].split('\n') : ctx.dataset.label; } } },
          datalabels: {
            display: function (ctx) { return ctx.datasetIndex === 0; }, anchor: 'end', align: 'end', offset: -1, font: { size: 9.5, weight: '700' }, color: '#333D20',
            formatter: function (v, ctx) { var i = ctx.dataIndex; if (i === 0) return '100%'; if (i >= labels.length - 2) return fmtNum(v[1], 2) + '%'; var d = v[1] - v[0]; return d < 0.0005 ? '<0,001' : '−' + fmtNum(d, 3); }
          }
        },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 10 }, maxRotation: 45, minRotation: 0 } },
          y: { min: ymin, max: 100, grid: { color: 'rgba(51,61,32,.08)' }, ticks: { font: { size: 10 }, callback: function (v) { return fmtNum(v, 2) + '%'; } } }
        }
      }
    });
  }

  /* ------------------------------------------------------- Incidentes O&L */
  function kpiTarget(label, v, target) {

  }
  function renderIncidentes() {

      '<div><div class="legend"><span class="sev-dot s1"></span>Sev 1</div><div class="v">' + c.sev1 + '</div>' + deltaHtml(deltaCount(c.sev1, p ? P.sev1 : null, 'lower')) + '</div></div></div>' +

      '<div><div class="legend"><span class="sev-dot s1"></span>Sev 1 · meta ' + fmtHM(T.mttrSev1) + '</div><div class="v">' + fmtHM(c.mttr1) + '</div>' + deltaHtml(deltaMin(c.mttr1, p ? P.mttr1 : null)) + '</div></div>' +
      '<div class="kpi-foot">' + [kpiTarget('Sev 0', c.mttr0, T.mttrSev0), kpiTarget('Sev 1', c.mttr1, T.mttrSev1)].filter(Boolean).join(' · ') + '</div></div>' +

      '<div class="kpi"><div class="kpi-head"><span class="eyebrow">MTTR s/ outliers <span class="info-i" data-tip="Desconsidera incidentes com TTR ≥ ' + fmtHM(T.outlierSev0) + ' (Sev 0) e ≥ ' + fmtHM(T.outlierSev1) + ' (Sev 1). Metas: Sev 0 ≤ ' + fmtHM(T.mttrSemOutliersSev0) + ' e Sev 1 ≤ ' + fmtHM(T.mttrSemOutliersSev1) + '.">i</span></span>' + tile('target', 'sm') + '</div>' +
      '<div class="kpi-split" style="border-top:0;padding-top:0"><div><div class="legend"><span class="sev-dot s0"></span>Sev 0 · meta ' + fmtHM(T.mttrSemOutliersSev0) + '</div><div class="kpi-value md num">' + fmtHM(c.mttrSO0) + '</div>' + deltaHtml(deltaMin(c.mttrSO0, p ? P.mttrSO0 : null)) + '<div class="legend">' + c.out0 + ' ' + plural(c.out0, 'outlier', 'outliers') + '</div></div>' +
      '<div><div class="legend"><span class="sev-dot s1"></span>Sev 1 · meta ' + fmtHM(T.mttrSemOutliersSev1) + '</div><div class="kpi-value md num">' + fmtHM(c.mttrSO1) + '</div>' + deltaHtml(deltaMin(c.mttrSO1, p ? P.mttrSO1 : null)) + '<div class="legend">' + c.out1 + ' ' + plural(c.out1, 'outlier', 'outliers') + '</div></div></div></div>' +

      (olaOn() ?
      '<div class="kpi' + (isNum(c.ola) && p && isNum(P.ola) && c.ola < P.ola ? ' is-alert' : '') + '"><div class="kpi-head"><span class="eyebrow">' + OLA_NAME + ' <span class="info-i" data-tip="Incidentes resolvidos dentro do OLA de resolução: Sev 0 ≤ ' + fmtHM(T.olaSev0) + ' e Sev 1 ≤ ' + fmtHM(T.olaSev1) + ' (TTR oficial do Major Incident).">i</span></span>' + tile('check', 'sm') + '</div>' +
      '<div class="kpi-value num">' + (isNum(c.ola) ? fmtPct(c.ola, 1) : '<span class="muted" style="font-size:16px">Sem incidentes</span>') + '</div>' + deltaHtml(deltaPP(c.ola, p ? P.ola : null, 1, 'higher'), vs) +
      '<div class="kpi-split"><div><div class="legend"><span class="sev-dot s0"></span>Sev 0 · ≤ ' + fmtHM(T.olaSev0) + '</div><div class="v">' + fmtPct(c.ola0, 1) + '</div>' + deltaHtml(deltaPP(c.ola0, p ? P.ola0 : null, 1, 'higher')) + '</div>' +
      '<div><div class="legend"><span class="sev-dot s1"></span>Sev 1 · ≤ ' + fmtHM(T.olaSev1) + '</div><div class="v">' + fmtPct(c.ola1, 1) + '</div>' + deltaHtml(deltaPP(c.ola1, p ? P.ola1 : null, 1, 'higher')) + '</div></div>' +
      '<div class="kpi-foot">' + olaHideBtn() + '</div></div>'
      :
      '<div class="kpi kpi-ola-hidden"><div class="kpi-head"><span class="eyebrow">' + OLA_NAME + '</span>' + tile('check', 'sm') + '</div>' +
      '<div class="ola-mask" aria-hidden="true">••,•%</div><div class="legend">Indicador oculto. Selecione para exibir o resultado e o comparativo com ' + esc(vs) + '.</div>' + olaShowBtn(false) + '</div>');

    var unmatched = M.unmatchedCur.length ? '<div class="notice is-info" style="margin-top:14px">' + icon('info') + '<div>' + M.unmatchedCur.length + ' ' + plural(M.unmatchedCur.length, 'linha de impacto', 'linhas de impacto') + ' de O&amp;L sem fluxo mapeado pelas palavras-chave (contam no total de O&amp;L, mas não em nenhum fluxo): ' +
      esc(uniq(M.unmatchedCur.map(function (r) { return r.imp || '(vazio)'; })).slice(0, 8).join(', ')) + '.</div></div>' : '';

    var chartPanel = '<div class="panel"><div class="panel-head"><div class="sub-title">' + icon('chart') + 'Evolução mensal — ' + D.current.year + ' vs ' + D.previous.year + '</div>' +

      '<div id="ol-rank-body">' + rankHtml() + '</div></div>';

    $('sec-incidentes').innerHTML = sectionHead('alert', 'Visão Geral de Incidentes de O&amp;L', 'Incidentes de O&amp;L — todos os fluxos',
      'Mesmos KPIs da Visão Geral (Volume, MTTR, MTTR s/ outliers e ' + OLA_NAME + '), com comparativo vs ' + esc(L.prev) + '.',
      '<button type="button" class="btn" data-action="open-check">' + icon('check') + 'Conferir lista</button>' +
      '<button type="button" class="btn btn-accent" data-action="open-all">' + icon('list') + 'Ver incidentes (' + c.incidents + ')</button>') +
      '<div class="grid cols-4">' + cards + '</div>' + reconcileHtml() + unmatched +
      '<div class="grid cols-2" style="margin-top:14px">' + chartPanel + rankPanel + '</div>';
    drawEvoChart();
  }

  // Conciliação: de quantos incidentes únicos na aba de Impactos (Stream O&L e Planejamento Logístico, qualquer Localidade ou Impacto)
  // até os que entram nos números gerais (origem Tecnologia).
  function reconcileHtml() {
    var u = function (list) { var m = {}; list.forEach(function (r) { m[r.inc] = true; }); return Object.keys(m).length; };
    var rowsP = D.current.rows.filter(function (r) { return M.imonths.indexOf(r.m) !== -1 && (!M.iw.cutCur || !isNum(r.ab) || r.ab <= M.iw.cutCur); });
    var rowsY = D.current.rows;
    var nP = u(rowsP), tP = u(rowsP.filter(function (r) { return r.tec; })), cP = u(rowsP.filter(function (r) { return r.tec && r.card; }));
    var nY = u(rowsY), tY = u(rowsY.filter(function (r) { return r.tec; }));
    var noM = u(rowsY.filter(function (r) { return !r.m; }));
    var st = D.current.incStats, extra = '';
    if (st && st.divergent) extra += ' · ' + st.divergent + ' ' + plural(st.divergent, 'incidente tem', 'incidentes têm') + ' "Tecnologia" diferente entre a aba de Impactos e a MajorIncidentes (vale a aba de Impactos)';
    if (noM) extra += ' · ' + noM + ' sem mês identificado (fora de qualquer período)';
    return '<div class="reconcile legend">' + icon('info') + '<span><b>Conciliação ' + esc(M.labels.curYear) + '</b> — Stream O&amp;L e Planejamento Logístico, qualquer Localidade/Impacto/Sistema, origem Tecnologia: ' +
      '<b>ano inteiro (' + esc(M.labels.curYear) + ' com todos os meses da aba): ' + tY + ' de ' + nY + ' incidentes únicos</b> · período selecionado (' + esc(M.labels.cur) + '): <b>' + tP + ' de ' + nP + '</b>' +
      ' · desses ' + tP + ', ' + cP + ' impactaram países CARD (' + (state.card === 'exc' ? 'ficam fora dos fluxos e localidades; contam no total geral' : 'incluídos nos fluxos') + ')' + extra + '.</span></div>';
  }

  function rankHtml() {
    var keyOf = { tec: function (r) { return r.tImp; }, ofe: function (r) { return r.ofe; }, loc: function (r) { return r.unm ? null : r.entName; } }[state.rank];
    function count(rows) {
      var m = {};
      (rows || []).forEach(function (r) { var k = keyOf(r); if (!k || k === 'N/A') return; (m[k] = m[k] || {})[r.inc] = true; });
      var out = {};
      Object.keys(m).forEach(function (k) { out[k] = Object.keys(m[k]).length; });
      return out;
    }
    var cc = count(M.rowsCur), pc = M.rowsPrev ? count(M.rowsPrev) : null;
    var keys = Object.keys(cc).sort(function (a, b) { return cc[b] - cc[a] || a.localeCompare(b); }).slice(0, 8);
    if (!keys.length) return '<div class="empty">Sem incidentes no período.</div>';
    var max = cc[keys[0]];
    return '<div class="rank-head"><span>#</span><span>Item</span><span></span><span>' + esc(M.labels.curYear) + '</span><span>vs ' + esc(M.labels.prevYear) + '</span></div><ul class="rank-list">' +
      keys.map(function (k, i) {
        var dl = deltaCount(cc[k], pc ? (pc[k] || 0) : null, 'lower');

  function monthlySeries(yd) {

  // Avisos do fluxo: troca de sistema no Planejamento e linhas fora das Localidades do catálogo (fluxos estritos).
  function flowNotes(f) {

  function sortEntities(list, mode) {

        var d = b.cur.incidents - a.cur.incidents || b.cur.sev0 - a.cur.sev0;

  function entitiesHtml(f) {
    var mode = state.entSort[f.cfg.key] || 'impacto';
    if (!f.entities.length) return '<div class="empty">Nenhuma localidade ou sistema mapeado para este fluxo.</div>';
    if (f.cfg.entityType === 'sistema') return '<div class="ent-grid">' + sortEntities(f.entities, mode).map(function (e) { return entCard(f, e); }).join('') + '</div>';
    var groups = {};
    f.entities.forEach(function (e) { var k = e.country || 'nd'; (groups[k] = groups[k] || []).push(e); });
    var keys = Object.keys(groups).sort(function (a, b) {
      var ia = COUNTRY_ORDER.indexOf(a), ib = COUNTRY_ORDER.indexOf(b);
      return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    });
    if (mode === 'impacto') {
      keys.sort(function (a, b) {
        var sa = groups[a].reduce(function (s, e) { return s + e.cur.incidents; }, 0), sb = groups[b].reduce(function (s, e) { return s + e.cur.incidents; }, 0);
        if (sb !== sa) return sb - sa;
        var ia = COUNTRY_ORDER.indexOf(a), ib = COUNTRY_ORDER.indexOf(b);
        return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
      });
    }
    var big = keys.filter(function (k) { return groups[k].length >= 3; });
    var small = keys.filter(function (k) { return groups[k].length < 3; });
    return big.map(function (k) { return groupHtml(k, false); }).join('') +
      (small.length ? '<div class="cgroups-multi">' + small.map(function (k) { return groupHtml(k, true); }).join('') + '</div>' : '');

      var list = sortEntities(groups[k], mode);
      var inc = {}, incPrev = {};
      list.forEach(function (e) { e.curRows.forEach(function (r) { inc[r.inc] = true; }); e.prevRows.forEach(function (r) { incPrev[r.inc] = true; }); });
      var nC = Object.keys(inc).length, nP = Object.keys(incPrev).length;
      var cDisp = countryDisp(f.cfg.key, k);
      return '<div class="cgroup' + (compact ? ' compact' : '') + '"><div class="cgroup-head">' + (k !== 'nd' ? flag(k, true) : icon('pin')) + '<span class="nm">' + esc(COUNTRY_NAMES[k] || (k === 'nd' ? 'País não informado' : k.toUpperCase())) + '</span>' +
        (compact ? '' : '<span class="legend">' + list.length + ' ' + plural(list.length, 'localidade', 'localidades') + '</span>') +
        '<span class="cg-meta">' + (cDisp && isNum(cDisp.cv) ? '<span class="legend">Disponibilidade ' + fmtPct(cDisp.cv) + '</span>' + chip(cDisp.status, true) + deltaHtml(cDisp.delta) : '') +
        '<span class="legend">' + nC + ' ' + plural(nC, 'incidente', 'incidentes') + '</span>' + deltaHtml(deltaCount(nC, M.rowsPrev ? nP : null, 'lower')) + '</span></div>' +
        '<div class="ent-grid">' + list.map(function (e) { return entCard(f, e); }).join('') + '</div></div>';

  }
  // Disponibilidade do país dentro do fluxo (nó L3 "Brasil", "Chile"...), quando existir na aba de Disponibilidade.
  function countryDisp(flowKey, iso) {

  }

  /* -------------------------------------------- Disponibilidade retrospectiva */
  function granColumns() {
    var g = state.gran, cols = [];
    if (g === 'month') for (var m = 1; m <= 12; m++) cols.push({ key: 'm' + m, label: MABBR[m - 1], months: [m] });
    if (g === 'quarter') for (var q = 1; q <= 4; q++) cols.push({ key: 'q' + q, label: 'Q' + q, months: range((q - 1) * 3 + 1, q * 3) });
    if (g === 'semester') { cols.push({ key: 's1', label: '1º Sem', months: range(1, 6) }); cols.push({ key: 's2', label: '2º Sem', months: range(7, 12) }); }
    var info = statusInfo(D.current.statuses);
    if (g === 'ytd') {
      if (info.closed) cols.push({ key: 'ytd', label: 'YTD Jan–' + MABBR[info.closed - 1], months: range(1, info.closed) });
      if (info.avail > info.closed) cols.push({ key: 'ytdp', label: 'YTD Jan–' + MABBR[info.avail - 1] + ' (parcial)', months: range(1, info.avail) });
    } else if (info.closed) {
      cols.push({ key: 'ytd', label: 'YTD', months: range(1, info.closed), ytd: true });
    }
    return cols;
  }
  function colStatus(months) {
    var st = D.current.statuses;
    if (months.some(function (m) { return st[m - 1] === 'NAO_INICIADO'; })) return 'pending';
    if (months.some(function (m) { return st[m - 1] === 'PARCIAL'; })) return 'partial';
    return 'closed';
  }
  function dispRows() {
    var out = [];
    function push(path, depth, kind) {
      var n = IDX.cur[path];
      if (!n) return;
      out.push({ path: path, node: n, depth: depth, kind: kind });
      if (kind !== 'ol' && n.children && n.children.length && state.expanded[path]) {
        n.children.forEach(function (c) { push(c._path, depth + 1, 'child'); });
      }
    }
    if (IDX.cur.ol) push('ol', 0, 'ol');
    D.config.flows.forEach(function (f) { push('f:' + f.key, 0, 'flow'); });
    return out;
  }
  var EXPEDITION_TIP = 'Apuração das Janelas de Expedição: Janelas Totais x Janelas Perdidas por incidentes de Tecnologia.';
  function renderDisponibilidade() {
    var sec = $('sec-disponibilidade');

      return '<button type="button" data-v="' + o[0] + '"' + (state.gran === o[0] ? ' class="is-active"' : '') + '>' + o[1] + '</button>'; }).join('') + '</div>' +
      '<div class="status-legend legend">' + [STATUS.atencao, STATUS.minimo, STATUS.meta, STATUS.desafio].map(function (s) { return '<span style="display:inline-flex;align-items:center;gap:5px">' + sdot(s) + s.label + '</span>'; }).join('') +
      '<span>◔ parcial</span><span>▲▼ variação em p.p. vs ' + D.previous.year + '</span></div></div>';

    }).join('') + '</tr></thead>';

        (isExpeditionNode(r.path, n) ? '<span class="tag is-win" data-tip="' + esc(EXPEDITION_TIP) + '">Janelas de Expedição</span>' : '') + '</div>';
      var cells = cols.map(function (c) {

        if (!isNum(d.cv)) return '<td' + (c.ytd ? ' class="c-ytd"' : '') + '><div class="cell is-pending" data-tip="Sem dado no período">s/ dado</div></td>';
        var tip = (r.kind === 'ol' ? 'O&L' : n.name) + '\n' + c.label + '/' + D.current.year + ': ' + fmtPct(d.cv) + ' (' + d.status.label + ')' +
          (hasRefs(d.refs) ? '\nMínimo ' + fmtPct(d.refs.min) + ' · Meta ' + fmtPct(d.refs.meta) + ' · Desafio ' + fmtPct(d.refs.des) : '') +
          '\n' + c.label + '/' + D.previous.year + ': ' + (isNum(d.pv) ? fmtPct(d.pv) : 'sem dado') +
          (d.delta.cls !== 'nobase' ? '\nVariação: ' + d.delta.txt : '') + (d.cur.partial ? '\nApuração parcial — dado provisório' : '') +
          (d.cur.official === false && !d.cur.adjusted ? '\nConsolidado calculado (média simples dos meses)' : '') +
          (d.cur.adjusted ? '\nSem outliers (estimado) — oficial: ' + fmtPct(dispFor(r.path, c.months, 'com').cv) : '');
        return '<td' + (c.ytd ? ' class="c-ytd"' : '') + '><div class="cell' + (d.cur.partial ? ' is-partial' : '') + (d.cur.adjusted ? ' is-adj' : '') + '" data-tip="' + esc(tip) + '"><span class="cv">' + sdot(d.status) + fmtNum(d.cv, 2) + '</span>' +
          '<span class="cd ' + d.delta.cls + '">' + (d.delta.cls === 'nobase' ? '—' : (d.delta.arrow === '=' ? '= ' : d.delta.arrow + ' ') + fmtSigned(d.delta.d, 2)) + '</span></div></td>';
      }).join('');
      return '<tr class="lv-' + r.kind + (state.sel === r.path ? ' is-selected' : '') + '" data-action="select-row" data-path="' + esc(r.path) + '"><td class="rowh">' + nameHtml + '</td>' + cells + '</tr>';
    }).join('') + '</tbody>';

    sec.innerHTML = head + (noPrev ? '<div class="notice is-info">' + icon('info') + '<div>Aba Disponibilidade_' + D.previous.year + ' não encontrada: as variações em p.p. ficam sem base.</div></div>' : '') +
      toolbar + '<div class="matrix-wrap"><table class="matrix">' + thead + tbody + '</table></div>' +
      '<div class="legend" style="margin-top:6px">Clique em uma linha para ver o detalhe (faixa Mínimo · Meta · Desafio, comparativos em p.p. e evolução). Use ▸ para abrir países, CDs e sistemas.</div>' +
      '<div class="notice is-info" style="margin-top:12px">' + icon('info') + '<div><b>Fluxo de Separação, Faturamento e Transporte:</b> as linhas <b>“Faturamento”</b> e <b>“Faturamento + nome do CD”</b> (marcadas como <span class="tag is-win">Janelas de Expedição</span>) representam a apuração das <b>Janelas de Expedição Totais x Perdidas</b> por incidentes de Tecnologia — e não a disponibilidade de um sistema.</div></div>' +
      '<div id="ol-disp-detail"></div>';
    renderDispDetail();
  }

  // Comparativos em p.p. vs o mesmo período do ano anterior: YTD, trimestres e semestres (períodos não iniciados ficam indisponíveis).
  function ppGridHtml(path) {
    var info = statusInfo(D.current.statuses), periods = [];
    if (info.closed) periods.push({ k: (info.closed === 12 ? 'Ano' : 'YTD Jan–' + MABBR[info.closed - 1]), months: range(1, info.closed) });
    if (info.avail > info.closed) periods.push({ k: 'YTD Jan–' + MABBR[info.avail - 1], months: range(1, info.avail) });
    for (var q = 1; q <= 4; q++) periods.push({ k: 'Q' + q, months: range((q - 1) * 3 + 1, q * 3) });
    periods.push({ k: '1º Sem', months: range(1, 6) });
    periods.push({ k: '2º Sem', months: range(7, 12) });
    return '<div class="pp-grid">' + periods.map(function (pp) {
      var st = colStatus(pp.months);
      if (st === 'pending') return '<div class="pp-cell is-pending"><div class="k">' + esc(pp.k) + '</div><div class="v muted" style="font-size:12px">não iniciado</div></div>';
      var x = dispFor(path, pp.months);
      return '<div class="pp-cell' + (st === 'partial' ? ' is-partial' : '') + '" data-tip="' + esc(pp.k + '/' + D.current.year + ': ' + fmtPct(x.cv) + (x.cur && x.cur.official === false ? ' (média dos meses)' : '') + '\n' + pp.k + '/' + D.previous.year + ': ' + fmtPct(x.pv) + (st === 'partial' ? '\nInclui mês com apuração parcial' : '')) + '">' +
        '<div class="k">' + esc(pp.k) + (st === 'partial' ? ' ◔' : '') + '</div><div class="v">' + (isNum(x.cv) ? sdot(x.status) + ' ' + fmtNum(x.cv, 2) + '%' : '—') + '</div>' +
        '<div class="d ' + x.delta.cls + '">' + (x.delta.cls === 'nobase' ? 'sem base' : x.delta.arrow + ' ' + x.delta.txt) + '</div></div>';
    }).join('') + '</div>';
  }

  // Evolução do nó selecionado na granularidade escolhida (Mensal/Trimestral/Semestral/YTD): barras do ano atual (cor do status)
  // ao lado das barras neutras do mesmo período do ano anterior; só a Meta como linha tracejada.
  function drawDispChart(path) {
    var cv = $('ol-chart-disp');
    if (!cv || !window.Chart) return;
    if (charts.disp) { charts.disp.destroy(); charts.disp = null; }
    var n = IDX.cur[path];
    var refs = { min: n.min, meta: n.meta, des: n.des };
    var cols = granColumns();
    var labels = cols.map(function (c) { return c.label; });
    var res = cols.map(function (c) {
      if (colStatus(c.months) === 'pending') return { pending: true, cv: null, pv: null, partial: false };
      var d = dispFor(path, c.months);
      return { cv: isNum(d.cv) ? r2(d.cv) : null, pv: isNum(d.pv) ? r2(d.pv) : null, partial: !!(d.cur && d.cur.partial), adj: !!(d.cur && d.cur.adjusted), delta: d.delta, status: d.status };
    });
    var cur = res.map(function (x) { return x.cv; }), prev = res.map(function (x) { return x.pv; });
    var colors = cur.map(function (v) { return STATUS_COLOR[statusOf(v, refs).key] || STATUS_COLOR.none; });
    var all = cur.concat(prev).filter(isNum);
    if (hasRefs(refs)) all.push(r2(refs.meta));
    var lo = all.length ? Math.min.apply(null, all) : 99, hi = all.length ? Math.max.apply(null, all) : 100;
    var pad = Math.max(0.06, (hi - lo) * 0.35);
    var ds = [
      { type: 'bar', label: String(D.current.year), data: cur, backgroundColor: colors, borderColor: res.map(function (x) { return x.partial ? '#7a5410' : 'transparent'; }), borderWidth: 1.5, borderRadius: 3, categoryPercentage: 0.78, barPercentage: 0.92, maxBarThickness: 44, order: 2 },
      { type: 'bar', label: String(D.previous.year), data: prev, backgroundColor: '#C9CEC4', borderRadius: 3, categoryPercentage: 0.78, barPercentage: 0.92, maxBarThickness: 44, order: 2 }
    ];
    if (hasRefs(refs)) ds.push({ type: 'line', label: 'Meta ' + fmtPct(refs.meta), data: labels.map(function () { return r2(refs.meta); }), borderColor: '#4E6B36', borderDash: [6, 5], borderWidth: 1.5, pointRadius: 0, order: 1, datalabels: { display: false } });
    charts.disp = new Chart(cv, {
      data: { labels: labels, datasets: ds },
      options: {
        responsive: true, maintainAspectRatio: false, layout: { padding: { top: 22, right: 6 } },
        plugins: {
          legend: { position: 'top', align: 'end', labels: { boxWidth: 10, boxHeight: 10, font: { size: 11 } } },
          tooltip: { callbacks: {
            title: function (items) { return items.length ? (state.gran === 'month' ? MONTHS[items[0].dataIndex] : labels[items[0].dataIndex]) : ''; },
            label: function (ctx) {
              var v = ctx.parsed.y; if (!isNum(v)) return ctx.dataset.label + ': —';
              var x = res[ctx.dataIndex], extra = '';
              if (ctx.datasetIndex === 0) { extra = (x.status ? ' · ' + x.status.label : '') + (x.delta && x.delta.cls !== 'nobase' ? ' · ' + x.delta.txt + ' vs ' + D.previous.year : '') + (x.partial ? ' · parcial' : '') + (x.adj ? ' · sem outliers (estimado)' : ''); }
              return ctx.dataset.label + ': ' + fmtPct(v) + extra;
            }
          } },
          datalabels: {
            // com muitas colunas (mensal) só o ano atual tem rótulo; o ano anterior fica no tooltip
            display: function (ctx) { return (ctx.datasetIndex === 0 || (ctx.datasetIndex === 1 && cols.length <= 6)) && isNum(ctx.dataset.data[ctx.dataIndex]); },
            anchor: 'end', align: 'end', offset: 1, clamp: true,
            font: function (ctx) { return { size: cols.length > 6 ? 9.5 : (ctx.datasetIndex === 0 ? 10.5 : 9.5), weight: ctx.datasetIndex === 0 ? '700' : '500' }; },
            color: function (ctx) { return ctx.datasetIndex === 0 ? '#333D20' : '#7B8374'; },
            formatter: function (v) { return fmtNum(v, 2); }
          }
        },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 11 } } },
          y: { min: Math.max(0, Math.floor((lo - pad) * 20) / 20), max: Math.min(100, Math.ceil((hi + pad) * 20) / 20), grid: { color: 'rgba(51,61,32,.08)' }, ticks: { font: { size: 10 }, callback: function (v) { return fmtNum(v, 2) + '%'; } } }
        }
      }
    });
  }

          '<td>' + esc(Object.keys(I.imps).join(', ')) + '</td>' +
          '<td class="nowrap">' + fmtHM(I.ttr) + (I.outlier ? ' <span class="tag" data-tip="TTR ≥ limiar de outlier (Sev 0 ≥ ' + fmtHM(T.outlierSev0) + ' · Sev 1 ≥ ' + fmtHM(T.outlierSev1) + ')">outlier</span>' : '') + (!I.foundMI ? '<div class="desc">não consta em MajorIncidentes</div>' : '') + '</td>' +
          (olaOn() ? '<td class="nowrap">' + ola + '</td>' : '') + '<td>' + esc(Object.keys(I.tImp).join(', ') || '—') + '</td><td>' + esc(Object.keys(I.ofe).join(', ') || '—') + '</td>' +
          '<td class="nowrap">' + esc(Object.keys(I.prb).join(', ') || '—') + '</td>' +

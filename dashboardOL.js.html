      }).join('') + '</tbody></table></div>' : '<div class="empty">Sem incidentes neste período.</div>';
    var sum = '<div class="legend">' + a.incidents + ' ' + plural(a.incidents, 'incidente', 'incidentes') + ' · ' + a.sev0 + ' Sev 0 · ' + a.sev1 + ' Sev 1 · MTTR ' + fmtHM(a.mttr) + (olaOn() ? ' · ' + OLA_NAME + ' ' + fmtPct(a.ola, 1) : '') + '</div>' + modalCompare(o, a);
    $('ol-modal-root').innerHTML = '<div class="modal-overlay" data-action="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="ol-modal-title">' +
      '<div class="modal-head">' + tile(o.icon || 'list') + '<div class="titles"><div class="eyebrow">' + esc(o.eyebrow || 'Incidentes de O&L') + '</div><h3 id="ol-modal-title">' + esc(o.title) + '</h3>' + sum + '</div>' +
      '<button type="button" class="close-x" data-action="modal-close" aria-label="Fechar">' + icon('close') + '</button></div>' +
      '<div class="modal-body"><div class="modal-tools">' + seg + '<button type="button" class="btn" data-action="modal-export">' + icon('download') + 'Exportar Excel</button></div>' + table + '</div></div></div>';
    document.body.style.overflow = 'hidden';
  }
  /* ------------------------------------------------ Conferir lista de incidentes */
  // Cole os números dos incidentes (ex.: filtro da aba Major_Incidents_Impactos: Stream = O&L/Planejamento Logístico e Tecnologia = Sim)
  // e veja, para cada um, se entra nos números da tela e, se não, o motivo.
  var CHECK = { text: '', res: null };
  function openCheckModal() {
    state.modal = { check: true };
    document.body.style.overflow = 'hidden';
    renderCheckModal();
  }
  function renderCheckModal() {
    var r = CHECK.res, cy = D.current.year;
    var body = '<p class="legend" style="margin:0 0 8px">Cole os números dos incidentes (um por linha, ou separados por espaço/vírgula). A conferência olha a aba <b>Major_Incidents_Impactos_' + cy + '</b> inteira, em todos os meses, e mostra por que cada incidente entra ou não nos números da tela (período selecionado: <b>' + esc(M.labels.cur) + '</b>).</p>' +
      '<textarea id="ol-check-text" class="check-text" placeholder="INC0830657&#10;INC0835824&#10;…" spellcheck="false">' + esc(CHECK.text) + '</textarea>' +
      '<div class="modal-tools" style="margin-top:10px"><button type="button" class="btn btn-accent" data-action="check-run">' + icon('check') + 'Conferir</button>' + (r ? '<button type="button" class="btn" data-action="check-export">' + icon('download') + 'Exportar Excel</button>' : '') + '</div>' + (r ? checkResultHtml(r) : '');
    $('ol-modal-root').innerHTML = '<div class="modal-overlay" data-action="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="ol-modal-title">' +
      '<div class="modal-head">' + tile('check') + '<div class="titles"><div class="eyebrow">Incidentes de O&amp;L</div><h3 id="ol-modal-title">Conferir lista de incidentes</h3></div>' +
      '<button type="button" class="close-x" data-action="modal-close" aria-label="Fechar">' + icon('close') + '</button></div><div class="modal-body">' + body + '</div></div></div>';
  }
  function checkClassify(id) {
    var rows = D.current.rows.filter(function (r) { return r.inc === id; });
    if (!rows.length) {
      var other = D.current.diag && D.current.diag.otherStreams && D.current.diag.otherStreams[id];
      if (other) return { st: 'stream', label: 'Stream fora de O&L/Planejamento', det: 'Coluna B = "' + other + '"' };
      if (D.previous.rows.some(function (r) { return r.inc === id; })) return { st: 'ano', label: 'É de ' + D.previous.year, det: 'Está na aba Major_Incidents_Impactos_' + D.previous.year };
      return { st: 'nf', label: 'Não encontrado', det: 'Não existe na aba Major_Incidents_Impactos_' + D.current.year + ' (nem nas Streams O&L/Planejamento Logístico)' };
    }
    var tecTxt = uniq(rows.map(function (r) { return r.tecTxt || '(em branco)'; })).join(', ');
    var m = rows[0].m, mon = m ? MONTHS[m - 1] : '—';
    if (!rows.some(function (r) { return r.tec; })) return { st: 'tec', label: 'Origem não é Tecnologia', det: 'Coluna P = ' + tecTxt, m: m };
    if (!m) return { st: 'nomes', label: 'Sem mês identificado', det: 'Colunas J (Mês) e K (Abertura) sem mês válido', m: m };
    var stt = D.current.statuses[m - 1];
    if (M.imonths.indexOf(m) === -1) return { st: 'per', label: 'Fora do período selecionado', det: mon + ' não está em ' + M.labels.cur, m: m };
    var ab = rows[0].ab;
    if (M.iw.cutCur && isNum(ab) && ab > M.iw.cutCur) return { st: 'per', label: 'Depois de hoje', det: 'Abertura em ' + fmtDate(ab), m: m };
    return { st: 'ok', label: stt === 'PARCIAL' ? 'Contado (mês parcial)' : 'Contado', det: mon + ' · ' + (rows[0].st || ''), m: m, partial: stt === 'PARCIAL', card: rows.every(function (r) { return r.card; }) };
  }
  function runCheck() {
    var ta = $('ol-check-text');
    CHECK.text = ta ? ta.value : CHECK.text;
    var ids = uniq((CHECK.text.toUpperCase().match(/INC\d+/g) || []));
    var items = ids.map(function (id) { var c = checkClassify(id); c.id = id; return c; });
    var listed = {}; ids.forEach(function (id) { listed[id] = true; });
    // incidentes que a tela considera (origem Tecnologia, qualquer mês do ano) e não estão na lista informada
    var extra = [], seen = {};
    D.current.rows.forEach(function (r) { if (r.tec && !listed[r.inc] && !seen[r.inc]) { seen[r.inc] = true; extra.push({ id: r.inc, m: r.m, st: r.st, month: r.m ? MONTHS[r.m - 1] : '—' }); } });
    CHECK.res = { items: items, extra: extra, n: ids.length };
    renderCheckModal();
  }
  function checkResultHtml(r) {
    var by = {}; r.items.forEach(function (i) { (by[i.st] = by[i.st] || []).push(i); });
    var cnt = function (k) { return (by[k] || []).length; };
    var found = r.items.length - cnt('nf') - cnt('ano') - cnt('stream');
    var sum = '<div class="check-sum"><div><span class="n num">' + r.n + '</span><span class="legend">na sua lista</span></div>' +
      '<div><span class="n num ok">' + cnt('ok') + '</span><span class="legend">contados no período</span></div>' +
      '<div><span class="n num">' + (cnt('per') + cnt('nomes')) + '</span><span class="legend">fora por mês/período</span></div>' +
      '<div><span class="n num">' + (cnt('tec') + cnt('stream')) + '</span><span class="legend">fora por Stream/origem</span></div>' +
      '<div><span class="n num">' + (cnt('nf') + cnt('ano')) + '</span><span class="legend">não encontrados no ano</span></div>' +
      '<div><span class="n num">' + r.extra.length + '</span><span class="legend">na tela, fora da lista</span></div></div>';
    var rest = r.items.filter(function (i) { return i.st !== 'ok'; });
    var tbl = rest.length ? '<div class="tbl-wrap" style="max-height:320px"><table class="tbl"><thead><tr><th>Incidente</th><th>Motivo</th><th>Detalhe</th></tr></thead><tbody>' +
      rest.map(function (i) { return '<tr><td class="id">' + esc(i.id) + '</td><td class="nowrap"><span class="tag">' + esc(i.label) + '</span></td><td>' + esc(i.det) + '</td></tr>'; }).join('') + '</tbody></table></div>' :
      '<div class="empty">Todos os ' + r.n + ' incidentes da lista entram nos números do período selecionado.</div>';
    var ex = r.extra.length ? '<div class="sub-title" style="margin-top:14px">' + icon('alert') + 'Na tela (origem Tecnologia, ' + D.current.year + ') e fora da sua lista</div><div class="legend">' + esc(r.extra.slice(0, 60).map(function (e) { return e.id + ' (' + e.month + ')'; }).join(', ')) + (r.extra.length > 60 ? '…' : '') + '</div>' : '';
    return sum + '<div class="sub-title" style="margin-top:14px">' + icon('list') + 'Incidentes da lista que não entram nos números do período' + '</div>' + tbl + ex +
      '<div class="legend" style="margin-top:10px">Encontrados na aba: ' + found + ' de ' + r.n + '. "Contados no período" respeitam o período (incidentes até hoje) e a origem Tecnologia; o filtro CARD não altera o total geral.</div>';
  }
  function exportCheck() {
    if (!CHECK.res || !window.XLSX) return;
    var rows = CHECK.res.items.map(function (i) { return { 'Incidente': i.id, 'Situação': i.label, 'Detalhe': i.det }; })
      .concat(CHECK.res.extra.map(function (e) { return { 'Incidente': e.id, 'Situação': 'Na tela, fora da lista', 'Detalhe': e.month + ' · ' + e.st }; }));
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Conferência');
    XLSX.writeFile(wb, 'OL_conferencia_incidentes.xlsx');
  }

  // Comparativo com o outro ano: a volumetria do ano anterior só aparece aqui (ao abrir o card).
  function modalCompare(o, a) {
    if (!o.rowsPrev) return '';
    var other = o.which === 'cur' ? agg(D.previous, o.rowsPrev) : agg(D.current, o.rowsCur);
    var lblO = o.which === 'cur' ? M.labels.prev : M.labels.cur;
    var dl = o.which === 'cur' ? deltaCount(a.incidents, other.incidents, 'lower') : deltaCount(other.incidents, a.incidents, 'lower');
    return '<div class="modal-cmp"><span class="eyebrow">' + esc(lblO) + '</span><b>' + other.incidents + ' ' + plural(other.incidents, 'incidente', 'incidentes') + '</b> · ' + other.sev0 + ' Sev 0 · ' + other.sev1 + ' Sev 1 · MTTR ' + fmtHM(other.mttr) +
      ' · ' + esc(M.labels.curYear) + ' vs ' + esc(M.labels.prevYear) + ': ' + deltaHtml(o.which === 'cur' ? dl : deltaCount(other.incidents, a.incidents, 'lower')) + '</div>';
  }
  function exportModal() {
    var o = state.modal;
    if (!o || !o.lastAgg || !window.XLSX) return;
    var data = o.lastAgg.list.map(function (I) {
      return {
        'Incidente': I.id, 'Stream': I.st, 'Severidade': isNum(I.sev) ? 'Sev ' + I.sev : '', 'Abertura': fmtDate(I.ab),
        'Fluxo(s)': Object.keys(I.flows).map(function (k) { var f = D.config.flows.find(function (x) { return x.key === k; }); return f ? f.short : 'Sem fluxo'; }).join(', '),
        'Localidade(s) / Sistema(s)': Object.keys(I.ents).join(', '), 'Mercado(s)': Object.keys(I.mks).join(', ').toUpperCase(),
        'Impacto(s)': Object.keys(I.imps).join(', '), 'TTR (MI)': fmtHM(I.ttr),
        'Dentro do OLA de resolução': I.olaOk === null ? '' : (I.olaOk ? 'Sim' : 'Não'), 'Origem da Detecção': I.origem,
        'Tecnologia impactada': Object.keys(I.tImp).join(', '), 'Ofensor': Object.keys(I.ofe).join(', '), 'Problem': Object.keys(I.prb).join(', '),
        'Título': I.tit, 'Descrição do impacto': I.dImp, 'Descrição do ofensor': I.dOf, 'Solução': I.sol
      };
    });
    var ws = XLSX.utils.json_to_sheet(data), wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Incidentes');
    XLSX.writeFile(wb, ('OL_' + (o.title || 'incidentes') + '_' + (o.which === 'cur' ? M.labels.cur : M.labels.prev)).replace(/[^\w\-]+/g, '_') + '.xlsx');
  }
  function countIncs(rows) { var s = {}; (rows || []).forEach(function (r) { s[r.inc] = true; }); return Object.keys(s).length; }
  function modalOpts(title, eyebrow, ic, rowsCur, rowsPrev, entLabel) {
    return { title: title, eyebrow: eyebrow, icon: ic, rowsCur: rowsCur, rowsPrev: rowsPrev, entLabel: entLabel,
      rowsCurCount: function () { return countIncs(rowsCur); }, rowsPrevCount: function () { return countIncs(rowsPrev); } };
  }

  /* ------------------------------------------------------------ eventos */
  function onClick(ev) {
    var t = ev.target.closest('[data-action], .seg button');
    if (!t) return;
    var segEl = t.closest('.seg');
    if (segEl && t.tagName === 'BUTTON' && !t.hasAttribute('data-action')) { onSeg(segEl, t.getAttribute('data-v')); return; }
    var a = t.getAttribute('data-action');
    if (a === 'goto') { var el = $(t.getAttribute('data-target')); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    else if (a === 'open-all') openIncidentsModal(modalOpts('Todos os fluxos de O&L', 'Incidentes de O&L', 'truck', M.rowsCur, M.rowsPrev));
    else if (a === 'open-flow') {
      var f = M.flows.find(function (x) { return x.cfg.key === t.getAttribute('data-flow'); });
      if (f) openIncidentsModal(modalOpts(f.cfg.label, 'Incidentes do fluxo', f.cfg.icon, f.rowsCur, f.rowsPrev));
    } else if (a === 'open-entity') {
      var fl = M.flows.find(function (x) { return x.cfg.key === t.getAttribute('data-flow'); });
      var e = fl && fl.entities.find(function (x) { return x.key === t.getAttribute('data-ent'); });
      if (e) openIncidentsModal(modalOpts(e.name, fl.cfg.short, entIcon(e), e.curRows, fl.rowsPrev ? e.prevRows : null));
    } else if (a === 'toggle-row') {
      ev.stopPropagation();
      var p = t.getAttribute('data-path');
      state.expanded[p] = !state.expanded[p];
      renderDisponibilidade();
    } else if (a === 'select-row') {
      state.sel = t.getAttribute('data-path');
      Array.prototype.forEach.call(document.querySelectorAll('.matrix tbody tr'), function (tr) { tr.classList.toggle('is-selected', tr.getAttribute('data-path') === state.sel); });
      renderDispDetail();
    } else if (a === 'modal-close') closeModal();
    else if (a === 'modal-bg') { if (ev.target === t) closeModal(); }
    else if (a === 'modal-export') exportModal();
    else if (a === 'open-check') openCheckModal();
    else if (a === 'check-run') runCheck();
    else if (a === 'check-export') exportCheck();
    else if (a === 'ola-show' || a === 'ola-hide') { ev.stopPropagation(); state.showOla = a === 'ola-show'; var y2 = window.scrollY; renderAll(); window.scrollTo(0, y2); if (state.modal && !state.modal.check) renderModal(); }
    else if (a === 'out-restore') { var y0 = window.scrollY; initOutliers(); renderAll(); window.scrollTo(0, y0); }
  }
  function onSeg(segEl, v) {
    var id = segEl.id;
    if (id === 'ol-card') { if (state.card === v) return; state.card = v; setSegActive(segEl, v); ADJ = {}; var y3 = window.scrollY; renderAll(); window.scrollTo(0, y3); }
    else if (id === 'ol-outmode') { if (state.outMode === v) return; state.outMode = v; setSegActive(segEl, v); ADJ = {}; var y1 = window.scrollY; renderAll(); window.scrollTo(0, y1); }
    else if (id === 'ol-out-scope') { state.outScope = v; renderOutliers(); }
    else if (id === 'ol-out-month') { state.outMonth = Number(v); renderOutliers(); }
    else if (id === 'ol-evo-metric') { state.chartMetric = v; setSegActive(segEl, v); if (charts.evo) { charts.evo.destroy(); charts.evo = null; } drawEvoChart(); }
    else if (id === 'ol-rank-tab') { state.rank = v; setSegActive(segEl, v); $('ol-rank-body').innerHTML = rankHtml(); }
    else if (id === 'ol-gran') { state.gran = v; renderDisponibilidade(); }
    else if (id === 'ol-modal-year') { state.modal.which = v; renderModal(); }
    else if (segEl.hasAttribute('data-ent-sort')) {
      var key = segEl.getAttribute('data-ent-sort');
      state.entSort[key] = v;
      var y = window.scrollY;
      renderFlows();
      window.scrollTo(0, y);
    }
  }
  function setSegActive(segEl, v) { Array.prototype.forEach.call(segEl.querySelectorAll('button'), function (b) { b.classList.toggle('is-active', b.getAttribute('data-v') === v); }); }
  function onKey(ev) {
    if (ev.key === 'Escape' && state.modal) { closeModal(); return; }
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.getAttribute && ev.target.getAttribute('role') === 'button' && ev.target.hasAttribute('data-action')) { ev.preventDefault(); ev.target.click(); }
  }

  // Tooltip flutuante para [data-tip]
  var tipEl = null;
  function onOver(ev) {
    var t = ev.target.closest('[data-tip]');
    if (!t) return;
    tipEl = tipEl || $('ol-tooltip');
    tipEl.textContent = t.getAttribute('data-tip');
    tipEl.hidden = false;
    var r = t.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    var x = Math.min(window.innerWidth - w - 8, Math.max(8, r.left + r.width / 2 - w / 2));
    var y = r.top - h - 8;
    if (y < 8) y = r.bottom + 8;
    tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
  }
  function onOut(ev) {
    var t = ev.target.closest('[data-tip]');
    if (!t || (ev.relatedTarget && t.contains(ev.relatedTarget))) return;
    if (tipEl) tipEl.hidden = true;
  }

  var spy = null;
  function setupScrollSpy() {
    if (spy || !('IntersectionObserver' in window)) return;
    var links = Array.prototype.slice.call(document.querySelectorAll('#ol-nav a'));
    spy = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        links.forEach(function (l) { l.classList.toggle('is-active', l.getAttribute('data-sec') === en.target.id); });
      });
    }, { rootMargin: '-150px 0px -60% 0px' });
    links.forEach(function (l) { var s = $(l.getAttribute('data-sec')); if (s) spy.observe(s); });
  }
  function rebindSpy() { if (spy) { spy.disconnect(); spy = null; } setupScrollSpy(); }

  function destroyCharts() { Object.keys(charts).forEach(function (k) { if (charts[k]) charts[k].destroy(); charts[k] = null; }); }

  /* ------------------------------------------------------------- carga */
  function setLoading(on) { $('ol-loading').hidden = !on; }
  function showError(msg) {
    setLoading(false);
    var box = $('ol-error');
    box.hidden = false;
    box.innerHTML = '<div class="error-box"><div class="sub-title" style="color:#691B34">' + icon('alert') + 'Não foi possível carregar a Visão O&amp;L</div><p>' + esc(msg) + '</p><button type="button" class="btn btn-accent" id="ol-retry">Tentar novamente</button></div>';
    $('ol-retry').onclick = function () { box.hidden = true; load(state.year); };
  }
  function fillSelectors() {
    var ys = $('ol-year');
    var years = (D.availableYears && D.availableYears.length ? D.availableYears : [D.year]).slice();
    if (years.indexOf(D.year) === -1) years.unshift(D.year);
    ys.innerHTML = years.map(function (y) { return '<option value="' + y + '"' + (y === D.year ? ' selected' : '') + '>' + y + '</option>'; }).join('');
    ys.disabled = false;
    var ps = $('ol-period'), list = buildPeriods(D.current.statuses), groups = {};
    list.forEach(function (p) { (groups[p.group] = groups[p.group] || []).push(p); });
    ps.innerHTML = ['YTD', 'Trimestres', 'Semestres', 'Meses'].filter(function (g) { return groups[g]; }).map(function (g) {
      return '<optgroup label="' + g + '">' + groups[g].map(function (p) {
        return '<option value="' + p.key + '"' + (p.disabled ? ' disabled' : '') + (p.key === state.periodKey ? ' selected' : '') + '>' + esc(p.label) + (p.disabled ? ' · não iniciado' : (p.partial && p.key !== 'ytdp' ? ' · parcial' : '')) + '</option>';
      }).join('') + '</optgroup>';
    }).join('');
    ps.disabled = false;
  }
  function onData(res) {
    setLoading(false);
    if (!res || !res.ok) { showError((res && res.error) || 'Resposta vazia do servidor.'); return; }
    CACHE[res.year] = res;
    applyData(res);
  }
  function applyData(res) {
    D = res;
    state.year = res.year;
    IDX = { cur: indexDisp(res.current.disponibilidade), prev: indexDisp(res.previous.disponibilidade) };
    initOutliers();
    var p = getPeriod(state.periodKey);
    if (!state.periodKey || p.key !== state.periodKey || p.disabled) state.periodKey = defaultPeriodKey();
    fillSelectors();
    $('ol-error').hidden = true;
    renderAll();
    rebindSpy();
  }
  function load(year) {
    if (year && CACHE[year]) { applyData(CACHE[year]); return; }
    setLoading(true);
    if (!(window.google && google.script && google.script.run)) { showError('google.script.run indisponível (abra pela URL do Web App).'); return; }
    google.script.run.withSuccessHandler(onData).withFailureHandler(function (e) { showError(e && e.message ? e.message : String(e)); }).getOperacaoLogisticaData(year || null);
  }

  function init() {
    if (window.Chart && window.ChartDataLabels) { Chart.register(window.ChartDataLabels); Chart.defaults.set('plugins.datalabels', { display: false }); }
    if (window.Chart) { Chart.defaults.font.family = "'Aptos', 'Segoe UI', system-ui, sans-serif"; Chart.defaults.color = '#333D20'; }
    Array.prototype.forEach.call(document.querySelectorAll('#ol-nav a'), function (a) {
      a.insertAdjacentHTML('afterbegin', icon(a.getAttribute('data-icon')));
      a.addEventListener('click', function (ev) { ev.preventDefault(); var s = $(a.getAttribute('data-sec')); if (s) s.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    });
    var portal = $('ol-portal-link');
    if (portal) portal.href = BASE_URL || '#';
    document.addEventListener('click', onClick);
    document.addEventListener('keydown', onKey);
    document.addEventListener('change', function (ev) {
      var t = ev.target;
      if (!t || t.getAttribute('data-action') !== 'toggle-outlier') return;
      var y = window.scrollY;
      setOutlier(t.getAttribute('data-inc'), t.checked);
      renderAll();
      window.scrollTo(0, y);
    });
    document.addEventListener('mouseover', onOver);
    document.addEventListener('mouseout', onOut);
    window.addEventListener('scroll', function () { if (tipEl) tipEl.hidden = true; }, { passive: true });
    $('ol-year').addEventListener('change', function () { var y = Number(this.value); state.sel = 'ol'; load(y); });
    $('ol-period').addEventListener('change', function () { state.periodKey = this.value; renderAll(); });
    load(null);
  }

  window.OL_DEBUG = { getState: function () { return state; }, getModel: function () { return M; }, getData: function () { return D; } };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
